      } else if (intent === 'thanks') {
        reply = npc.id === 'dad' ? 'Of course.' : this.chooseReply(['Of course.', 'Anytime.', 'Yeah, no problem.']);
      } else if (intent === 'apology') {
        reply = npc.relationship.resentment > 25 ? 'I hear you. I’m still a little annoyed, but I appreciate you saying that.' : 'You’re fine. I appreciate you saying it.';
      } else if (intent === 'greeting') {
        reply = npc.id === 'dad' ? 'Hey. Everything okay?' : this.chooseReply(['Hey, what’s up?', 'Hey. How’s your night going?', 'Hey lol, what’s going on?']);
      } else if (intent === 'acknowledge') {
        reply = topic === 'work' && npc.id === 'maya' ? 'Yeah. I’m just glad the week is over.' : this.chooseReply(['Yeah.', 'Gotcha.', 'Okay, good.']);
      } else if (intent === 'decline') {
        reply = npc.id === 'maya' ? 'That’s fine. No pressure.' : npc.id === 'dad' ? 'Okay. Just let me know what you decide.' : 'No worries.';
      } else if (intent === 'answer') {
        reply = this.contextualFallback(npc, topic, 'statement', context);
      } else if (intent === 'request') {
        if (/\bcall\b/.test(lower)) reply = npc.current.activity === 'working' ? 'I can call when I’m free.' : 'Yeah, give me a few minutes.';
        else if (/\bcome over|hang out|meet|coffee|dinner\b/.test(lower)) reply = npc.id === 'maya' ? 'Maybe. What time were you thinking?' : 'Possibly. What did you have in mind?';
        else reply = 'Maybe. Tell me exactly what you’re asking and I’ll let you know.';
      } else {
        reply = this.contextualFallback(npc, topic, intent, context);
      }

      if (!reply || /^(yeah,? that works\.?|sounds good\.?)$/i.test(reply.trim())) {
        reply = this.contextualFallback(npc, topic, intent === 'question' ? 'question' : 'statement', context);
      }

      this.updateDialogueThread(threadId, { topic, lastNpcIntent: 'reply', lastNpcPlannedReplyTo: respondingToId });
      return { body: reply, topic, intent: 'reply', memoryEvent };
    }

    resolveCall(action) {
      const npc = this.state.npcs[action.npcId];
      const reachable = npc.current.activity !== 'working' || seededRandom(this.state) > 0.45;
      if (!reachable) { this.addActivity('call',`${npc.name} did not answer.`); return { ok: true, type: action.type, minutes: 2, narrative: `${npc.name} does not answer. The call rolls to voicemail.` }; }
      this.markThreadRead(npc.phone.threadId);
      const lower=String(action.raw||'').toLowerCase(); let meaningful=false;
      if(/apolog|sorry|thank|appreciat|support|love|miss you|flirt|date|promise|argu|fight|insult/.test(lower)){
        meaningful=true; const changes=/sorry|apolog|thank|appreciat|support/.test(lower)?{trust:1,affection:1}:/insult|argu|fight/.test(lower)?{respect:-1,resentment:1}:{affection:1};
        this.changeRelationship(npc.id,changes,`Meaningful phone call: ${action.raw}`);
        this.addMemory(npc.id,{event:`Jonathan called ${npc.name}: ${action.raw}`,emotionalValence:(changes.resentment||0)>0?-0.25:0.2,emotionalStrength:0.25,importance:0.35,decay:'normal',private:false,secret:false});
      }
      if(!meaningful) this.addMemory(npc.id, { event: `Jonathan called ${npc.name} and they spoke briefly.`, emotionalValence: 0.05, emotionalStrength: 0.05, importance: 0.1, decay: 'fast', private: false, secret: false });
      this.addActivity('call',`Call with ${npc.name} lasted about 8 minutes.`);
      return { ok: true, type: action.type, minutes: 8, narrative: `${npc.name} answers. You have a brief conversation${meaningful?' that carries some emotional weight':''}.` };
    }

    resolveTravel(action) {
      const s = this.state; const from = s.world.playerLocationId; const to = action.destinationId;
      if (from === to) return { ok: true, type: action.type, minutes: 1, narrative: `You are already at ${s.locations[to].name}.` };
      let minutes = (s.locations[from].travel && s.locations[from].travel[to]) || (s.locations[to].travel && s.locations[to].travel[from]) || 20;
      if (action.mode === 'walk') minutes = Math.max(8, minutes * 3);
      s.world.playerLocationId = to;
      const car = s.player.possessions.find(p => p.id === 'car');
      if (action.mode === 'drive' && car) car.locationId = to;
      this.checkAttendanceOnArrival(to);
      this.log('location', `Player moved from ${from} to ${to}.`);
      return { ok: true, type: action.type, minutes, narrative: `${action.mode === 'walk' ? 'You walk' : 'You drive'} to ${s.locations[to].name}. The trip takes about ${minutes} minutes.` };
    }

    resolveGrab(action) {
      const s = this.state; const item = s.player.possessions.find(p => p.id === action.itemId);
      if (!s.player.inventory.includes(item.id)) s.player.inventory.push(item.id);
      item.locationId = 'carried';
      this.log('inventory', `${item.name} added to carried inventory.`);
      return { ok: true, type: action.type, minutes: 1, narrative: `You grab your ${item.name.toLowerCase()}.` };
    }

    resolveSleep(action) {
      const s = this.state;
      s.player.condition.energy = Math.min(100, s.player.condition.energy + Math.round(action.minutes / 9));
      s.player.condition.hunger = Math.min(100, s.player.condition.hunger + Math.round(action.minutes / 18));
      return { ok: true, type: action.type, minutes: action.minutes, narrative: action.minutes >= 180 ? 'You go to sleep.' : 'You lie down and sleep for a while.' };
    }

    resolvePurchase(action) {
      const s = this.state;
      let source = 'checking';
      if (action.useCash && s.player.money.cash >= action.amount) {
        s.player.money.cash -= action.amount;
        source = 'cash';
      } else {
        s.player.money.checking -= action.amount;
        s.bankTransactions.push({ id: makeId('tx', s), at: s.world.now, amount: action.amount, direction: 'out', description: action.raw.replace(/^i\s+/i, '').slice(0, 80), balanceAfter: s.player.money.checking });
      }
      this.log('money', `Spent ${formatMoney(action.amount)} from ${source}.`);
      return { ok: true, type: action.type, minutes: 4, narrative: `You spend ${formatMoney(action.amount)}${source === 'cash' ? ' in cash' : ''}.` };
    }

    resolveWork(action) {
      const s=this.state, shift=this.todaysWorkShift();
      if(!shift) return {ok:false,type:'work',minutes:1,narrative:'You are not scheduled to work today, so there is no shift to clock into.'};
      const now=asDate(s.world.now), start=asDate(shift.triggerAt), end=asDate(shift.deadlineAt);
      const rule=shift.rule||workRuleForDate(now)||{};
      const lunchStart=rule.lunchStart?asDate(localISOForDate(now,rule.lunchStart)):null;
      const lunchEnd=rule.lunchEnd?asDate(localISOForDate(now,rule.lunchEnd)):null;
      if(now<start) return {ok:false,type:'work',minutes:1,narrative:`Your scheduled shift starts at ${start.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}. You cannot start paid work yet.`};
      if(now>=end) return {ok:false,type:'work',minutes:1,narrative:'Today’s scheduled shift is already over.'};
      if(lunchStart && lunchEnd && now>=lunchStart && now<lunchEnd) return {ok:false,type:'work',minutes:1,narrative:'You are in the scheduled lunch window. Take lunch, then resume at 1:00 PM.'};
      let target=end;
      if(action.mode==='until_lunch') {
        if(!lunchStart || now>=lunchStart) return {ok:false,type:'work',minutes:1,narrative:'There is no remaining pre-lunch work block to complete.'};
        target=lunchStart;
      } else if(action.mode==='finish_shift') {
        if(lunchEnd && now<lunchEnd) return {ok:false,type:'work',minutes:1,narrative:'The afternoon shift resumes at 1:00 PM. Finish lunch first.'};
        target=end;
      } else if(lunchStart && now<lunchStart) target=lunchStart;
      const minutes=Math.max(1,Math.round((target-now)/60000));
      const earned=this.recordWorkMinutes(minutes,shift,action.mode==='until_lunch'?'Morning shift':'Work shift');
      shift.status=target>=end?'completed':'started';
      const totalGross=Math.round((shift.grossEarned||0)*100)/100, totalMin=shift.workedMinutes||0;
      let narrative=`You work steadily until ${target.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}. ${Math.floor(minutes/60)}h ${minutes%60}m of paid time adds ${formatMoney(earned.gross)} to pending payroll.`;
      if(target>=end) narrative += ` The shift is complete: ${(totalMin/60).toFixed(2)} paid hours and ${formatMoney(totalGross)} gross earned today.`;
      else narrative += ' Lunch is next.';
      this.feedback(target>=end?'Shift complete':'Morning work block complete');
      if(target>=end) this.addActivity('work',`Shift complete · ${(totalMin/60).toFixed(2)} hr · ${formatMoney(totalGross)} gross queued for payroll.`,{importance:'high'});
      return {ok:true,type:'work',minutes,narrative};
    }

    resolveWorkLunch(action) {
      const s=this.state, shift=this.todaysWorkShift(); if(!shift) return {ok:false,type:'work_lunch',minutes:1,narrative:'You are not scheduled to work today.'};
      const now=asDate(s.world.now), rule=shift.rule||{}, ls=rule.lunchStart?asDate(localISOForDate(now,rule.lunchStart)):null, le=rule.lunchEnd?asDate(localISOForDate(now,rule.lunchEnd)):null;
      if(!ls||!le) return {ok:false,type:'work_lunch',minutes:1,narrative:'This shift does not have a scheduled lunch block.'};
      if(now<ls) return {ok:false,type:'work_lunch',minutes:1,narrative:'Lunch starts at noon.'};
      if(now>=le) return {ok:false,type:'work_lunch',minutes:1,narrative:'The lunch period is already over.'};
      const minutes=Math.max(1,Math.round((le-now)/60000)); this.feedback('Lunch break'); this.addActivity('work','Unpaid lunch break taken.');
      return {ok:true,type:'work_lunch',minutes,narrative:'You take your lunch break. The hour is unpaid, and the afternoon shift resumes at 1:00 PM.'};
    }

    resolveWorkTask(action) {
      const task=this.ensureWorkplaceTasks().find(t=>t.id===action.taskId); if(!task) return {ok:false,type:'work_task',minutes:1,narrative:'That work task is not currently tracked.'};
      if(task.remaining<=0) return {ok:true,type:'work_task',minutes:2,narrative:`The ${task.label.toLowerCase()} are already caught up.`};
      const shift=this.todaysWorkShift(); const now=asDate(this.state.world.now), end=asDate(shift.deadlineAt); const minutes=Math.min(task.minutesEach,Math.max(1,Math.round((end-now)/60000)));
      task.remaining-=1; const earned=this.recordWorkMinutes(minutes,shift,task.label); this.feedback(`${task.label}: ${task.remaining} remaining`); this.addActivity('work',`${task.label} handled · ${task.remaining} remaining.`);
      return {ok:true,type:'work_task',minutes,narrative:`You handle one ${task.label.toLowerCase()} item. ${task.remaining?`${task.remaining} remain.`:'That category is caught up.'} The time counts as paid work.`};
    }

    resolveCannabisPurchase(action) {
      const s=this.state, c=s.player.consumables.cannabisFlower; const amount=Math.round(Number(action.amount)*100)/100;
      let source='checking'; if(action.useCash && s.player.money.cash>=amount){s.player.money.cash=Math.round((s.player.money.cash-amount)*100)/100;source='cash';} else {s.player.money.checking=Math.round((s.player.money.checking-amount)*100)/100;}
      c.quantity=Math.round((Number(c.quantity||0)+Number(action.grams||0))*100)/100; c.lastPurchaseAt=s.world.now;
      if(source==='checking') s.bankTransactions.push({id:makeId('tx',s),at:s.world.now,amount,direction:'out',description:`Cannabis flower ${action.grams}g`,balanceAfter:s.player.money.checking});
      this.feedback(`Cannabis: ${c.quantity.toFixed(2)} g on hand`); this.feedback(`${formatMoney(amount)} spent`); this.addActivity('inventory',`Bought ${action.grams}g cannabis flower for ${formatMoney(amount)}.`);
      return {ok:true,type:'cannabis_purchase',minutes:12,narrative:`You buy ${action.grams}g of cannabis flower for ${formatMoney(amount)}. You now have about ${c.quantity.toFixed(2)}g on hand.`};
    }

    resolvePromise(action) {
      const s = this.state;
      const npc = action.npcId ? s.npcs[action.npcId] : null;
      const promise = { id: makeId('promise', s), text: action.raw, madeAt: s.world.now, npcId: action.npcId, dueAt: action.when, status: 'active' };
      s.player.promises.push(promise);
      if (npc) {
        this.addMemory(npc.id, { event: `Jonathan made a promise: ${action.raw}`, emotionalValence: 0.25, emotionalStrength: 0.3, importance: 0.7, decay: 'none', private: false, secret: false });
        this.changeRelationship(npc.id, { trust: 1 }, `Jonathan made a clear commitment to ${npc.name}.`);
      }
      if (action.when) s.scheduledEvents.push({ id: makeId('evt', s), type: 'promise_due', title: npc ? `Promise to ${npc.name}` : 'Promise', triggerAt: action.when, deadlineAt: addMinutesISO(action.when, 180), status: 'queued', visibility: 'known', requiresPresence: false, payload: { promiseId: promise.id } });
      return { ok: true, type: action.type, minutes: 2, narrative: `You make the commitment${npc ? ` to ${npc.name}` : ''}${action.when ? ' and put the timing in mind' : ''}.` };
    }

    resolveObserve(action) {
      const s = this.state; const loc = s.locations[s.world.playerLocationId]; const lower = action.raw.toLowerCase();
      if (s.world.playerLocationId === 'work' && /still needs|needs doing|what.*handle|front desk|workload/.test(lower)) {
        const summary=this.workTaskSummary(); this.feedback('Workload checked'); this.addActivity('observe',`Front desk check: ${summary}`);
        return {ok:true,type:action.type,minutes:3,narrative:`You check the front desk workload. ${summary}`};
      }
      if (lower.includes('phone') || lower.includes('message')) {
        Object.keys(s.messages).forEach(t => this.markThreadRead(t));
        return { ok: true, type: action.type, minutes: 2, narrative: 'You check your phone and read the waiting messages.' };
      }
      if (lower.includes('window') && s.world.playerLocationId === 'home') return { ok: true, type: action.type, minutes: 2, narrative: 'You look through the bedroom window. Nothing unusual stands out from what you can see.' };
      const present = Object.values(s.npcs).filter(n => n.current.locationId === s.world.playerLocationId);
      if (present.length && present.some(n => lower.includes(n.name.toLowerCase()))) {
        const n = present.find(n => lower.includes(n.name.toLowerCase()));
        return { ok: true, type: action.type, minutes: 2, narrative: `${n.name} looks ${n.current.mood}. You can notice posture and tone, but not what ${n.name} is thinking.` };
      }
      return { ok: true, type: action.type, minutes: 3, narrative: `${loc.description} Nothing immediately unusual stands out.` };
    }

    resolveTalk(action) {
      const s = this.state; let npc = action.npcId ? s.npcs[action.npcId] : null;
      if (!npc) npc = Object.values(s.npcs).find(n => n.current.locationId === s.world.playerLocationId);
      if (action.implausibleClaim) {
        this.changeRelationship(npc.id, { respect: -1 }, `${npc.name} was given an obviously implausible explanation.`);
        this.addMemory(npc.id, { event: `Jonathan made an implausible claim: ${action.raw}`, emotionalValence: -0.1, emotionalStrength: 0.15, importance: 0.25, decay: 'normal', private: false, secret: false });
        return { ok: true, type: action.type, minutes: 4, outcome: 'disbelieved', narrative: `${npc.name} listens, but the explanation is too implausible to be convincing. ${npc.name} does not appear to believe it.` };
      }
      if (action.persuasive) {
        const skill = s.player.skills.persuasion / 100;
        const rel = npc.relationship.trust / 100;
        const chance = Math.min(0.9, 0.28 + skill * 0.42 + rel * 0.2);
        const success = seededRandom(s) < chance;
        if (success) this.changeRelationship(npc.id, { respect: 1 }, `A reasonable persuasive conversation landed well.`);
        return { ok: true, type: action.type, minutes: 8, outcome: success ? 'success' : 'failure', narrative: success ? `${npc.name} considers what you say and seems persuaded.` : `${npc.name} hears you out but does not agree.` };
      }
      if (/thank|appreciate|sorry/i.test(action.raw)) this.changeRelationship(npc.id, { trust: 1, affection: 1 }, `Jonathan spoke considerately to ${npc.name}.`);
      this.addMemory(npc.id, { event: `Conversation with Jonathan: ${action.raw}`, emotionalValence: 0, emotionalStrength: 0.08, importance: 0.12, decay: 'fast', private: false, secret: false });
      return { ok: true, type: action.type, minutes: 7, narrative: `${npc.name} responds in a normal conversational tone. The exchange is brief and grounded in what was actually said.` };
    }

    resolveGeneric(action) {
      const lower = action.raw.toLowerCase();
      if (/jump .*roof|moving truck/.test(lower)) {
        return { ok: false, type: action.type, minutes: 1, narrative: 'That would be extremely dangerous under ordinary conditions. You do not have a safe, plausible way to carry it out as stated.' };
      }
      return {
        ok: true, type: action.type, minutes: 4,
        narrative: `You try to ${action.raw.replace(/^i\s+/i, '')}.\n\nSimulation note: this free-form action did not change tracked state because the AI action interpreter was unavailable or this feature is not implemented in the local fallback.`
      };
    }

    activeStatusEffects() {
      const c = this.state.player.condition;
      c.statusEffects = Array.isArray(c.statusEffects) ? c.statusEffects : [];
      return c.statusEffects.filter(x => !x.expiresAt || asDate(x.expiresAt) > asDate(this.state.world.now));
    }

    hasDrivingImpairment() {
      return this.activeStatusEffects().some(x => x.impairsDriving === true || (x.modifiers && Number(x.modifiers.driving || 0) <= -10));
    }

    expireStatusEffects() {
      const c = this.state.player.condition;
      c.statusEffects = Array.isArray(c.statusEffects) ? c.statusEffects : [];
      const before = c.statusEffects.length;
      const now = asDate(this.state.world.now);
      const expired = c.statusEffects.filter(x => x.expiresAt && asDate(x.expiresAt) <= now);
      c.statusEffects = c.statusEffects.filter(x => !x.expiresAt || asDate(x.expiresAt) > now);
      if (expired.length) this.log('status', `Expired status effects: ${expired.map(x => x.label || x.id).join(', ')}.`, true);
      return before - c.statusEffects.length;
    }

    applyAIActionResolution(raw, resolution) {
      const s = this.state;
      const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, Number(n) || 0));
      const effects = resolution && resolution.effects && typeof resolution.effects === 'object' ? resolution.effects : {};
      const notes = [];
      let changes = 0;

      s.meta.turn += 1;
      this.log('player', `Player free action: ${raw}`);
      this.log('parse', 'Free action routed through Milestone 2 AI action interpreter.');

      const duration = clamp(resolution && resolution.duration_minutes != null ? resolution.duration_minutes : 4, 1, 1440);
      let narrative = String(resolution && resolution.narrative || '').trim() || `You attempt to ${String(raw).replace(/^i\s+/i, '')}.`;

      if (resolution && resolution.possible === false) {
        const visibleEvents = this.advanceTime(Math.min(duration, 10)).visibleEvents;
        if (Array.isArray(resolution.unsupported) && resolution.unsupported.length) notes.push(...resolution.unsupported.map(String));
        if (resolution.no_state_change_reason) notes.push(String(resolution.no_state_change_reason));
        if (!notes.length) notes.push('The action could not be carried out as stated, so no tracked state was changed.');
        narrative += `\n\nSimulation note: ${notes.join(' ')}`;
        const result = { ok: false, type: 'ai_freeform', minutes: duration, narrative };
        s.ui.lastActionResults = [result];
        s.ui.lastSimulationNotice = notes.join(' ');
        s.ui.lastNarrative = this.provider.generateScene(s, { results: [result], visibleEvents });
        s.ui.suggestions = this.provider.generateSuggestions(s);
        s.meta.updatedAt = s.world.now;
        this.log('scene', 'AI free action rejected or only partially understood.');
        return { state: s, results: [result], visibleEvents, narrative: s.ui.lastNarrative, suggestions: s.ui.suggestions };
      }

      // Core condition deltas. Positive hunger means hungrier; positive stress means more stressed.
      const condition = effects.condition || {};
      for (const key of ['energy', 'hunger', 'stress']) {
        if (condition[key] == null) continue;
        const delta = clamp(condition[key], -30, 30);
        if (!delta) continue;
        s.player.condition[key] = clamp(Number(s.player.condition[key] || 0) + delta, 0, 100);
        changes += 1;
        this.log('condition', `${key} ${delta >= 0 ? '+' : ''}${delta} from free action.`, true);
        const labels={energy:'Energy',hunger:'Hunger',stress:'Stress'}; this.feedback(`${labels[key]} ${delta>0?'increased':'decreased'}`);
      }

      // Temporary effects such as high, caffeinated, sore, buzzed, focused, etc.
      const statuses = Array.isArray(effects.statuses) ? effects.statuses.slice(0, 6) : [];
      s.player.condition.statusEffects = Array.isArray(s.player.condition.statusEffects) ? s.player.condition.statusEffects : [];
      for (const st of statuses) {
        if (!st || !st.label) continue;
        const minutes = clamp(st.duration_minutes == null ? 60 : st.duration_minutes, 5, 1440);
        const id = String(st.id || st.label).toLowerCase().replace(/[^a-z0-9_-]+/g, '-').slice(0, 48) || `status-${Date.now()}`;
        const status = {
          id, label: String(st.label).slice(0, 80), intensity: String(st.intensity || 'mild').slice(0, 24),
          startedAt: s.world.now, expiresAt: addMinutesISO(s.world.now, minutes),
          impairsDriving: Boolean(st.impairs_driving ?? st.impairsDriving),
          modifiers: {
            coordination: clamp(st.modifiers && st.modifiers.coordination, -25, 25),
            composure: clamp(st.modifiers && st.modifiers.composure, -25, 25),
            driving: clamp(st.modifiers && st.modifiers.driving, -25, 25),
          },
        };
        s.player.condition.statusEffects = s.player.condition.statusEffects.filter(x => x.id !== id);
        s.player.condition.statusEffects.push(status);
        changes += 1;
        this.log('status', `Status applied: ${status.label} until ${status.expiresAt}.`, true); this.feedback(status.label); this.addActivity('status',`${status.label} status began (${status.intensity}).`);
      }

      // Relationship effects. Only NPCs actually present can be affected by a non-phone free action.
      const relEffects = Array.isArray(effects.relationships) ? effects.relationships.slice(0, 8) : [];
      const appliedRelationshipNpcIds = new Set();
      for (const rel of relEffects) {
        if (!rel || !rel.npc_id || !s.npcs[rel.npc_id]) { notes.push('A requested relationship effect targeted an unknown NPC and was not applied.'); continue; }
        const npc = s.npcs[rel.npc_id];
        if (npc.current.locationId !== s.world.playerLocationId) { notes.push(`${npc.name} was not present, so the in-person relationship effect was not applied.`); continue; }
        const deltas = {};
        for (const key of ['trust','affection','respect','attraction','fear','resentment']) {
          const v = clamp(rel[key], -8, 8);
          if (v) deltas[key] = v;
        }
        if (Object.keys(deltas).length) {
          this.changeRelationship(npc.id, deltas, String(rel.reason || `Free action: ${raw}`).slice(0, 240));
          changes += 1;
          appliedRelationshipNpcIds.add(npc.id);
        }
      }

      // Flirting must have a relationship consequence when it is actually perceived as flirting.
      const socialIntent = String(resolution && resolution.social_intent || '').toLowerCase();
      const perceivedAsFlirting = Boolean(resolution && (resolution.perceived_as_flirting ?? resolution.perceivedAsFlirting));
      if (socialIntent === 'flirt' && perceivedAsFlirting) {
        let targetId = String(resolution.flirt_target_npc_id || resolution.flirtTargetNpcId || '');
        if (!targetId) {
          const present = Object.values(s.npcs).find(n => n.current.locationId === s.world.playerLocationId);
          if (present) targetId = present.id;
        }
        const npc = s.npcs[targetId];
        if (npc && npc.current.locationId === s.world.playerLocationId && !appliedRelationshipNpcIds.has(npc.id)) {
          const reception = String(resolution.flirt_reception || resolution.flirtReception || 'neutral').toLowerCase();
          const deltas = reception === 'positive' ? { attraction: 2, affection: 1 } : reception === 'negative' ? { attraction: -1, resentment: 2, respect: -1 } : { attraction: 1 };
          this.changeRelationship(npc.id, deltas, `Jonathan's behavior was perceived by ${npc.name} as flirting (${reception}).`);
          this.addMemory(npc.id, { event: `Jonathan flirted with ${npc.name}; ${npc.name} received it ${reception}ly.`, emotionalValence: reception === 'positive' ? 0.35 : reception === 'negative' ? -0.35 : 0.05, emotionalStrength: 0.3, importance: 0.35, decay: 'slow', private: false, secret: false });
          changes += 1;
        } else if (!npc) {
          notes.push('Flirting was detected, but no present tracked NPC could receive the relationship effect.');
        }
      }

      // Skill practice is intentionally slow: AI may award at most one point per relevant skill per action.
      const skillEffects = Array.isArray(effects.skills) ? effects.skills.slice(0, 8) : [];
      for (const sk of skillEffects) {
        if (!sk || !Object.prototype.hasOwnProperty.call(s.player.skills, sk.skill)) continue;
        const delta = clamp(sk.delta, 0, 1);
        if (!delta) continue;
        s.player.skills[sk.skill] = clamp(Number(s.player.skills[sk.skill] || 0) + delta, 0, 100);
        changes += 1;
        this.log('skill', `${sk.skill} +${delta} through relevant practice.`, true);
      }

      // Money can change, but only with a description and bounded amount.
      const money = effects.money;
      if (money && money.delta != null && money.description) {
        const delta = clamp(money.delta, -1000, 1000);
        if (delta < 0 && s.player.money.checking + s.player.money.cash < Math.abs(delta)) {
          notes.push('A spending effect exceeded available money and was not applied.');
        } else if (delta) {
          if (delta < 0) s.player.money.checking = Math.max(0, s.player.money.checking + delta);
          else s.player.money.checking += delta;
          s.bankTransactions.push({ id: makeId('tx', s), at: s.world.now, amount: Math.abs(delta), direction: delta < 0 ? 'out' : 'in', description: String(money.description).slice(0, 100), balanceAfter: s.player.money.checking });
          changes += 1;
        }
      }

      const consumables = Array.isArray(effects.consumables) ? effects.consumables.slice(0,6) : [];
      for (const item of consumables) {
        if (!item || item.item_id !== 'cannabis_flower') continue;
        const c=s.player.consumables && s.player.consumables.cannabisFlower; if(!c) continue;
        let delta=clamp(item.delta_grams,-28,28);
        if(delta<0 && Math.abs(delta)>c.quantity){ delta=-c.quantity; notes.push('You used the remaining cannabis; there was not enough for the full proposed amount.'); }
        if(delta){ c.quantity=Math.max(0,Math.round((c.quantity+delta)*100)/100); changes+=1; this.feedback(`Cannabis supply ${delta<0?'decreased':'increased'} · ${c.quantity.toFixed(2)} g remaining`); this.addActivity('inventory',`Cannabis flower ${delta<0?'used':'added'}: ${Math.abs(delta).toFixed(2)}g · ${c.quantity.toFixed(2)}g remaining.`); }
      }

      const visibleFeedback = Array.isArray(resolution && resolution.visible_feedback) ? resolution.visible_feedback.slice(0,6) : [];
      for (const item of visibleFeedback) if(item) { this.feedback(String(item).slice(0,180)); this.addActivity('world',String(item).slice(0,220)); }

      const injury = effects.injury;
      if (injury && injury.occurred) {
        s.player.condition.injured = true;
        s.player.condition.injuryNote = String(injury.description || 'Minor injury').slice(0, 180);
        changes += 1;
        notes.push('Detailed medical simulation is not implemented; only a general injury flag was recorded.');
      }

      const situationUpdates = Array.isArray(effects.situation_updates) ? effects.situation_updates.slice(0, 8) : [];
      for (const up of situationUpdates) {
        const sit = s.activeSituations.find(x => x.id === up.id);
        if (!sit) continue;
        if (['active','resolved','failed','expired'].includes(up.status)) sit.status = up.status;
        if (Array.isArray(up.add_known_information)) {
          sit.knownInformation = sit.knownInformation || [];
          for (const fact of up.add_known_information.slice(0, 4)) if (fact && !sit.knownInformation.includes(String(fact))) sit.knownInformation.push(String(fact).slice(0, 220));
        }
        changes += 1;
      }

      const memories = Array.isArray(resolution && resolution.memories) ? resolution.memories.slice(0, 8) : [];
      for (const m of memories) {
        if (!m || !m.npc_id || !s.npcs[m.npc_id] || !m.event) continue;
        const npc = s.npcs[m.npc_id];
        if (npc.current.locationId !== s.world.playerLocationId) continue;
        this.addMemory(npc.id, { event: String(m.event).slice(0, 260), emotionalValence: clamp(m.emotional_valence, -1, 1), emotionalStrength: clamp(m.emotional_strength == null ? 0.25 : m.emotional_strength, 0, 1), importance: clamp(m.importance == null ? 0.3 : m.importance, 0, 1), decay: m.importance >= 0.65 ? 'slow' : 'normal', private: Boolean(m.private), secret: false });
        changes += 1;
      }

      if (Array.isArray(resolution && resolution.unsupported)) {
        for (const item of resolution.unsupported.slice(0, 6)) if (item) notes.push(String(item).slice(0, 240));
      }
      if (!changes && resolution && resolution.no_state_change_reason) notes.push(String(resolution.no_state_change_reason).slice(0, 300));
      if (!changes && !notes.length) notes.push('I understood the free-form action, but this build has no implemented state effect for it yet, so nothing tracked was changed.');
      if (!changes) this.feedback('No tracked state changed','warn');

      const visibleEvents = this.advanceTime(duration).visibleEvents;
      this.maybeScheduleDealerCheckIn();
      this.updateSituations();
      this.compressHistoryIfNeeded();
      const activeStatuses = this.activeStatusEffects();
      if (activeStatuses.length) s.player.condition.description = activeStatuses.map(x => x.label).join(', ');
      else s.player.condition.description = s.player.condition.energy < 25 ? 'Tired' : s.player.condition.hunger > 75 ? 'Hungry' : s.player.condition.injured ? 'Injured' : 'Fine';

      if (notes.length) narrative += `\n\nSimulation note: ${notes.join(' ')}`;
      const result = { ok: true, type: 'ai_freeform', minutes: duration, narrative }; this.addActivity('action', narrative.slice(0,300));
      s.ui.lastActionResults = [result];
      s.ui.lastSimulationNotice = notes.join(' ');
      s.ui.lastNarrative = this.provider.generateScene(s, { results: [result], visibleEvents });
      s.ui.suggestions = this.provider.generateSuggestions(s);
      s.meta.updatedAt = s.world.now;
      this.log('scene', `Milestone 2 free action resolved; ${changes} tracked state change group(s).`);
      return { state: s, results: [result], visibleEvents, narrative: s.ui.lastNarrative, suggestions: s.ui.suggestions, changes };
    }

    advanceTime(minutes) {
      const s = this.state;
      const from = s.world.now;
      const to = addMinutesISO(from, Math.max(0, minutes));
      s.world.now = to;
      this.expireStatusEffects();
      this.updatePlayerNeeds(minutes);
      this.simulateNPCs(from, to);
      const visibleEvents = this.processScheduledEvents(from, to);
      this.log('time', `Advanced ${minutes} minute${minutes === 1 ? '' : 's'} to ${to}.`); if(minutes>=5) this.feedback(`${minutes>=60?`${Math.floor(minutes/60)}h ${minutes%60}m`:`${minutes} min`} passed`);
      return { from, to, visibleEvents };
    }

    updatePlayerNeeds(minutes) {
      const c = this.state.player.condition;
      c.hunger = Math.min(100, c.hunger + minutes / 55);
      if (minutes > 90) c.energy = Math.max(0, c.energy - minutes / 180);
      const statuses = this.activeStatusEffects();
      c.description = statuses.length ? statuses.map(x => x.label).join(', ') : c.energy < 25 ? 'Tired' : c.hunger > 75 ? 'Hungry' : c.injured ? 'Injured' : 'Fine';
    }

    simulateNPCs(from, to) {
      const s = this.state;
      Object.values(s.npcs).forEach(npc => {
        const oldLoc = npc.current.locationId;
        const oldActivity = npc.current.activity;
        const status = this.scheduleStateForNPC(npc, to);
        npc.current.locationId = status.locationId;
        npc.current.activity = status.activity;
        if (oldLoc !== status.locationId || oldActivity !== status.activity) this.log('npc', `${npc.name} background state: ${status.activity} at ${status.locationId}.`, true);
      });
    }

    scheduleStateForNPC(npc, iso) {
      const d = asDate(iso); const day = d.getDay(); const mins = d.getHours() * 60 + d.getMinutes(); const weekday = day >= 1 && day <= 5;
      if (npc.id === 'maya') {
        if (weekday && mins >= 8 * 60 + 30 && mins < 17 * 60 + 30) return { locationId: 'work', activity: 'working' };
        if ((day === 2 || day === 4) && mins >= 18 * 60 + 15 && mins < 19 * 60 + 15) return { locationId: 'gym', activity: 'working out' };
        if (!weekday && mins >= 11 * 60 && mins < 13 * 60) return { locationId: 'coffee', activity: 'out for errands' };
        return { locationId: 'maya_home', activity: 'at home' };
      }
      if (npc.id === 'daniel') {
        if (weekday && mins >= 9 * 60 && mins < 17 * 60) return { locationId: 'work', activity: 'working' };
        if (weekday && mins >= 18 * 60 + 30 && mins < 20 * 60) return { locationId: 'gym', activity: 'working out' };
        return { locationId: 'daniel_home', activity: 'at home' };
      }
      if (npc.id === 'eli') return { locationId:'unknown', activity:'going about the day' };
      if (npc.id === 'dad') {
        if (weekday && mins >= 8 * 60 && mins < 16 * 60 + 30) return { locationId: 'dad_studio', activity: 'working' };
        return { locationId: 'dad_home', activity: 'at home' };
      }
      return { locationId: npc.homeLocationId, activity: 'at home' };
    }

    processScheduledEvents(from, to) {
      const s = this.state; const visible = [];
      this.processCalendarReminders(from,to,visible);
      const due = s.scheduledEvents.filter(e => e.status === 'queued' && asDate(e.triggerAt) <= asDate(to)).sort((a, b) => asDate(a.triggerAt) - asDate(b.triggerAt));
      for (const event of due) {
        if (event.type === 'payroll') {
          const pe=this.processPayrollEvent(event); if(pe) visible.push(pe);
        } else if (event.type === 'dealer_checkin') {
          const npc=s.npcs.eli; const thread=npc.phone.threadId;
          s.messages[thread].push({id:makeId('msg',s),at:event.triggerAt,senderId:'eli',recipientId:'jonathan',body:'You good for a bit or need me to set something aside?',read:false,topic:'cannabis',intent:'check_in'});
          s.player.consumables.cannabisFlower.lastDealerCheckInAt=event.triggerAt; event.status='completed'; visible.push({type:'message',text:'A message from Eli arrives.'}); this.addActivity('message','Eli checked in.');
        } else if (event.type === 'work_shift') {
          const end=asDate(event.deadlineAt); if(asDate(to)>=end){ if((event.workedMinutes||0)<=0){event.status='missed';visible.push({type:'missed',text:'Your scheduled work shift has ended without any paid time logged.'});this.applyMissedWorkConsequence(event);this.addActivity('work','Scheduled shift missed.',{importance:'high'});} else {event.status='completed';} } else if(asDate(to)>=asDate(event.triggerAt) && event.status==='queued') event.status='started';
        } else if (event.type === 'daniel_shift_request') {
          const npc=s.npcs.daniel, thread=npc.phone.threadId;
          const body='Any chance you’d swap one of my shifts next week? I’m still figuring out which day, but I wanted to ask you first.';
          s.messages[thread].push({id:makeId('msg',s),at:event.triggerAt,senderId:'daniel',recipientId:'jonathan',body,read:false,topic:'work',intent:'request'});
          event.status='completed'; this.discoverSituation('sit_shift',`Daniel message at ${event.triggerAt}`,['Daniel asked whether Jonathan might trade one upcoming shift. No decision has been made.']);
          visible.push({type:'message',text:'A message from Daniel arrives.'}); this.addActivity('message','Daniel asked about a possible shift swap.',{importance:'high'});
        } else if (event.type === 'message_response') {
          const npc = s.npcs[event.npcId]; const thread = npc.phone.threadId;
          const sent = (s.messages[thread] || []).find(m => m.id === event.payload.respondingTo);
          let incomingBody = event.payload.incomingBody;
          let topic = event.payload.topic || 'general';
          let memoryEvent = event.payload.memoryEvent || null;
          if (!event.payload.engineVersion && sent) {
            const repairedPlan = this.composeReply(npc, sent.body, thread, sent.id);
            incomingBody = repairedPlan.body; topic = repairedPlan.topic; memoryEvent = repairedPlan.memoryEvent || null;
          }
          s.messages[thread].push({
            id: makeId('msg', s), at: event.triggerAt, senderId: npc.id, recipientId: 'jonathan',
            body: incomingBody, read: false, topic, intent: 'reply', replyToId: event.payload.respondingTo || null,
          });
          this.updateDialogueThread(thread, { topic, lastNpcMessageAt: event.triggerAt });
          if (memoryEvent && !npc.memories.some(m => m.event === memoryEvent)) {
            this.addMemory(npc.id, { event: memoryEvent, emotionalValence: 0, emotionalStrength: 0.12, importance: 0.28, decay: 'slow', private: false, secret: false });
          }
          if (event.payload.social) this.applyNPCSocialResult(npc.id,event.payload.social,'text conversation');
          event.status = 'completed';
          visible.push({ type: 'message', text: `A message from ${npc.name} arrives.` });
          this.addActivity('message',`Message from ${npc.name}: ${String(incomingBody).slice(0,120)}${String(incomingBody).length>120?'…':''}`);
          this.log('event', `Incoming contextual message from ${npc.name}.`);
        } else if (event.type === 'npc_call') {
          const npc = s.npcs[event.npcId];
          const thread = npc.phone.threadId;
          s.messages[thread].push({ id: makeId('msg', s), at: event.triggerAt, senderId: npc.id, recipientId: 'jonathan', body: 'Tried calling. Nothing urgent—call me when you have a minute.', read: false });
          event.status = 'completed';
          visible.push({ type: 'call', text: `${npc.name} tries to call. If you do not answer in the moment, a short message follows.` });
          this.log('event', `${npc.name} call event processed.`);
        } else if (event.type === 'npc_private') {
          this.processPrivateNPCEvent(event);
          event.status = 'completed';
          this.log('event', `Private NPC event processed for ${event.npcId}.`, true);
        } else if (event.type === 'reminder') {
          event.status = 'completed';
          visible.push({ type: 'reminder', text: `Your calendar reminder appears: ${event.title}.` });
          this.log('event', `Reminder delivered: ${event.title}.`);
          if (event.recurrence === 'monthly') this.rescheduleMonthly(event);
        } else if (event.type === 'promise_due') {
          event.status = 'completed';
          const promise = s.player.promises.find(p => p.id === event.payload.promiseId);
          if (promise && promise.status === 'active') {
            visible.push({ type: 'promise', text: `The time you had in mind for a promise has arrived: ${promise.text}.` });
            this.log('event', `Promise due: ${promise.text}`);
          }
        } else if (event.type === 'appointment') {
          const atPlace = s.world.playerLocationId === event.locationId;
          if (atPlace) {
            event.status = 'attended';
            visible.push({ type: 'appointment', text: `${event.title} is now underway.` });
            this.log('event', `Appointment attended: ${event.title}.`);
          } else if (event.deadlineAt && asDate(to) > asDate(event.deadlineAt)) {
            event.status = 'missed';
            s.journal.recentMajorEvents.unshift({ at: to, text: `Missed: ${event.title}` });
            visible.push({ type: 'missed', text: `You realize you have missed ${event.title.toLowerCase()}.` });
            this.log('event', `Appointment missed: ${event.title}.`);
            if (event.consequence === 'work-shift') this.applyMissedWorkConsequence(event);
          } else {
            event.status = 'started';
            visible.push({ type: 'appointment', text: `${event.title} has started, and you are not there yet.` });
            this.log('event', `Appointment started while player absent: ${event.title}.`);
          }
        }
      }

      // Started work shifts become completed/partial at end; a zero-minute shift is missed.
      s.scheduledEvents.filter(e => e.type==='work_shift' && e.status === 'started' && e.deadlineAt && asDate(to) >= asDate(e.deadlineAt)).forEach(event => {
        if((event.workedMinutes||0)>0){ event.status='completed'; this.addActivity('work',`Workday closed with ${(event.workedMinutes/60).toFixed(2)} paid hours logged.`); }
        else { event.status='missed'; visible.push({type:'missed',text:'The scheduled work shift ended without any paid time logged.'}); this.applyMissedWorkConsequence(event); this.addActivity('work','Scheduled shift missed.',{importance:'high'}); }
      });

      // Started appointments can become missed as more time passes.
      s.scheduledEvents.filter(e => e.type === 'appointment' && e.status === 'started' && e.deadlineAt && asDate(to) > asDate(e.deadlineAt)).forEach(event => {
        event.status = 'missed';
        s.journal.recentMajorEvents.unshift({ at: to, text: `Missed: ${event.title}` });
        visible.push({ type: 'missed', text: `The window for ${event.title.toLowerCase()} passes. It is now missed.` });
        this.log('event', `Started appointment became missed: ${event.title}.`);
        if (event.consequence === 'work-shift') this.applyMissedWorkConsequence(event);
      });
      return visible;
    }

    checkAttendanceOnArrival(locationId) {
      const s = this.state;
      s.scheduledEvents.filter(e => (e.status === 'queued' || e.status === 'started') && e.locationId === locationId).forEach(event => {
        if (asDate(s.world.now) >= asDate(event.triggerAt) && (!event.deadlineAt || asDate(s.world.now) <= asDate(event.deadlineAt))) {
          event.status = 'attended';
          this.log('event', `Arrival satisfied event: ${event.title}.`);
        }
      });
    }

    applyMissedWorkConsequence(event) {
      const s = this.state;
      if (!s.activeSituations.some(x => x.id === `sit_${event.id}`)) {
        s.activeSituations.push({ id: `sit_${event.id}`, title: 'Missed work shift', status: 'active', playerKnows:true, discoveredAt:s.world.now, discoverySource:'Jonathan missed the shift', involvedPeople: ['jonathan'], knownInformation: ['Jonathan missed a scheduled shift without being at the office during the arrival window.'], hiddenInformation: {}, possibleFutureDevelopments: ['The office may ask what happened.', 'Repeated attendance issues could affect employment.'], deadlineAt: null, consequences: ['Attendance record affected'], urgency: 'medium' });
      }
    }

    processPrivateNPCEvent(event) {
      const s = this.state; const npc = s.npcs[event.npcId];
      if (!npc) return;
      if (event.payload && event.payload.kind === 'work-frustration') {
        npc.current.mood = 'annoyed';
        npc.plans.unresolvedProblems = npc.plans.unresolvedProblems || [];
        if (!npc.plans.unresolvedProblems.includes('manager denied a schedule request')) npc.plans.unresolvedProblems.push('manager denied a schedule request');
        this.addMemory(npc.id, { event: 'Her manager denied a schedule request during work.', emotionalValence: -0.45, emotionalStrength: 0.5, importance: 0.45, decay: 'slow', private: true, secret: false, witnesses: ['maya'] });
      }
    }

    rescheduleMonthly(event) {
      const s = this.state; const d = asDate(event.triggerAt); d.setMonth(d.getMonth() + 1);
      s.scheduledEvents.push({ ...clone(event), id: makeId('evt', s), triggerAt: nowISO(d), status: 'queued' });
    }

    markThreadRead(threadId) {
      (this.state.messages[threadId] || []).forEach(m => { if (m.recipientId === 'jonathan') m.read = true; });
    }

    addMemory(npcId, data) {
      const npc = this.state.npcs[npcId]; if (!npc) return null;
      const memory = {
        id: makeId('mem', this.state), event: data.event, timestamp: data.timestamp || this.state.world.now,
        people: data.people || ['jonathan', npcId], witnesses: data.witnesses || [npcId], emotionalValence: data.emotionalValence || 0,
        emotionalStrength: data.emotionalStrength || 0, importance: data.importance || 0.2, confidence: data.confidence == null ? 1 : data.confidence,
        private: Boolean(data.private), secret: Boolean(data.secret), decay: data.decay || 'normal', consequences: data.consequences || [],
      };
      npc.memories.push(memory);
      this.log('memory', `Memory created for ${npc.name}: ${memory.event}`, true);
      return memory;
    }

    changeRelationship(npcId, changes, reason) {
      const npc = this.state.npcs[npcId]; if (!npc) return;
      const applied = [];
      for (const [key, delta] of Object.entries(changes)) {
        if (typeof npc.relationship[key] !== 'number') continue;
        npc.relationship[key] = Math.max(0, Math.min(100, npc.relationship[key] + delta));
        applied.push(`${key} ${delta >= 0 ? '+' : ''}${delta}`);
      }
      if (applied.length) {
        this.log('relationship', `${npc.name}: ${applied.join(', ')}. Reason: ${reason}`, true);
        const cue=this.relationshipCue(npc,changes); if(cue){ npc.publicSignal={text:cue,at:this.state.world.now}; this.feedback(cue); this.addActivity('relationship',cue); }
      }
    }

    updateSituations() {
      const s = this.state;
      for (const sit of s.activeSituations) {
        if (sit.status !== 'active') continue;
        if (sit.deadlineAt && asDate(s.world.now) > asDate(sit.deadlineAt)) {
          sit.status = 'expired';
          if(sit.playerKnows!==false){ s.journal.completedSituations.unshift({ at: s.world.now, title: sit.title, result: 'Expired without direct resolution.' }); this.addActivity('situation',`${sit.title} expired without resolution.`); }
          this.log('situation', `Situation expired: ${sit.title}.`, true);
        }
      }
    }

    compressHistoryIfNeeded() {
      const s = this.state;
      if (s.recentEvents.length < 40) return;
      const old = s.recentEvents.splice(0, 25);
      s.historicalSummaries.push({ through: old[old.length - 1].at, summary: `${old.length} lower-priority events were compressed. Important canonical facts, memories, promises, and active situations were retained.` });
      this.log('history', 'Older low-value events compressed.', true);
    }
  }

  function relationDescriptor(v) {
    if (v >= 80) return 'Very high';
    if (v >= 65) return 'High';
    if (v >= 45) return 'Moderate';
    if (v >= 25) return 'Low';
    return 'Very low';
  }

  function skillDescriptor(v) {
    if (v >= 75) return 'Strong';
    if (v >= 60) return 'Capable';
    if (v >= 45) return 'Average';
    if (v >= 30) return 'Limited';
    return 'Weak';
  }

  function publicNPCView(npc) {
    return {
      id: npc.id, name: npc.name, occupation: npc.occupation, relationship: npc.relationship.label,
      trust: relationDescriptor(npc.relationship.trust), generalTone: npc.relationship.resentment > 20 ? 'Tense' : npc.relationship.affection > 65 ? 'Warm' : 'Normal',

  }
