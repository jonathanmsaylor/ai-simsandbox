  class LocalNarrativeProvider {
    generateScene(state, turnContext = null) {
      const loc = state.locations[state.world.playerLocationId];
      const present = Object.values(state.npcs).filter(n => n.current.locationId === state.world.playerLocationId);
      const unread = Object.values(state.messages).flat().filter(m => m.recipientId === 'jonathan' && !m.read).length;
      const parts = [];

      if (turnContext && turnContext.results && turnContext.results.length) {
        const visible = turnContext.results.map(r => r.narrative).filter(Boolean);
        if (visible.length) parts.push(visible.join(' '));
      }

      if (!parts.length) {
        if (loc.id === 'home') parts.push('The apartment is quiet. The air conditioner cycles on and off, and the rest of the evening is unclaimed.');
        else parts.push(loc.description);
      }

      const visibleEvents = turnContext && turnContext.visibleEvents ? turnContext.visibleEvents : [];
      visibleEvents.forEach(e => { if (e.text) parts.push(e.text); });

      if (present.length) {
        parts.push(`${present.map(n => n.name).join(' and ')} ${present.length === 1 ? 'is' : 'are'} here.`);
      }
      if (unread > 0) parts.push(`Your phone shows ${unread} unread message${unread === 1 ? '' : 's'}.`);

      const cond = state.player.condition;
      if (cond.energy < 25) parts.push('You feel noticeably tired.');
      if (cond.hunger > 72) parts.push('You are getting hungry enough that it is hard to ignore.');

      return parts.join('\n\n');
    }

    generateSuggestions(state) {
      const suggestions = [];
      const locId = state.world.playerLocationId;
      const unreadThreads = Object.entries(state.messages).filter(([, msgs]) => msgs.some(m => m.recipientId === 'jonathan' && !m.read));
      if (unreadThreads.length) suggestions.push({ category: 'Phone', text: 'Check my unread messages.' });
      if (locId === 'home') {
        suggestions.push({ category: 'Act', text: 'Make something to eat.' });
        suggestions.push({ category: 'Observe', text: 'Look around the apartment and see what needs doing.' });
        suggestions.push({ category: 'Phone', text: 'Text Maya and ask how her night is going.' });
        suggestions.push({ category: 'Phone', text: 'Reply to Daniel.' });
        suggestions.push({ category: 'Act', text: 'Take a shower.' });
        suggestions.push({ category: 'Leave', text: 'Drive to Juniper Coffee.' });
        suggestions.push({ category: 'Avoid', text: 'Do nothing for an hour and let the evening pass.' });
      } else if (locId === 'work') {
        suggestions.push({ category: 'Act', text: 'Start working at the front desk.' });
        suggestions.push({ category: 'Observe', text: 'Check what still needs to be handled here.' });
        suggestions.push({ category: 'Phone', text: 'Check my calendar.' });
        suggestions.push({ category: 'Leave', text: 'Drive home.' });
      } else {
        suggestions.push({ category: 'Observe', text: `Look around ${state.locations[locId].name}.` });
        suggestions.push({ category: 'Phone', text: 'Check my phone.' });
        suggestions.push({ category: 'Leave', text: 'Drive home.' });
      }

      const present = Object.values(state.npcs).filter(n => n.current.locationId === locId);
      present.slice(0, 2).forEach(n => {
        suggestions.unshift({ category: 'Talk', text: `Ask ${n.name} how things are going.` });
        suggestions.push({ category: 'Observe', text: `Pay attention to ${n.name}'s tone and body language.` });
      });

      const upcoming = state.scheduledEvents
        .filter(e => e.visibility === 'known' && e.status === 'queued' && asDate(e.triggerAt) > asDate(state.world.now))
        .sort((a, b) => asDate(a.triggerAt) - asDate(b.triggerAt))[0];
      if (upcoming) suggestions.push({ category: 'Plan', text: `Think about the upcoming ${upcoming.title.toLowerCase()}.` });

      const unique = [];
      const seen = new Set();
      for (const s of suggestions) {
        const key = s.text.toLowerCase();
        if (!seen.has(key)) { seen.add(key); unique.push(s); }
        if (unique.length >= 9) break;
      }
      return unique;
    }
  }

  class ActionInterpreter {
    interpret(raw, state) {
      const text = String(raw || '').trim();
      if (!text) return [];
      const normalized = text.replace(/[’]/g, "'");
      const clauses = normalized
        .split(/\s*,\s*|\s+and then\s+|\s+then\s+/i)
        .map(s => s.trim().replace(/^and\s+/i, ''))
        .filter(Boolean);
      return clauses.map(clause => this.classify(clause, state));
    }

    classify(clause, state) {
      const lower = clause.toLowerCase();
      if (/\bteleport\b|\bmateriali[sz]e\b|\bwarp\b/.test(lower)) return { type: 'impossible', raw: clause, reason: 'That action is not physically possible in this realistic world.' };
      if (/\b(fly|levitate)\b/.test(lower) && !/flight|plane|airport/.test(lower)) return { type: 'impossible', raw: clause, reason: 'Jonathan cannot literally fly or levitate.' };
      if (/\btext\b|\bmessage\b|\bsend .* message\b/.test(lower)) return this.parseText(clause, state);
      if (/\bcall\b/.test(lower)) return this.parseCall(clause, state);
      if (/\bdrive\b|\bhead to\b|\bgo to\b|\bwalk to\b/.test(lower)) return this.parseTravel(clause, state);
      if (/\bgrab\b|\bpick up\b|\btake my\b/.test(lower)) return this.parseGrab(clause);
      if (/\b(shower)\b/.test(lower)) return { type: /turn .*shower.*on/.test(lower) ? 'toggle_shower' : 'shower', raw: clause };
      if (/\bsleep\b|\bgo to bed\b|\bnap\b/.test(lower)) return this.parseSleep(clause, state);
      if (/\bwait\b|\bdo nothing\b|\bpass the time\b/.test(lower)) return this.parseWait(clause);
      if (/\bbuy\b|\bpay\b|\bspend\b/.test(lower)) return this.parsePurchase(clause);
      if (/\beat\b|\bcook\b|\bmake .* (food|dinner|lunch|breakfast|sandwich|meal)\b/.test(lower)) return { type: 'eat', raw: clause };
      if (/\bwork\b|\bstart working\b/.test(lower)) return { type: 'work', raw: clause, minutes: this.parseDuration(clause) || 60 };
      if (/\bpromise\b/.test(lower)) return this.parsePromise(clause, state);
      if (/\blook\b|\bwatch\b|\bobserve\b|\binspect\b|\bcheck\b/.test(lower)) return { type: 'observe', raw: clause };
      if (/\b(tell|ask|say|talk|convince|persuade|lie)\b/.test(lower)) return this.parseTalk(clause, state);
      return { type: 'generic', raw: clause };
    }

    findNPC(text, state) {
      const lower = text.toLowerCase();
      return Object.values(state.npcs).find(n => lower.includes(n.name.toLowerCase())) || null;
    }

    parseText(clause, state) {
      const npc = this.findNPC(clause, state);
      let body = clause;
      if (npc) {
        const rx = new RegExp(`(?:text|message)\\s+${npc.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\s*(?:that|:|,)?\\s*`, 'i');
        body = clause.replace(rx, '').trim();
      }
      body = body.replace(/^i\s+/i, '').trim();
      return { type: 'text', raw: clause, npcId: npc ? npc.id : null, body: body || 'Hey.' };
    }

    parseCall(clause, state) {
      const npc = this.findNPC(clause, state);
      return { type: 'call', raw: clause, npcId: npc ? npc.id : null };
    }

    parseTravel(clause, state) {
      const lower = clause.toLowerCase();
      let destinationId = null;
      const aliases = [
        ['home', ['home', 'apartment']], ['work', ['work', 'office', 'orthodontic']], ['maya_home', ["maya's", 'maya']],
        ['daniel_home', ["daniel's", 'daniel']], ['grocery', ['grocery', 'market']], ['coffee', ['coffee', 'juniper']],
        ['park', ['park', 'creekside']], ['auto_shop', ['auto shop', 'mechanic', 'valley auto']], ['dad_home', ["dad's", 'dad home']],
      ];
      for (const [id, words] of aliases) if (words.some(w => lower.includes(w))) { destinationId = id; break; }
      return { type: 'travel', raw: clause, destinationId, mode: lower.includes('walk') ? 'walk' : 'drive' };
    }

    parseGrab(clause) {
      const lower = clause.toLowerCase();
      const known = ['jacket', 'keys', 'phone', 'wallet', 'laptop'];
      const itemId = known.find(k => lower.includes(k)) || null;
      return { type: 'grab', raw: clause, itemId };
    }

    parseSleep(clause, state) {
      const lower = clause.toLowerCase();
      const forMatch = lower.match(/(?:for\s+)?(\d+(?:\.\d+)?)\s*(hours?|hrs?|minutes?|mins?)/);
      if (forMatch) {
        const n = Number(forMatch[1]);
        const mins = forMatch[2].startsWith('h') ? Math.round(n * 60) : Math.round(n);
        return { type: 'sleep', raw: clause, minutes: Math.max(10, mins) };
      }
      const untilMatch = lower.match(/until\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
      if (untilMatch) {
        let h = Number(untilMatch[1]); const m = Number(untilMatch[2] || 0); const ap = untilMatch[3];
        if (ap === 'pm' && h < 12) h += 12;
        if (ap === 'am' && h === 12) h = 0;
        let target = asDate(state.world.now); target = new Date(target);
        target.setHours(h, m, 0, 0);
        if (target <= asDate(state.world.now)) target.setDate(target.getDate() + 1);
        return { type: 'sleep', raw: clause, minutes: minutesBetween(state.world.now, nowISO(target)) };
      }
      return { type: 'sleep', raw: clause, minutes: lower.includes('nap') ? 45 : 8 * 60 };
    }

    parseWait(clause) {
      return { type: 'wait', raw: clause, minutes: this.parseDuration(clause) || 60 };
    }

    parseDuration(clause) {
      const m = clause.toLowerCase().match(/(\d+(?:\.\d+)?)\s*(hours?|hrs?|minutes?|mins?)/);
      if (!m) return null;
      return Math.round(Number(m[1]) * (m[2].startsWith('h') ? 60 : 1));
    }

    parsePurchase(clause) {
      const m = clause.match(/\$\s*(\d+(?:\.\d{1,2})?)/);
      let amount = m ? Number(m[1]) : null;
      const lower = clause.toLowerCase();
      if (!amount && lower.includes('coffee')) amount = 6.25;
      if (!amount && (lower.includes('grocer') || lower.includes('food'))) amount = 32;
      return { type: 'purchase', raw: clause, amount, useCash: /\bcash\b/.test(lower) };
    }

    parsePromise(clause, state) {
      const npc = this.findNPC(clause, state);
      const lower = clause.toLowerCase();
      let when = null;
      if (lower.includes('saturday')) when = nextSaturday(state.world.now, 10, 0);
      if (lower.includes('tomorrow')) when = atTime(state.world.now, 10, 0, 1);
      return { type: 'promise', raw: clause, npcId: npc ? npc.id : null, when };
    }

    parseTalk(clause, state) {
      const npc = this.findNPC(clause, state);
      const lower = clause.toLowerCase();
      return {
        type: 'talk', raw: clause, npcId: npc ? npc.id : null,
        persuasive: /convince|persuade/.test(lower), deceptive: /\blie\b|not true|pretend/.test(lower),
        implausibleClaim: /on the moon|teleported|invisible dragon|time travel/.test(lower),
      };
    }
  }

  class SimulationEngine {
    constructor(state, provider) {
      this.state = state || createInitialState();
      this.provider = provider || new LocalNarrativeProvider();
      this.interpreter = new ActionInterpreter();
      this.state.dialogue = this.state.dialogue || { version: 2, threads: {} };
      this.state.dialogue.version = 2;
      this.state.meta.provider = 'hybrid-context-v4-diagnostics';
      if (!this.state.ui.lastNarrative) {
        this.state.ui.lastNarrative = this.provider.generateScene(this.state, null);
        this.state.ui.suggestions = this.provider.generateSuggestions(this.state);
      }
    }

    log(type, text, hidden = false) {
      this.state.simulationLog.push({ at: this.state.world.now, type, text, hidden });
      if (this.state.simulationLog.length > 500) this.state.simulationLog.splice(0, this.state.simulationLog.length - 500);
    }

    interpretAction(raw) { return this.interpreter.interpret(raw, this.state); }

    validateAction(action) {
      const s = this.state;
      if (action.type === 'impossible') return { ok: false, reason: action.reason };
      if (action.type === 'text' || action.type === 'call') {
        if (!action.npcId || !s.npcs[action.npcId]) return { ok: false, reason: 'You do not have a usable contact for that person.' };
        if (!s.player.inventory.includes('phone')) return { ok: false, reason: 'Your phone is not with you.' };
      }
      if (action.type === 'travel') {
        if (!action.destinationId || !s.locations[action.destinationId]) return { ok: false, reason: 'That destination is not specific enough or is not currently known.' };
        if (action.mode === 'drive' && !s.player.possessions.some(p => p.id === 'car')) return { ok: false, reason: 'You do not have access to a car.' };
      }
      if (action.type === 'grab') {
        if (!action.itemId) return { ok: false, reason: 'It is not clear what object you are trying to take.' };
        const item = s.player.possessions.find(p => p.id === action.itemId);
        if (!item) return { ok: false, reason: 'You do not appear to own that item.' };
        if (item.locationId !== s.world.playerLocationId && !s.player.inventory.includes(item.id)) return { ok: false, reason: `${item.name} is not here.` };
      }
      if (action.type === 'purchase') {
        if (!action.amount || action.amount <= 0) return { ok: false, reason: 'The purchase needs a plausible price before it can be resolved.' };
        if (s.player.money.checking + s.player.money.cash < action.amount) return { ok: false, reason: `You do not have enough available money for ${formatMoney(action.amount)}.` };
      }
      if (action.type === 'talk') {
        if (action.npcId) {
          const npc = s.npcs[action.npcId];
          if (npc.current.locationId !== s.world.playerLocationId) return { ok: false, reason: `${npc.name} is not here. You could call or text instead.` };
        } else {
          const present = Object.values(s.npcs).filter(n => n.current.locationId === s.world.playerLocationId);
          if (!present.length) return { ok: false, reason: 'There is no known person here to direct that conversation to.' };
        }
      }
      if (action.type === 'work' && s.world.playerLocationId !== s.player.employment.locationId) return { ok: false, reason: 'You need to be at your workplace to work this shift.' };
      return { ok: true };
    }

    perform(raw) {
      const state = this.state;
      state.meta.turn += 1;
      this.log('player', `Player input: ${raw}`);
      const actions = this.interpretAction(raw);
      this.log('parse', `Parsed ${actions.length} action${actions.length === 1 ? '' : 's'}: ${actions.map(a => a.type).join(', ')}`);
      const results = [];
      const visibleEvents = [];

      if (!actions.length) {
        results.push({ ok: false, narrative: 'You hesitate without committing to an action.', minutes: 1 });
        visibleEvents.push(...this.advanceTime(1).visibleEvents);
      } else {
        for (const action of actions) {
          const validation = this.validateAction(action);
          if (!validation.ok) {
            this.log('validation', `Rejected ${action.type}: ${validation.reason}`);
            results.push({ ok: false, type: action.type, narrative: validation.reason, minutes: 1 });
            visibleEvents.push(...this.advanceTime(1).visibleEvents);
            continue;
          }
          const resolved = this.resolveAction(action);
          results.push(resolved);
          if (resolved.minutes > 0) visibleEvents.push(...this.advanceTime(resolved.minutes).visibleEvents);
        }
      }

      this.updateSituations();
      this.compressHistoryIfNeeded();
      state.meta.updatedAt = state.world.now;
      state.ui.lastActionResults = results;
      state.ui.lastNarrative = this.provider.generateScene(state, { results, visibleEvents });
      state.ui.suggestions = this.provider.generateSuggestions(state);
      this.log('scene', 'Scene and contextual suggestions generated.');
      return { state, results, visibleEvents, narrative: state.ui.lastNarrative, suggestions: state.ui.suggestions };
    }

    resolveAction(action) {
      const s = this.state;
      switch (action.type) {
        case 'text': return this.resolveText(action);
        case 'call': return this.resolveCall(action);
        case 'travel': return this.resolveTravel(action);
        case 'grab': return this.resolveGrab(action);
        case 'toggle_shower': this.log('action', 'Shower turned on.'); return { ok: true, type: action.type, minutes: 1, narrative: 'You turn the shower on. Water begins running behind the bathroom door.' };
        case 'shower': s.player.condition.stress = Math.max(0, s.player.condition.stress - 4); return { ok: true, type: action.type, minutes: 15, narrative: 'You take a shower and get dressed again.' };
        case 'sleep': return this.resolveSleep(action);
        case 'wait': return { ok: true, type: action.type, minutes: action.minutes, narrative: action.minutes >= 120 ? 'You let a few quiet hours pass.' : 'You let some time pass without doing much.' };
        case 'purchase': return this.resolvePurchase(action);
        case 'eat': s.player.condition.hunger = Math.max(5, s.player.condition.hunger - 42); return { ok: true, type: action.type, minutes: 25, narrative: 'You make something simple to eat and finish the meal.' };
        case 'work': return this.resolveWork(action);
        case 'promise': return this.resolvePromise(action);
        case 'observe': return this.resolveObserve(action);
        case 'talk': return this.resolveTalk(action);
        case 'generic': return this.resolveGeneric(action);
        default: return { ok: false, type: action.type, minutes: 1, narrative: 'That action could not be interpreted clearly enough to resolve.' };
      }
    }

    resolveText(action) {
      const s = this.state; const npc = s.npcs[action.npcId]; const thread = npc.phone.threadId;
      s.messages[thread] = s.messages[thread] || [];
      const analysis = this.analyzePlayerMessage(npc, action.body, thread);
      const msg = {
        id: makeId('msg', s), at: s.world.now, senderId: 'jonathan', recipientId: npc.id,
        body: action.body, read: true, topic: analysis.topic, intent: analysis.intent,
      };
      s.messages[thread].push(msg);
      this.updateDialogueThread(thread, { topic: analysis.topic, lastPlayerIntent: analysis.intent, lastPlayerMessageId: msg.id });
      this.log('message', `Message sent to ${npc.name}. Topic=${analysis.topic}; intent=${analysis.intent}.`);

      const replyPlan = this.composeReply(npc, action.body, thread, msg.id, analysis);
      const delay = this.replyDelayMinutes(npc, analysis);
      const replyEventId = makeId('evt', s);
      s.scheduledEvents.push({
        id: replyEventId, type: 'message_response', title: `${npc.name} reply`,
        triggerAt: addMinutesISO(s.world.now, delay), deadlineAt: null, status: 'queued', visibility: 'hidden', npcId: npc.id,
        payload: {
          respondingTo: msg.id, incomingBody: replyPlan.body, topic: replyPlan.topic,
          intent: replyPlan.intent, memoryEvent: replyPlan.memoryEvent || null, engineVersion: 2,
          dialogueProvider: 'local-context-v2',
        },
      });

      if (/thank|appreciate|checking on you|hope you're okay|how are you|sorry/i.test(action.body)) {
        this.changeRelationship(npc.id, { trust: 1, affection: 1 }, `Jonathan sent a considerate message: "${action.body}"`);
      }
      return {
        ok: true, type: action.type, minutes: 1, narrative: `You text ${npc.name}: “${action.body}”`,
        npcId: npc.id, outgoingMessageId: msg.id, replyEventId,
      };
    }

    normalizeDialogueText(text) {
      return String(text || '')
        .toLowerCase()
        .replace(/[’]/g, "'")
        .replace(/[^a-z0-9'?!$%\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    updateDialogueThread(threadId, patch) {
      const s = this.state;
      s.dialogue = s.dialogue || { version: 2, threads: {} };
      s.dialogue.threads = s.dialogue.threads || {};
      const current = s.dialogue.threads[threadId] || { topic: 'general', turns: 0 };
      s.dialogue.threads[threadId] = { ...current, ...patch, turns: (current.turns || 0) + 1, updatedAt: s.world.now };
      return s.dialogue.threads[threadId];
    }

    dialogueContext(npc, threadId, respondingToId = null) {
      const all = (this.state.messages[threadId] || []);
      let end = all.length;
      if (respondingToId) {
        const idx = all.findIndex(m => m.id === respondingToId);
        if (idx >= 0) end = idx + 1;
      }
      const messages = all.slice(Math.max(0, end - 10), end);
      const current = messages[messages.length - 1] || null;
      const beforeCurrent = messages.slice(0, -1);
      const lastNpc = [...beforeCurrent].reverse().find(m => m.senderId === npc.id) || null;
      const lastPlayer = [...beforeCurrent].reverse().find(m => m.senderId === 'jonathan') || null;
      const lastNpcBeforeLastPlayer = lastPlayer
        ? [...beforeCurrent.slice(0, beforeCurrent.lastIndexOf(lastPlayer))].reverse().find(m => m.senderId === npc.id) || null
        : null;
      const threadState = (this.state.dialogue && this.state.dialogue.threads && this.state.dialogue.threads[threadId]) || {};
      return { messages, current, lastNpc, lastPlayer, lastNpcBeforeLastPlayer, threadState };
    }

    inferDialogueTopic(text, npc, context = null) {
      const lower = this.normalizeDialogueText(text);
      if (/\b(work|job|boss|manager|office|shift|schedule|coworker|week was|this week)\b/.test(lower)) return 'work';
      if (/\b(money|bank|balance|rent|pay|paid|cost|cash|dollar|\$)\b/.test(lower)) return 'money';
      if (/\b(home|apartment|house|where are you|where you at|location)\b/.test(lower)) return 'location';
      if (/\b(gym|workout|exercise|basketball)\b/.test(lower)) return 'fitness';
      if (/\b(dinner|eat|food|coffee|breakfast|lunch)\b/.test(lower)) return 'food';
      if (/\b(saturday|sunday|monday|tuesday|wednesday|thursday|friday|tomorrow|tonight|later|when|time|plan|plans|free)\b/.test(lower)) return 'plans';
      if (/\b(tired|okay|good|bad|feel|feeling|night|day|doing|how are you|how r you)\b/.test(lower)) return 'wellbeing';
      if (/\b(car|squeak|mechanic|oil)\b/.test(lower)) return 'car';
      if (context && context.lastNpc) {
        const inherited = context.lastNpc.topic || this.inferDialogueTopic(context.lastNpc.body, npc, null);
        if (inherited && inherited !== 'general') return inherited;
      }
      if (context && context.threadState && context.threadState.topic) return context.threadState.topic;
      if (npc.id === 'maya' && npc.plans && (npc.plans.unresolvedProblems || []).some(x => /work|schedule|manager/i.test(x))) return 'work';
      return 'general';
    }

    inferDialogueIntent(text, context = null) {
      const lower = this.normalizeDialogueText(text);
      if (/\bwhat works\b|\bwhat do you mean\b|\bwhat did you mean\b|\bthat makes no sense\b|\bi'm confused\b|\bim confused\b|^huh\??$/.test(lower)) return 'repair';
      if (/\bwhat happened\b|\bwhat's happened\b|\bwhat was ridiculous\b|\bwhy\b|\bhow come\b|\btell me more\b|\bwhat went on\b/.test(lower)) return 'ask_explain';
      if (/\bhow are you\b|\bhow r you\b|\byou okay\b|\bare you okay\b|\bhow you doing\b|\bhow's your night\b|\bhow is your night\b/.test(lower)) return 'ask_wellbeing';
      if (/\bwhat are you doing\b|\bwhat're you doing\b|\bwhat you doing\b|\bwyd\b/.test(lower)) return 'ask_activity';
      if (/\bwhere are you\b|\bwhere you at\b/.test(lower)) return 'ask_location';
      if (/\bwhich shift\b|\bwhat shift\b|\bwhen is it\b|\bwhat day\b|\bwhat time\b/.test(lower)) return 'ask_schedule_detail';
      if (/\bcan you\b|\bcould you\b|\bwould you\b|\bdo you want\b|\bwanna\b|\bwant to\b/.test(lower) && /\?/.test(lower)) return 'request';
      if (/\bthank|thanks|appreciate\b/.test(lower)) return 'thanks';
      if (/\bsorry|my bad\b/.test(lower)) return 'apology';
      if (/^(hey|hi|hello|yo)\b/.test(lower)) return 'greeting';
      if (/\?$/.test(lower) || /^(what|why|how|when|where|who|is|are|do|did|can|could|would)\b/.test(lower)) return 'question';
      if (/\b(ok|okay|sure|sounds good|got it|alright|yeah|yep|yes)\b/.test(lower) && lower.length < 35) return 'acknowledge';
      if (/\b(no|nah|can't|cannot|wont|won't|don't want)\b/.test(lower) && lower.length < 50) return 'decline';
      if (context && context.lastNpc && /\?/.test(context.lastNpc.body || '')) return 'answer';
      return 'statement';
    }

    analyzePlayerMessage(npc, body, threadId) {
      const context = this.dialogueContext(npc, threadId);
      const intent = this.inferDialogueIntent(body, context);
      const topic = this.inferDialogueTopic(body, npc, context);
      return { intent, topic };
    }

    replyDelayMinutes(npc, analysis) {
      const s = this.state;
      let base = 2 + Math.floor(seededRandom(s) * 10);
      if (npc.current.activity === 'working') base += 8 + Math.floor(seededRandom(s) * 18);
      if (analysis.intent === 'repair' || analysis.intent === 'ask_explain') base = Math.max(2, base - 2);
      return base;
    }

    chooseReply(options) {
      if (!options || !options.length) return '';
      const i = Math.floor(seededRandom(this.state) * options.length);
      return options[Math.max(0, Math.min(options.length - 1, i))];
    }

    contextualFallback(npc, topic, intent, context) {
      const lastNpcText = context.lastNpc ? this.normalizeDialogueText(context.lastNpc.body) : '';
      if (intent === 'question') {
        if (topic === 'work') return npc.id === 'maya'
          ? 'Mostly work stuff. The schedule has been a mess lately. What part did you mean?'
          : npc.id === 'daniel' ? 'If you mean work, it’s been pretty routine. What were you asking about exactly?' : 'If you mean work, things are moving along. What part are you asking about?';
        if (topic === 'plans') return 'I’m not totally sure what you mean. Are you asking what I’m doing later or about a specific plan?';
        if (topic === 'wellbeing') return `I’m ${npc.current.mood || 'okay'} right now. What did you want to know?`;
        if (lastNpcText) return `I might be missing what you mean. Are you asking about what I just said?`;
        return 'I’m not totally sure what you mean. Can you say it another way?';
      }
      if (intent === 'statement') {
        if (topic === 'work') return npc.id === 'maya' ? 'Yeah. Work has been taking more out of me than usual lately.' : 'Yeah, I get you. Work has been pretty normal on my end.';
        if (topic === 'plans') return 'Got it. Keep me posted once you know what you want to do.';
        return npc.id === 'dad' ? 'Got it. Keep me posted.' : 'Yeah, I get what you mean.';
      }
      return 'I might be missing the context. Say that one more way?';
    }

    repairReply(npc, context) {
      const lastNpc = context.lastNpc;
      const priorPlayer = context.lastPlayer;
      const priorNpc = context.lastNpcBeforeLastPlayer;
      const genericAck = lastNpc && /^(yeah,? that works\.?|sounds good\.?|okay\.?|got it\.?)$/i.test((lastNpc.body || '').trim());
      if (genericAck && priorPlayer) {
        const priorIntent = this.inferDialogueIntent(priorPlayer.body, { lastNpc: priorNpc, threadState: context.threadState });
        const priorTopic = this.inferDialogueTopic(priorPlayer.body, npc, { lastNpc: priorNpc, threadState: context.threadState });
        if (priorIntent === 'ask_explain' && npc.id === 'maya' && priorTopic === 'work') {
          return 'Sorry, that reply made no sense. I meant work was ridiculous. My schedule kept getting moved around and we were short-staffed, so I got stuck staying late a couple times. Nothing dramatic, just exhausting.';
        }
        if (priorTopic === 'plans') return 'Sorry, I answered that badly. I meant the plan we were talking about. Tell me which part you were asking about.';
        return `Sorry, that reply didn't match what you asked. I was responding to your last message, not saying that something specific “works.”`;
      }
      return `Sorry, I wasn't clear. Tell me which part you want me to explain and I'll answer that directly.`;
    }

    composeReply(npc, body, threadId, respondingToId = null, analysis = null) {
      const context = this.dialogueContext(npc, threadId, respondingToId);
      const intent = analysis ? analysis.intent : this.inferDialogueIntent(body, context);
      const topic = analysis ? analysis.topic : this.inferDialogueTopic(body, npc, context);
      const lower = this.normalizeDialogueText(body);
      let reply = '';
      let memoryEvent = null;

      if (intent === 'repair') {
        reply = this.repairReply(npc, context);
      } else if (intent === 'ask_explain') {
        if (npc.id === 'maya' && topic === 'work') {
          reply = this.chooseReply([
            'Mostly work. My schedule kept getting changed around and we were short-staffed, so I ended up staying late a couple times. Nothing huge happened, it was just one annoying thing after another.',
            'Work, mainly. The schedule was all over the place and we were short a person more than once. I kept thinking I was done and then something else came up.',
            'Honestly, mostly work. Too many last-minute schedule changes, not enough people, and a couple late days. By the end of the week I was completely over it.'
          ]);
          memoryEvent = 'Maya told Jonathan that her rough week was mainly caused by schedule changes, short staffing, and staying late.';
        } else if (npc.id === 'daniel' && topic === 'work') {
          reply = 'Nothing dramatic. Work has just been busy and I’m trying to sort out one of my upcoming shifts.';
        } else if (topic === 'wellbeing') {
          reply = `Nothing major. I’m just ${npc.current.mood || 'a little worn out'} and trying to have a quiet night.`;
        } else {
          reply = this.contextualFallback(npc, topic, 'question', context);
        }
      } else if (intent === 'ask_wellbeing') {
        if (npc.id === 'maya') reply = 'I’m okay. Just tired and kind of done with work for the week. I’m home now, so I’m trying to shut my brain off.';
        else if (npc.id === 'daniel') reply = `I’m good. Pretty normal night. ${npc.current.activity === 'working out' ? 'I’m at the gym right now.' : 'Just figuring out what I want to do later.'}`;
        else reply = 'I’m good. Just taking care of a few things around the house.';
      } else if (intent === 'ask_activity') {
        const activity = npc.current.activity || 'taking it easy';
        if (npc.id === 'maya' && activity === 'at home') reply = 'I’m home. Mostly sitting around and trying to decompress.';
        else if (npc.id === 'daniel' && activity === 'at home') reply = 'At home right now. Debating whether I actually feel like going out again.';
        else if (npc.id === 'dad' && activity === 'at home') reply = 'At home. I’m finishing a couple things and then I’m done for the night.';
        else reply = `I’m ${activity} right now.`;
      } else if (intent === 'ask_location') {
        const loc = this.state.locations[npc.current.locationId];
        reply = loc ? `I’m at ${loc.name} right now.` : 'I’m out right now, but nothing unusual.';
      } else if (intent === 'ask_schedule_detail' || /\bshift\b/.test(lower)) {
        if (npc.id === 'daniel') reply = 'I meant the later upcoming shift. I’m still trying to pin down whether I actually need to swap it, so I don’t want to give you the wrong day yet.';
        else if (npc.id === 'maya') reply = 'My schedule has been changing enough that I’m not counting on anything until it’s actually posted.';
        else reply = 'I’ll check the exact time before I tell you so I don’t give you the wrong one.';
      } else if (/\blate\b/.test(lower)) {
        reply = npc.id === 'maya' ? 'No problem. Just let me know when you’re actually heading over.' : 'All good. Just text me when you’re on the way.';
      } else if (/\bhelp\b|\bsaturday\b/.test(lower) && intent !== 'question') {
        reply = 'That would help. I’ll confirm the time with you before then.';
      } else if (intent === 'thanks') {
        reply = npc.id === 'dad' ? 'Of course.' : this.chooseReply(['Of course.', 'Anytime.', 'Yeah, no problem.']);
      } else if (intent === 'apology') {
        reply = npc.relationship.resentment > 25 ? 'I hear you. I’m still a little annoyed, but I appreciate you saying that.' : 'You’re fine. I appreciate you saying it.';
      } else if (intent === 'greeting') {
        reply = npc.id === 'dad' ? 'Hey. Everything okay?' : this.chooseReply(['Hey, what’s up?', 'Hey. How’s your night going?', 'Hey lol, what’s going on?']);
      } else if (intent === 'acknowledge') {
        reply = topic === 'work' && npc.id === 'maya' ? 'Yeah. I’m just glad the week is over.' : this.chooseReply(['Yeah.', 'Gotcha.', 'Okay, good.']);
      } else if (intent === 'decline') {
        reply = npc.id === 'maya' ? 'That’s fine. No pressure.' : npc.id === 'dad' ? 'Okay. Just let me know what you decide.' : 'No worries.';
      } else if (intent === 'answer') {
        reply = this.contextualFallback(npc, topic, 'statement', context);
      } else if (intent === 'request') {
        if (/\bcall\b/.test(lower)) reply = npc.current.activity === 'working' ? 'I can call when I’m free.' : 'Yeah, give me a few minutes.';
        else if (/\bcome over|hang out|meet|coffee|dinner\b/.test(lower)) reply = npc.id === 'maya' ? 'Maybe. What time were you thinking?' : 'Possibly. What did you have in mind?';
        else reply = 'Maybe. Tell me exactly what you’re asking and I’ll let you know.';
      } else {
        reply = this.contextualFallback(npc, topic, intent, context);
      }

      if (!reply || /^(yeah,? that works\.?|sounds good\.?)$/i.test(reply.trim())) {
        reply = this.contextualFallback(npc, topic, intent === 'question' ? 'question' : 'statement', context);
      }

      this.updateDialogueThread(threadId, { topic, lastNpcIntent: 'reply', lastNpcPlannedReplyTo: respondingToId });
      return { body: reply, topic, intent: 'reply', memoryEvent };
    }

    resolveCall(action) {
      const npc = this.state.npcs[action.npcId];
      const reachable = npc.current.activity !== 'working' || seededRandom(this.state) > 0.45;
      if (!reachable) return { ok: true, type: action.type, minutes: 2, narrative: `${npc.name} does not answer. The call rolls to voicemail.` };
      this.markThreadRead(npc.phone.threadId);
      this.addMemory(npc.id, { event: `Jonathan called ${npc.name} and they spoke briefly.`, emotionalValence: 0.1, emotionalStrength: 0.1, importance: 0.15, decay: 'normal', private: false, secret: false });
      return { ok: true, type: action.type, minutes: 8, narrative: `${npc.name} answers. You have a brief, ordinary conversation.` };
    }

    resolveTravel(action) {
      const s = this.state; const from = s.world.playerLocationId; const to = action.destinationId;
      if (from === to) return { ok: true, type: action.type, minutes: 1, narrative: `You are already at ${s.locations[to].name}.` };
      let minutes = (s.locations[from].travel && s.locations[from].travel[to]) || (s.locations[to].travel && s.locations[to].travel[from]) || 20;
      if (action.mode === 'walk') minutes = Math.max(8, minutes * 3);
      s.world.playerLocationId = to;
      const car = s.player.possessions.find(p => p.id === 'car');
      if (action.mode === 'drive' && car) car.locationId = to;
      this.checkAttendanceOnArrival(to);
      this.log('location', `Player moved from ${from} to ${to}.`);
      return { ok: true, type: action.type, minutes, narrative: `${action.mode === 'walk' ? 'You walk' : 'You drive'} to ${s.locations[to].name}. The trip takes about ${minutes} minutes.` };
    }

    resolveGrab(action) {
      const s = this.state; const item = s.player.possessions.find(p => p.id === action.itemId);
      if (!s.player.inventory.includes(item.id)) s.player.inventory.push(item.id);
      item.locationId = 'carried';
      this.log('inventory', `${item.name} added to carried inventory.`);
      return { ok: true, type: action.type, minutes: 1, narrative: `You grab your ${item.name.toLowerCase()}.` };
    }

    resolveSleep(action) {
      const s = this.state;
      s.player.condition.energy = Math.min(100, s.player.condition.energy + Math.round(action.minutes / 9));
      s.player.condition.hunger = Math.min(100, s.player.condition.hunger + Math.round(action.minutes / 18));
      return { ok: true, type: action.type, minutes: action.minutes, narrative: action.minutes >= 180 ? 'You go to sleep.' : 'You lie down and sleep for a while.' };
    }

    resolvePurchase(action) {
      const s = this.state;
      let source = 'checking';
      if (action.useCash && s.player.money.cash >= action.amount) {
        s.player.money.cash -= action.amount;
        source = 'cash';
      } else {
        s.player.money.checking -= action.amount;
        s.bankTransactions.push({ id: makeId('tx', s), at: s.world.now, amount: action.amount, direction: 'out', description: action.raw.replace(/^i\s+/i, '').slice(0, 80), balanceAfter: s.player.money.checking });
      }
      this.log('money', `Spent ${formatMoney(action.amount)} from ${source}.`);
      return { ok: true, type: action.type, minutes: 4, narrative: `You spend ${formatMoney(action.amount)}${source === 'cash' ? ' in cash' : ''}.` };
    }

    resolveWork(action) {
      const s = this.state; const minutes = Math.max(15, action.minutes || 60);
      const pay = Math.round((s.player.employment.hourlyRate * minutes / 60) * 100) / 100;
      s.player.money.checking += pay;
      s.bankTransactions.push({ id: makeId('tx', s), at: addMinutesISO(s.world.now, minutes), amount: pay, direction: 'in', description: 'Work earnings', balanceAfter: s.player.money.checking });
      s.player.condition.energy = Math.max(0, s.player.condition.energy - Math.round(minutes / 45));
      this.log('employment', `Worked ${minutes} minutes; ${formatMoney(pay)} accrued.`);
      return { ok: true, type: action.type, minutes, narrative: `You work for about ${Math.round(minutes / 15) * 15} minutes. The time is routine rather than eventful.` };
    }

    resolvePromise(action) {
      const s = this.state;
      const npc = action.npcId ? s.npcs[action.npcId] : null;
      const promise = { id: makeId('promise', s), text: action.raw, madeAt: s.world.now, npcId: action.npcId, dueAt: action.when, status: 'active' };
      s.player.promises.push(promise);
      if (npc) {
        this.addMemory(npc.id, { event: `Jonathan made a promise: ${action.raw}`, emotionalValence: 0.25, emotionalStrength: 0.3, importance: 0.7, decay: 'none', private: false, secret: false });
        this.changeRelationship(npc.id, { trust: 1 }, `Jonathan made a clear commitment to ${npc.name}.`);
      }
      if (action.when) s.scheduledEvents.push({ id: makeId('evt', s), type: 'promise_due', title: npc ? `Promise to ${npc.name}` : 'Promise', triggerAt: action.when, deadlineAt: addMinutesISO(action.when, 180), status: 'queued', visibility: 'known', requiresPresence: false, payload: { promiseId: promise.id } });
      return { ok: true, type: action.type, minutes: 2, narrative: `You make the commitment${npc ? ` to ${npc.name}` : ''}${action.when ? ' and put the timing in mind' : ''}.` };
    }

    resolveObserve(action) {
      const s = this.state; const loc = s.locations[s.world.playerLocationId]; const lower = action.raw.toLowerCase();
      if (lower.includes('phone') || lower.includes('message')) {
        Object.keys(s.messages).forEach(t => this.markThreadRead(t));
        return { ok: true, type: action.type, minutes: 2, narrative: 'You check your phone and read the waiting messages.' };
      }
      if (lower.includes('window') && s.world.playerLocationId === 'home') return { ok: true, type: action.type, minutes: 2, narrative: 'You look through the bedroom window. Nothing unusual stands out from what you can see.' };
      const present = Object.values(s.npcs).filter(n => n.current.locationId === s.world.playerLocationId);
      if (present.length && present.some(n => lower.includes(n.name.toLowerCase()))) {
        const n = present.find(n => lower.includes(n.name.toLowerCase()));
        return { ok: true, type: action.type, minutes: 2, narrative: `${n.name} looks ${n.current.mood}. You can notice posture and tone, but not what ${n.name} is thinking.` };
      }
      return { ok: true, type: action.type, minutes: 3, narrative: `${loc.description} Nothing immediately unusual stands out.` };
    }

    resolveTalk(action) {
      const s = this.state; let npc = action.npcId ? s.npcs[action.npcId] : null;
      if (!npc) npc = Object.values(s.npcs).find(n => n.current.locationId === s.world.playerLocationId);
      if (action.implausibleClaim) {
        this.changeRelationship(npc.id, { respect: -1 }, `${npc.name} was given an obviously implausible explanation.`);
        this.addMemory(npc.id, { event: `Jonathan made an implausible claim: ${action.raw}`, emotionalValence: -0.1, emotionalStrength: 0.15, importance: 0.25, decay: 'normal', private: false, secret: false });
        return { ok: true, type: action.type, minutes: 4, outcome: 'disbelieved', narrative: `${npc.name} listens, but the explanation is too implausible to be convincing. ${npc.name} does not appear to believe it.` };
      }
      if (action.persuasive) {
        const skill = s.player.skills.persuasion / 100;
        const rel = npc.relationship.trust / 100;
        const chance = Math.min(0.9, 0.28 + skill * 0.42 + rel * 0.2);
        const success = seededRandom(s) < chance;
        if (success) this.changeRelationship(npc.id, { respect: 1 }, `A reasonable persuasive conversation landed well.`);
        return { ok: true, type: action.type, minutes: 8, outcome: success ? 'success' : 'failure', narrative: success ? `${npc.name} considers what you say and seems persuaded.` : `${npc.name} hears you out but does not agree.` };
      }
      if (/thank|appreciate|sorry/i.test(action.raw)) this.changeRelationship(npc.id, { trust: 1, affection: 1 }, `Jonathan spoke considerately to ${npc.name}.`);
      this.addMemory(npc.id, { event: `Conversation with Jonathan: ${action.raw}`, emotionalValence: 0, emotionalStrength: 0.08, importance: 0.12, decay: 'fast', private: false, secret: false });
      return { ok: true, type: action.type, minutes: 7, narrative: `${npc.name} responds in a normal conversational tone. The exchange is brief and grounded in what was actually said.` };
    }

    resolveGeneric(action) {
      const lower = action.raw.toLowerCase();
      if (/jump .*roof|moving truck/.test(lower)) {
        return { ok: false, type: action.type, minutes: 1, narrative: 'That would be extremely dangerous under ordinary conditions. You do not have a safe, plausible way to carry it out as stated.' };
      }
      return { ok: true, type: action.type, minutes: 4, narrative: `You try to ${action.raw.replace(/^i\s+/i, '')}. Nothing about the attempt creates facts that were not already supported by the situation.` };
    }

    advanceTime(minutes) {
      const s = this.state;
      const from = s.world.now;
      const to = addMinutesISO(from, Math.max(0, minutes));
      s.world.now = to;
      this.updatePlayerNeeds(minutes);
      this.simulateNPCs(from, to);
      const visibleEvents = this.processScheduledEvents(from, to);
      this.log('time', `Advanced ${minutes} minute${minutes === 1 ? '' : 's'} to ${to}.`);
      return { from, to, visibleEvents };
    }

    updatePlayerNeeds(minutes) {
      const c = this.state.player.condition;
      c.hunger = Math.min(100, c.hunger + minutes / 55);
      if (minutes > 90) c.energy = Math.max(0, c.energy - minutes / 180);
      c.description = c.energy < 25 ? 'Tired' : c.hunger > 75 ? 'Hungry' : 'Fine';
    }

    simulateNPCs(from, to) {
      const s = this.state;
      Object.values(s.npcs).forEach(npc => {
        const oldLoc = npc.current.locationId;
        const oldActivity = npc.current.activity;
        const status = this.scheduleStateForNPC(npc, to);
        npc.current.locationId = status.locationId;
        npc.current.activity = status.activity;
        if (oldLoc !== status.locationId || oldActivity !== status.activity) this.log('npc', `${npc.name} background state: ${status.activity} at ${status.locationId}.`, true);
      });
    }

    scheduleStateForNPC(npc, iso) {
      const d = asDate(iso); const day = d.getDay(); const mins = d.getHours() * 60 + d.getMinutes(); const weekday = day >= 1 && day <= 5;
      if (npc.id === 'maya') {
        if (weekday && mins >= 8 * 60 + 30 && mins < 17 * 60 + 30) return { locationId: 'work', activity: 'working' };
        if ((day === 2 || day === 4) && mins >= 18 * 60 + 15 && mins < 19 * 60 + 15) return { locationId: 'gym', activity: 'working out' };
        if (!weekday && mins >= 11 * 60 && mins < 13 * 60) return { locationId: 'coffee', activity: 'out for errands' };
        return { locationId: 'maya_home', activity: 'at home' };
      }
      if (npc.id === 'daniel') {
        if (weekday && mins >= 9 * 60 && mins < 17 * 60) return { locationId: 'work', activity: 'working' };
        if (weekday && mins >= 18 * 60 + 30 && mins < 20 * 60) return { locationId: 'gym', activity: 'working out' };
        return { locationId: 'daniel_home', activity: 'at home' };
      }
      if (npc.id === 'dad') {
        if (weekday && mins >= 8 * 60 && mins < 16 * 60 + 30) return { locationId: 'dad_studio', activity: 'working' };
        return { locationId: 'dad_home', activity: 'at home' };
      }
      return { locationId: npc.homeLocationId, activity: 'at home' };
    }

    processScheduledEvents(from, to) {
      const s = this.state; const visible = [];
      const due = s.scheduledEvents.filter(e => e.status === 'queued' && asDate(e.triggerAt) <= asDate(to)).sort((a, b) => asDate(a.triggerAt) - asDate(b.triggerAt));
      for (const event of due) {
        if (event.type === 'message_response') {
          const npc = s.npcs[event.npcId]; const thread = npc.phone.threadId;
          const sent = (s.messages[thread] || []).find(m => m.id === event.payload.respondingTo);
          let incomingBody = event.payload.incomingBody;
          let topic = event.payload.topic || 'general';
          let memoryEvent = event.payload.memoryEvent || null;
          if (!event.payload.engineVersion && sent) {
            const repairedPlan = this.composeReply(npc, sent.body, thread, sent.id);
            incomingBody = repairedPlan.body; topic = repairedPlan.topic; memoryEvent = repairedPlan.memoryEvent || null;
          }
          s.messages[thread].push({
            id: makeId('msg', s), at: event.triggerAt, senderId: npc.id, recipientId: 'jonathan',
            body: incomingBody, read: false, topic, intent: 'reply', replyToId: event.payload.respondingTo || null,
          });
          this.updateDialogueThread(thread, { topic, lastNpcMessageAt: event.triggerAt });
          if (memoryEvent && !npc.memories.some(m => m.event === memoryEvent)) {
            this.addMemory(npc.id, { event: memoryEvent, emotionalValence: 0, emotionalStrength: 0.12, importance: 0.28, decay: 'slow', private: false, secret: false });
          }
          event.status = 'completed';
          visible.push({ type: 'message', text: `A message from ${npc.name} arrives.` });
          this.log('event', `Incoming contextual message from ${npc.name}.`);
        } else if (event.type === 'npc_call') {
          const npc = s.npcs[event.npcId];
          const thread = npc.phone.threadId;
          s.messages[thread].push({ id: makeId('msg', s), at: event.triggerAt, senderId: npc.id, recipientId: 'jonathan', body: 'Tried calling. Nothing urgent—call me when you have a minute.', read: false });
          event.status = 'completed';
          visible.push({ type: 'call', text: `${npc.name} tries to call. If you do not answer in the moment, a short message follows.` });
          this.log('event', `${npc.name} call event processed.`);
        } else if (event.type === 'npc_private') {
          this.processPrivateNPCEvent(event);
          event.status = 'completed';
          this.log('event', `Private NPC event processed for ${event.npcId}.`, true);
        } else if (event.type === 'reminder') {
          event.status = 'completed';
          visible.push({ type: 'reminder', text: `Your calendar reminder appears: ${event.title}.` });
          this.log('event', `Reminder delivered: ${event.title}.`);
          if (event.recurrence === 'monthly') this.rescheduleMonthly(event);
        } else if (event.type === 'promise_due') {
          event.status = 'completed';
          const promise = s.player.promises.find(p => p.id === event.payload.promiseId);
          if (promise && promise.status === 'active') {
            visible.push({ type: 'promise', text: `The time you had in mind for a promise has arrived: ${promise.text}.` });
            this.log('event', `Promise due: ${promise.text}`);
          }
        } else if (event.type === 'appointment') {
          const atPlace = s.world.playerLocationId === event.locationId;
          if (atPlace) {
            event.status = 'attended';
            visible.push({ type: 'appointment', text: `${event.title} is now underway.` });
            this.log('event', `Appointment attended: ${event.title}.`);
          } else if (event.deadlineAt && asDate(to) > asDate(event.deadlineAt)) {
            event.status = 'missed';
            s.journal.recentMajorEvents.unshift({ at: to, text: `Missed: ${event.title}` });
            visible.push({ type: 'missed', text: `You realize you have missed ${event.title.toLowerCase()}.` });
            this.log('event', `Appointment missed: ${event.title}.`);
            if (event.consequence === 'work-shift') this.applyMissedWorkConsequence(event);
          } else {
            event.status = 'started';
            visible.push({ type: 'appointment', text: `${event.title} has started, and you are not there yet.` });
            this.log('event', `Appointment started while player absent: ${event.title}.`);
          }
        }
      }

      // Started appointments can become missed as more time passes.
      s.scheduledEvents.filter(e => e.status === 'started' && e.deadlineAt && asDate(to) > asDate(e.deadlineAt)).forEach(event => {
        event.status = 'missed';
        s.journal.recentMajorEvents.unshift({ at: to, text: `Missed: ${event.title}` });
        visible.push({ type: 'missed', text: `The window for ${event.title.toLowerCase()} passes. It is now missed.` });
        this.log('event', `Started appointment became missed: ${event.title}.`);
        if (event.consequence === 'work-shift') this.applyMissedWorkConsequence(event);
      });
      return visible;
    }

    checkAttendanceOnArrival(locationId) {
      const s = this.state;
      s.scheduledEvents.filter(e => (e.status === 'queued' || e.status === 'started') && e.locationId === locationId).forEach(event => {
        if (asDate(s.world.now) >= asDate(event.triggerAt) && (!event.deadlineAt || asDate(s.world.now) <= asDate(event.deadlineAt))) {
          event.status = 'attended';
          this.log('event', `Arrival satisfied event: ${event.title}.`);
        }
      });
    }

    applyMissedWorkConsequence(event) {
      const s = this.state;
      if (!s.activeSituations.some(x => x.id === `sit_${event.id}`)) {
        s.activeSituations.push({ id: `sit_${event.id}`, title: 'Missed work shift', status: 'active', involvedPeople: ['jonathan'], knownInformation: ['Jonathan missed a scheduled shift without being at the office during the arrival window.'], hiddenInformation: {}, possibleFutureDevelopments: ['The office may ask what happened.', 'Repeated attendance issues could affect employment.'], deadlineAt: null, consequences: ['Attendance record affected'], urgency: 'medium' });
      }
    }

    processPrivateNPCEvent(event) {
      const s = this.state; const npc = s.npcs[event.npcId];
      if (!npc) return;
      if (event.payload && event.payload.kind === 'work-frustration') {
        npc.current.mood = 'annoyed';
        npc.plans.unresolvedProblems = npc.plans.unresolvedProblems || [];
        if (!npc.plans.unresolvedProblems.includes('manager denied a schedule request')) npc.plans.unresolvedProblems.push('manager denied a schedule request');
        this.addMemory(npc.id, { event: 'Her manager denied a schedule request during work.', emotionalValence: -0.45, emotionalStrength: 0.5, importance: 0.45, decay: 'slow', private: true, secret: false, witnesses: ['maya'] });
      }
    }

    rescheduleMonthly(event) {
      const s = this.state; const d = asDate(event.triggerAt); d.setMonth(d.getMonth() + 1);
      s.scheduledEvents.push({ ...clone(event), id: makeId('evt', s), triggerAt: nowISO(d), status: 'queued' });
    }

    markThreadRead(threadId) {
      (this.state.messages[threadId] || []).forEach(m => { if (m.recipientId === 'jonathan') m.read = true; });
    }

    addMemory(npcId, data) {
      const npc = this.state.npcs[npcId]; if (!npc) return null;
      const memory = {
        id: makeId('mem', this.state), event: data.event, timestamp: data.timestamp || this.state.world.now,
        people: data.people || ['jonathan', npcId], witnesses: data.witnesses || [npcId], emotionalValence: data.emotionalValence || 0,
        emotionalStrength: data.emotionalStrength || 0, importance: data.importance || 0.2, confidence: data.confidence == null ? 1 : data.confidence,
        private: Boolean(data.private), secret: Boolean(data.secret), decay: data.decay || 'normal', consequences: data.consequences || [],
      };
      npc.memories.push(memory);
      this.log('memory', `Memory created for ${npc.name}: ${memory.event}`, true);
      return memory;
    }

    changeRelationship(npcId, changes, reason) {
      const npc = this.state.npcs[npcId]; if (!npc) return;
      const applied = [];
      for (const [key, delta] of Object.entries(changes)) {
        if (typeof npc.relationship[key] !== 'number') continue;
        npc.relationship[key] = Math.max(0, Math.min(100, npc.relationship[key] + delta));
        applied.push(`${key} ${delta >= 0 ? '+' : ''}${delta}`);
      }
      if (applied.length) this.log('relationship', `${npc.name}: ${applied.join(', ')}. Reason: ${reason}`, true);
    }

    updateSituations() {
      const s = this.state;
      for (const sit of s.activeSituations) {
        if (sit.status !== 'active') continue;
        if (sit.deadlineAt && asDate(s.world.now) > asDate(sit.deadlineAt)) {
          sit.status = 'expired';
          s.journal.completedSituations.unshift({ at: s.world.now, title: sit.title, result: 'Expired without direct resolution.' });
          this.log('situation', `Situation expired: ${sit.title}.`, true);
        }
      }
    }

    compressHistoryIfNeeded() {
      const s = this.state;
      if (s.recentEvents.length < 40) return;
      const old = s.recentEvents.splice(0, 25);
      s.historicalSummaries.push({ through: old[old.length - 1].at, summary: `${old.length} lower-priority events were compressed. Important canonical facts, memories, promises, and active situations were retained.` });
      this.log('history', 'Older low-value events compressed.', true);
    }
  }

  function relationDescriptor(v) {
    if (v >= 80) return 'Very high';
    if (v >= 65) return 'High';
    if (v >= 45) return 'Moderate';
    if (v >= 25) return 'Low';
    return 'Very low';
  }

  function skillDescriptor(v) {
    if (v >= 75) return 'Strong';
    if (v >= 60) return 'Capable';
    if (v >= 45) return 'Average';
    if (v >= 30) return 'Limited';
    return 'Weak';
  }

  function publicNPCView(npc) {
    return {
      id: npc.id, name: npc.name, occupation: npc.occupation, relationship: npc.relationship.label,
      trust: relationDescriptor(npc.relationship.trust), generalTone: npc.relationship.resentment > 20 ? 'Tense' : npc.relationship.affection > 65 ? 'Warm' : 'Normal',
      lastMemory: npc.memories.filter(m => !m.secret).slice(-1)[0] || null,
    };
  }

  function runAcceptanceTests() {
    const report = [];
    const check = (name, fn) => {
      try { const detail = fn(); report.push({ name, pass: true, detail: detail || 'Passed' }); }
      catch (err) { report.push({ name, pass: false, detail: err.message || String(err) }); }
    };
    const assert = (cond, msg) => { if (!cond) throw new Error(msg); };
    const fixed = '2026-09-20T18:34:00';

    check('1 — Unsupported teleport is rejected', () => {
      const e = new SimulationEngine(createInitialState({ startTime: fixed, seed: 1 }));
      const r = e.perform('I teleport to Paris.');
      assert(r.results[0].ok === false, 'Teleport was not rejected.');
    });

    check('2 — Multi-action input resolves in sequence', () => {
      const e = new SimulationEngine(createInitialState({ startTime: fixed, seed: 2 }));
      e.perform("I text Maya that I'll be late, grab my jacket, and drive to Daniel's.");
      assert(e.state.messages.thread_maya.some(m => m.senderId === 'jonathan'), 'Text was not sent.');
      assert(e.state.player.inventory.includes('jacket'), 'Jacket was not grabbed.');
      assert(e.state.world.playerLocationId === 'daniel_home', 'Travel did not finish at Daniel’s.');
    });

    check('3 — Private NPC events do not leak into narration', () => {
      const s = createInitialState({ startTime: fixed, seed: 3 });
      s.scheduledEvents.push({ id: 'private_test', type: 'npc_private', title: 'Private test', triggerAt: addMinutesISO(fixed, 5), status: 'queued', visibility: 'hidden', npcId: 'maya', payload: { kind: 'work-frustration' } });
      const e = new SimulationEngine(s); const r = e.perform('wait 10 minutes');
      assert(e.state.npcs.maya.memories.some(m => m.private && /manager denied/i.test(m.event)), 'Private memory did not occur.');
      assert(!/manager denied/i.test(r.narrative), 'Private event leaked into player narration.');
    });

    check('4 — NPC false belief remains separate from bank truth', () => {
      const s = createInitialState({ startTime: fixed, seed: 4 });
      assert(s.player.money.checking === 2180, 'Objective balance is wrong.');
      assert(s.npcs.maya.beliefs.playerCheckingBalance.value === 4000, 'Maya belief missing.');
      assert(s.npcs.maya.beliefs.playerCheckingBalance.value !== s.player.money.checking, 'Belief was collapsed into truth.');
    });

    check('5 — Promise creates durable memory and future event', () => {
      const e = new SimulationEngine(createInitialState({ startTime: fixed, seed: 5 }));
      e.state.npcs.maya.current.locationId = 'home';
      e.perform("I promise Maya I'll help on Saturday.");
      assert(e.state.npcs.maya.memories.some(m => m.decay === 'none' && /promise/i.test(m.event)), 'Durable promise memory missing.');
      assert(e.state.scheduledEvents.some(ev => ev.type === 'promise_due' && ev.status === 'queued'), 'Promise event missing.');
    });

    check('6 — Sleeping through an appointment can miss it', () => {
      const s = createInitialState({ startTime: fixed, seed: 6 });
      s.scheduledEvents = [{ id: 'interview', type: 'appointment', title: 'Job interview', triggerAt: addMinutesISO(fixed, 60), deadlineAt: addMinutesISO(fixed, 90), locationId: 'coffee', requiresPresence: true, status: 'queued', visibility: 'known', consequence: 'appointment' }];
      const e = new SimulationEngine(s); e.perform('sleep for 3 hours');
      assert(e.state.scheduledEvents[0].status === 'missed', `Expected missed; got ${e.state.scheduledEvents[0].status}.`);
    });

    check('7 — Implausible persuasion is not auto-success', () => {
      const s = createInitialState({ startTime: fixed, seed: 7 });
      s.npcs.maya.current.locationId = 'home';
      const e = new SimulationEngine(s); const r = e.perform('I convince Maya that I was on the moon last night.');
      assert(r.results[0].outcome === 'disbelieved', 'Implausible claim was not rejected by social resolution.');
    });

    check('8 — NPC schedule advances off-screen', () => {
      const s = createInitialState({ startTime: '2026-09-21T17:30:00', seed: 8 });
      const e = new SimulationEngine(s); e.perform('wait 2 hours');
      assert(e.state.npcs.daniel.current.locationId === 'gym', `Daniel should be at gym; got ${e.state.npcs.daniel.current.locationId}.`);
    });

    check('9 — Full state survives JSON round-trip', () => {
      const e = new SimulationEngine(createInitialState({ startTime: fixed, seed: 9 }));
      e.perform('buy coffee for $6.25');
      const restored = JSON.parse(JSON.stringify(e.state));
      assert(restored.world.now === e.state.world.now, 'Time mismatch.');
      assert(restored.player.money.checking === e.state.player.money.checking, 'Money mismatch.');
      assert(restored.npcs.maya.beliefs.playerCheckingBalance.value === 4000, 'Belief missing.');
      assert(restored.scheduledEvents.length === e.state.scheduledEvents.length, 'Events mismatch.');
    });

    check('10 — Quiet waiting does not force drama', () => {
      const s = createInitialState({ startTime: '2026-09-20T21:00:00', seed: 10 });
      s.scheduledEvents = s.scheduledEvents.filter(ev => asDate(ev.triggerAt) > asDate(addMinutesISO(s.world.now, 240)));
      const e = new SimulationEngine(s); const r = e.perform('do nothing for 2 hours');
      assert(!/murder|threat|emergency|mysterious|kidnap|conspiracy/i.test(r.narrative), 'Forced drama appeared.');
    });

    check('11 — Text follow-up uses conversation context', () => {
      const e = new SimulationEngine(createInitialState({ startTime: fixed, seed: 11 }));
      const plan = e.composeReply(e.state.npcs.maya, 'Oh ya? What happened 😳', 'thread_maya', null, { intent: 'ask_explain', topic: 'work' });
      assert(/work|schedule|staff|late/i.test(plan.body), `Contextual reply was not about Maya's rough work week: ${plan.body}`);
      assert(!/^yeah,? that works/i.test(plan.body), 'Old generic fallback was used.');
    });

    check('12 — Dialogue can repair an incoherent previous reply', () => {
      const s = createInitialState({ startTime: fixed, seed: 12 });
      s.messages.thread_maya.push(
        { id: 'repair_user', at: addMinutesISO(fixed, 1), senderId: 'jonathan', recipientId: 'maya', body: 'Oh ya? What happened 😳', read: true },
        { id: 'repair_bad', at: addMinutesISO(fixed, 2), senderId: 'maya', recipientId: 'jonathan', body: 'Yeah, that works.', read: true },
        { id: 'repair_now', at: addMinutesISO(fixed, 3), senderId: 'jonathan', recipientId: 'maya', body: 'What works?', read: true }
      );
      const e = new SimulationEngine(s);
      const plan = e.composeReply(e.state.npcs.maya, 'What works?', 'thread_maya', 'repair_now', { intent: 'repair', topic: 'work' });
      assert(/sorry|made no sense|wasn't clear/i.test(plan.body), `Repair did not acknowledge the mismatch: ${plan.body}`);
      assert(/work|schedule/i.test(plan.body), `Repair did not restore the prior topic: ${plan.body}`);
    });

    check('13 — Unknown questions fail safely instead of inventing agreement', () => {
      const e = new SimulationEngine(createInitialState({ startTime: fixed, seed: 13 }));
      e.state.messages.thread_maya.push({ id: 'unknown_q', at: fixed, senderId: 'jonathan', recipientId: 'maya', body: 'Is that really what you want?', read: true });
      const plan = e.composeReply(e.state.npcs.maya, 'Is that really what you want?', 'thread_maya', 'unknown_q');
      assert(!/^yeah,? that works/i.test(plan.body), 'Generic agreement fallback returned.');
      assert(plan.body.length > 12, 'Fallback reply is too empty to be useful.');
    });

    return report;
  }

  return {
    SCHEMA_VERSION,
    DEFAULT_SAVE_KEY,
    createInitialState,
    SimulationEngine,
    LocalNarrativeProvider,
    ActionInterpreter,
    runAcceptanceTests,
    helpers: { nowISO, addMinutesISO, minutesBetween, formatMoney, relationDescriptor, skillDescriptor, publicNPCView, clone },
  };
});

</script>
<script>
(function () {
  'use strict';

  const Core = window.AISandboxEngine;
  const { createInitialState, SimulationEngine, LocalNarrativeProvider, runAcceptanceTests, helpers } = Core;
  const { formatMoney, relationDescriptor, skillDescriptor, publicNPCView } = helpers;

  class StateStore {
    constructor(key = Core.DEFAULT_SAVE_KEY) { this.key = key; }
    exists() { try { return Boolean(localStorage.getItem(this.key)); } catch (_) { return false; } }
    save(state) {
      try {
        localStorage.setItem(this.key, JSON.stringify(state));
        return { ok: true };
      } catch (err) { return { ok: false, error: err.message }; }
    }
    load() {
      try {
        const raw = localStorage.getItem(this.key);
        if (!raw) return null;
        const state = JSON.parse(raw);
        if (!state || state.schemaVersion !== Core.SCHEMA_VERSION) throw new Error('Save schema is not compatible with this build.');
        return state;
      } catch (err) { return { __loadError: err.message }; }
    }
    delete() { try { localStorage.removeItem(this.key); return true; } catch (_) { return false; } }
  }

  class SandboxApp {
    constructor(root) {
      this.root = root;
      this.store = new StateStore();
      this.engine = null;
      this.drawer = null;
      this.phoneTab = 'messages';
      this.phoneThread = null;
      this.debugTests = null;
      this.toastTimer = null;
      this.renderLanding();
    }

    esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    formatGameDate(iso) {
      const d = new Date(iso);
      const weekday = d.toLocaleDateString(undefined, { weekday: 'long' }).toUpperCase();
      const date = d.toLocaleDateString(undefined, { month: 'long', day: 'numeric' }).toUpperCase();
      const time = d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }).toUpperCase();
      return `${weekday} • ${date} • ${time}`;
    }

    shortDate(iso) {
      const d = new Date(iso);
      return d.toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }

    toast(text) {
      clearTimeout(this.toastTimer);
      let el = document.querySelector('.toast');
      if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
      el.textContent = text; el.classList.remove('hidden');
      this.toastTimer = setTimeout(() => el.classList.add('hidden'), 1800);
    }

    renderLanding() {
      const hasSave = this.store.exists();
      this.root.innerHTML = `
        <main class="landing">
          <section class="landing-card">
            <div class="eyebrow">Persistent simulation</div>
            <h1>AI SANDBOX</h1>
            <p>Realistic Life V1.1. Free-text first, persistent NPCs, contextual local dialogue, time, memory, beliefs, consequences, and local saves.</p>
            <div class="landing-actions">
              <button class="primary" id="newGameBtn">NEW GAME</button>
              <button class="secondary" id="continueBtn" ${hasSave ? '' : 'disabled'}>CONTINUE</button>
            </div>
            <div class="meta" style="margin-top:18px">Runs locally in this browser. No login, API key, or paid dependency.</div>
          </section>
        </main>`;
      document.getElementById('newGameBtn').addEventListener('click', () => this.newGame());
      document.getElementById('continueBtn').addEventListener('click', () => this.continueGame());
    }

    newGame() {
      this.engine = new SimulationEngine(createInitialState(), new LocalNarrativeProvider());
      this.persist('New game saved');
      this.renderGame();
    }

    continueGame() {
      const loaded = this.store.load();
      if (!loaded || loaded.__loadError) {
        this.toast(loaded && loaded.__loadError ? loaded.__loadError : 'No save found');
        return;
      }
      this.engine = new SimulationEngine(loaded, new LocalNarrativeProvider());
      this.renderGame();
    }

    persist(message) {
      if (!this.engine) return;
      const res = this.store.save(this.engine.state);
      if (message) this.toast(res.ok ? message : `Save failed: ${res.error}`);
      this.updateHeader();
    }

    renderGame() {
      this.root.innerHTML = `
        <div class="game-shell">
          <header class="topbar">
            <div class="time-block">
              <div class="game-time" id="gameTime"></div>
              <div class="game-location" id="gameLocation"></div>
            </div>
            <div class="top-actions">
              <span class="save-indicator" id="saveIndicator">Autosaved</span>
              <button class="icon-btn" id="debugBtn" aria-label="Developer debug panel" title="Debug">DEV</button>
            </div>
          </header>
          <main class="main-stage">
            <section class="scene-card" aria-live="polite">
              <div class="scene-label">Scene</div>
              <div class="scene-text" id="sceneText"></div>
            </section>
            <section class="suggestions-section">
              <div class="section-heading"><h2>Possible actions</h2><span>Suggestions, not limits</span></div>
              <div class="suggestions" id="suggestions"></div>
            </section>
          </main>
          <div class="composer-wrap">
            <textarea class="composer" id="composer" rows="1" placeholder="Do or say anything…" aria-label="Do or say anything"></textarea>
            <button class="do-btn" id="doBtn">DO</button>
          </div>
          <nav class="bottom-nav" aria-label="Game sections">
            <button class="nav-btn" data-tab="character">CHARACTER</button>
            <button class="nav-btn" data-tab="phone">PHONE</button>
            <button class="nav-btn" data-tab="map">MAP</button>
            <button class="nav-btn" data-tab="people">PEOPLE</button>
            <button class="nav-btn" data-tab="journal">JOURNAL</button>
          </nav>
        </div>
        <section class="drawer hidden" id="drawer" aria-modal="true">
          <div class="drawer-head"><h2 id="drawerTitle"></h2><button class="close-btn" id="drawerClose" aria-label="Close">✕</button></div>
          <div class="drawer-body" id="drawerBody"></div>
        </section>
        <section class="debug-panel hidden" id="debugPanel">
          <div class="debug-head"><h2>Developer / Debug</h2><button class="close-btn" id="debugClose">✕</button></div>
          <div class="debug-actions">
            <button class="secondary" id="debugSave">Save now</button>
            <button class="secondary" id="debugTests">Run acceptance tests</button>

      document.getElementById('doBtn').addEventListener('click', () => this.submitComposer());

      });

      document.getElementById('debugClose').addEventListener('click', () => this.closeDebug());
