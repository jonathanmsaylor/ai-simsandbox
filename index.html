<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0c1016" />
<title>AI Sandbox — Realistic Life V1.3</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0c1016;
  --panel: #121925;
  --panel-2: #182131;
  --panel-3: #202c3e;
  --text: #eef3f8;
  --muted: #9aa8b8;
  --line: rgba(255,255,255,.10);
  --accent: #79a8ff;
  --accent-2: #9ec2ff;
  --good: #79d69f;
  --warn: #ffc66d;
  --bad: #ff8a8a;
  --shadow: 0 20px 60px rgba(0,0,0,.35);
  --radius: 18px;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
body { min-height: 100dvh; }
button, textarea, input { font: inherit; }
button { color: inherit; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.hidden { display: none !important; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

#app { min-height: 100dvh; }

.landing {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 24px;
  background: radial-gradient(circle at 50% 0%, rgba(121,168,255,.13), transparent 42%), var(--bg);
}
.landing-card {
  width: min(520px, 100%);
  border: 1px solid var(--line);
  background: rgba(18,25,37,.94);
  border-radius: 28px;
  padding: clamp(28px, 7vw, 48px);
  box-shadow: var(--shadow);
}
.eyebrow { color: var(--accent-2); text-transform: uppercase; letter-spacing: .14em; font-size: 12px; font-weight: 800; }
.landing h1 { margin: 10px 0 8px; font-size: clamp(36px, 11vw, 62px); line-height: .95; letter-spacing: -.04em; }
.landing p { color: var(--muted); line-height: 1.55; margin: 0 0 28px; }
.landing-actions { display: grid; gap: 12px; }
.primary, .secondary, .danger, .ghost {
  border: 1px solid transparent;
  border-radius: 14px;
  min-height: 48px;
  padding: 12px 16px;
  font-weight: 750;
  cursor: pointer;
}
.primary { background: var(--accent); color: #07101d; }
.secondary { background: var(--panel-3); border-color: var(--line); }
.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
.danger { background: rgba(255,138,138,.10); color: #ffb7b7; border-color: rgba(255,138,138,.3); }
button:disabled { opacity: .38; cursor: default; }

.game-shell {
  width: min(980px, 100%);
  margin: 0 auto;
  min-height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  background: var(--bg);
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  background: rgba(12,16,22,.92);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.time-block { min-width: 0; }
.game-time { font-weight: 850; letter-spacing: .035em; font-size: 13px; text-transform: uppercase; }
.game-location { color: var(--muted); margin-top: 4px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.save-indicator { font-size: 11px; color: var(--good); white-space: nowrap; }
.icon-btn { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }

.main-stage { padding: 18px 16px 130px; }
.scene-card {
  border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(24,33,49,.92), rgba(18,25,37,.92));
  border-radius: var(--radius);
  padding: clamp(20px, 5vw, 34px);
  min-height: 270px;
  box-shadow: 0 12px 40px rgba(0,0,0,.22);
}
.scene-label { color: var(--muted); text-transform: uppercase; letter-spacing: .14em; font-size: 11px; font-weight: 800; margin-bottom: 18px; }
.scene-text { font-size: clamp(18px, 3.4vw, 23px); line-height: 1.6; white-space: pre-line; letter-spacing: -.01em; }

.suggestions-section { margin-top: 18px; }
.section-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.section-heading h2 { margin: 0; font-size: 14px; }
.section-heading span { color: var(--muted); font-size: 12px; }
.suggestions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
.suggestion {
  text-align: left;
  min-height: 66px;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 14px;
  padding: 11px 12px;
  cursor: pointer;
}
.suggestion:hover { background: var(--panel-2); }
.suggestion .cat { display: block; color: var(--accent-2); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; font-weight: 850; margin-bottom: 5px; }
.suggestion .txt { display: block; line-height: 1.3; font-size: 14px; }

.composer-wrap {
  position: fixed;
  z-index: 25;
  left: 50%;
  bottom: 64px;
  transform: translateX(-50%);
  width: min(948px, calc(100% - 24px));
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: rgba(18,25,37,.96);
  box-shadow: 0 18px 50px rgba(0,0,0,.42);
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.composer {
  width: 100%;
  min-height: 46px;
  max-height: 140px;
  resize: vertical;
  border: 0;
  background: transparent;
  color: var(--text);
  padding: 12px;
  line-height: 1.35;
}
.composer::placeholder { color: #718094; }
.do-btn { min-width: 74px; min-height: 46px; padding: 10px 16px; border: 0; border-radius: 12px; background: var(--accent); color: #07101d; font-weight: 900; cursor: pointer; }

.bottom-nav {
  position: fixed;
  z-index: 24;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: min(980px, 100%);
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  background: rgba(12,16,22,.97);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(14px);
}
.nav-btn { min-height: 58px; border: 0; background: transparent; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .04em; cursor: pointer; }
.nav-btn.active { color: var(--text); background: rgba(121,168,255,.08); }

.drawer {
  position: fixed;
  z-index: 40;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: min(980px, 100%);
  max-height: min(78dvh, 760px);
  background: #101722;
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 24px 24px 0 0;
  box-shadow: 0 -18px 70px rgba(0,0,0,.55);
  overflow: hidden;
  display: grid;
  grid-template-rows: auto 1fr;
}
.drawer-head { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
.drawer-head h2 { margin: 0; font-size: 18px; }
.drawer-body { overflow-y: auto; padding: 16px; }
.close-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; width: 40px; height: 40px; cursor: pointer; }

.cards { display: grid; gap: 10px; }
.card { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 14px; }
.card h3 { margin: 0 0 5px; font-size: 16px; }
.card p { color: var(--muted); margin: 6px 0 0; line-height: 1.45; }
.meta { color: var(--muted); font-size: 12px; }
.row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.stack { display: grid; gap: 10px; }
.pill { display: inline-flex; align-items: center; min-height: 26px; padding: 4px 9px; border-radius: 999px; background: var(--panel-3); color: var(--muted); font-size: 11px; font-weight: 700; }
.money { font-variant-numeric: tabular-nums; font-weight: 850; }
.divider { height: 1px; background: var(--line); margin: 14px 0; }

.subtabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; }
.subtab { white-space: nowrap; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 999px; padding: 9px 12px; cursor: pointer; font-size: 12px; }
.subtab.active { color: var(--text); border-color: rgba(121,168,255,.45); background: rgba(121,168,255,.10); }

.thread-list { display: grid; gap: 8px; }
.thread { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 12px; cursor: pointer; }
.thread.unread { border-color: rgba(121,168,255,.52); }
.thread-preview { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; margin-top: 4px; }
.message-list { display: grid; gap: 8px; margin: 12px 0; }
.bubble { width: fit-content; max-width: 84%; padding: 10px 12px; border-radius: 14px; line-height: 1.4; font-size: 14px; }
.bubble.in { background: var(--panel-3); }
.bubble.out { background: rgba(121,168,255,.20); margin-left: auto; }
.bubble-time { display: block; color: var(--muted); font-size: 10px; margin-top: 5px; }
.inline-compose { display: flex; gap: 8px; position: sticky; bottom: 0; background: #101722; padding-top: 8px; }
.inline-compose input { flex: 1; min-width: 0; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 10px 12px; }
.inline-compose button { border: 0; border-radius: 12px; background: var(--accent); color: #07101d; font-weight: 800; padding: 0 14px; }

.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--panel); }
.stat strong { display: block; margin-top: 3px; }
.skill-groups { display: grid; gap: 14px; }
.skill-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.skill-row:last-child { border-bottom: 0; }

.event-status { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.event-status.missed { color: var(--bad); }
.event-status.attended, .event-status.completed { color: var(--good); }
.event-status.queued, .event-status.started { color: var(--warn); }

.debug-panel {
  position: fixed;
  z-index: 60;
  inset: 0;
  background: rgba(5,8,12,.98);
  display: grid;
  grid-template-rows: auto auto 1fr;
}
.debug-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.debug-head h2 { margin: 0; }
.debug-actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.debug-content { overflow: auto; padding: 16px; }
.debug-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin-bottom: 16px; }
.debug-pre { background: #070a0f; border: 1px solid var(--line); border-radius: 12px; padding: 12px; overflow: auto; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
.test-pass { color: var(--good); }
.test-fail { color: var(--bad); }
.feedback-strip { margin-top: 12px; display:flex; flex-wrap:wrap; gap:7px; min-height: 0; }
.feedback-chip { border:1px solid var(--line); background:rgba(121,168,255,.08); color:var(--text); border-radius:999px; padding:7px 10px; font-size:11px; line-height:1.2; }
.feedback-chip.warn { background:rgba(255,198,109,.08); }
.status-strip { display:flex; flex-wrap:wrap; gap:6px; margin: 0 0 12px; }
.status-chip { border:1px solid var(--line); background:var(--panel); color:var(--muted); border-radius:999px; padding:6px 9px; font-size:11px; }
.recent-entry { border-left:3px solid rgba(121,168,255,.35); }
.recent-entry .recent-kind { text-transform:uppercase; letter-spacing:.08em; font-size:10px; color:var(--accent-2); font-weight:800; }
.payroll-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:10px; }
.alert-banner { border:1px solid rgba(255,198,109,.35); background:rgba(255,198,109,.09); border-radius:14px; padding:12px 14px; margin-bottom:12px; display:flex; gap:10px; align-items:flex-start; justify-content:space-between; }
.alert-banner strong { display:block; margin-bottom:3px; }
.alert-banner button { border:1px solid var(--line); background:transparent; border-radius:9px; color:var(--muted); min-width:34px; height:34px; }


.toast { position: fixed; z-index: 80; left: 50%; top: 18px; transform: translateX(-50%); background: #202c3e; border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 999px; padding: 10px 14px; font-size: 12px; }

@media (max-width: 620px) {
  .suggestions { grid-template-columns: 1fr; }
  .main-stage { padding-left: 12px; padding-right: 12px; padding-bottom: 132px; }
  .scene-card { min-height: 230px; }
  .scene-text { font-size: 18px; }
  .save-indicator { display: none; }
  .composer-wrap { width: calc(100% - 16px); bottom: 61px; }
  .do-btn { min-width: 62px; }
  .nav-btn { font-size: 9px; }
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .drawer { max-height: 82dvh; }
}

@media (min-width: 780px) {
  .main-stage { padding-top: 26px; }
  .suggestions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

</style>

  class ActionInterpreter {
    interpret(raw, state) {
      const text = String(raw || '').trim();
      if (!text) return [];
      const normalized = text.replace(/[’]/g, "'");

      // A phone text is one action even when the message itself contains commas,
      // "then", or "and then". Splitting those phrases here used to truncate
      // messages entered through the Phone UI.
      if (/^(?:text|message)\b/i.test(normalized)) {
        return [this.classify(normalized, state)];
      }

      const clauses = normalized
        .split(/\s*,\s*|\s+and then\s+|\s+then\s+/i)
        .map(s => s.trim().replace(/^and\s+/i, ''))
        .filter(Boolean);
      return clauses.map(clause => this.classify(clause, state));
    }

    classify(clause, state) {
      const lower = clause.toLowerCase();
      if (/\bteleport\b|\bmateriali[sz]e\b|\bwarp\b/.test(lower)) return { type: 'impossible', raw: clause, reason: 'That action is not physically possible in this realistic world.' };
      if (/\b(fly|levitate)\b/.test(lower) && !/flight|plane|airport/.test(lower)) return { type: 'impossible', raw: clause, reason: 'Jonathan cannot literally fly or levitate.' };
      if (/\btext\b|\bmessage\b|\bsend .* message\b/.test(lower)) return this.parseText(clause, state);
      if (/\bcall\b/.test(lower)) return this.parseCall(clause, state);
      if (/\bdrive\b|\bhead to\b|\bgo to\b|\bwalk to\b/.test(lower)) return this.parseTravel(clause, state);
      if (/\bgrab\b|\bpick up\b|\btake my\b/.test(lower)) return this.parseGrab(clause);
      if (/\b(shower)\b/.test(lower)) return { type: /turn .*shower.*on/.test(lower) ? 'toggle_shower' : 'shower', raw: clause };
      if (/\bsleep\b|\bgo to bed\b|\bnap\b/.test(lower)) return this.parseSleep(clause, state);
      if (/\bwait\b|\bdo nothing\b|\bpass the time\b/.test(lower)) return this.parseWait(clause);
      if (/\bbuy\b|\bpay\b|\bspend\b/.test(lower)) return this.parsePurchase(clause);
      if (/\beat\b|\bcook\b|\bmake .* (food|dinner|lunch|breakfast|sandwich|meal)\b/.test(lower)) return { type: 'eat', raw: clause };
      if (/work through.*lunch|work.*until lunch|until lunch/.test(lower)) return { type:'work', raw:clause, mode:'until_lunch' };
      if (/finish (?:the )?shift|work.*until.*(?:5|five)/.test(lower)) return { type:'work', raw:clause, mode:'finish_shift' };
      if (/take (?:my )?lunch|lunch break|go to lunch/.test(lower)) return { type:'work_lunch', raw:clause };
      if (/appointment confirmation|confirm appointments?/.test(lower)) return { type:'work_task', raw:clause, taskId:'confirmations' };
      if (/insurance verification|verify insurance/.test(lower)) return { type:'work_task', raw:clause, taskId:'insurance' };
      if (/voicemail|return .*call/.test(lower)) return { type:'work_task', raw:clause, taskId:'voicemail' };
      if (/waiting room/.test(lower) && !/observe|look|check/.test(lower)) return { type:'work_task', raw:clause, taskId:'waiting' };
      if (/\bwork\b|\bstart working\b/.test(lower)) return { type: 'work', raw: clause, mode:'auto', minutes: this.parseDuration(clause) || null };
      if (/\bpromise\b/.test(lower)) return this.parsePromise(clause, state);

    parsePurchase(clause) {

    }

    parseTalk(clause, state) {
      const npc = this.findNPC(clause, state);

    todaysWorkShift() {

    }

    ensureWorkplaceTasks() {

        {id:'insurance',label:'Insurance verification',remaining:1+(seed%2),minutesEach:14},
        {id:'voicemail',label:'Patient voicemail',remaining:1+(seed%3===0?1:0),minutesEach:8},

    workTaskSummary() {

    }

    recordWorkMinutes(minutes, shift, description='Work shift') {
      const s=this.state, payroll=s.player.employment.payroll; const mins=Math.max(0,Math.round(minutes)); if(!mins) return {minutes:0,gross:0};
      const gross=Math.round((mins/60)*s.player.employment.hourlyRate*100)/100; const payDate=payDateForWorkDate(s.world.now);
      const entry={id:makeId('pay',s),workDate:dateKey(s.world.now),minutes:mins,gross,description,payDate,status:'pending'}; payroll.pendingEntries.push(entry);
      if(shift){ shift.workedMinutes=(shift.workedMinutes||0)+mins; shift.grossEarned=Math.round(((shift.grossEarned||0)+gross)*100)/100; }

      this.addActivity('work', `${mins} paid minutes worked · ${formatMoney(gross)} added to pending payroll.`);
      return {minutes:mins,gross};
    }

    processPayrollEvent(event) {
      const s=this.state, payroll=s.player.employment.payroll; const key=dateKey(event.triggerAt);
      const entries=payroll.pendingEntries.filter(x=>x.status==='pending' && dateKey(x.payDate)===key);
      if(!entries.length){ event.status='completed'; return null; }
      const minutes=entries.reduce((a,x)=>a+x.minutes,0), gross=Math.round(entries.reduce((a,x)=>a+x.gross,0)*100)/100;

    maybeScheduleDealerCheckIn() {

    }

    discoverSituation(id, source, knownInformation = []) {
      const s=this.state; const sit=(s.activeSituations||[]).find(x=>x.id===id); if(!sit) return null;
      const wasKnown=sit.playerKnows!==false;

      if(!wasKnown){ this.feedback(`${sit.title} discovered`); this.addActivity('situation',`${sit.title} discovered.`,{importance:'high'}); }

    }

    setCalendarReminder(eventId, minutes) {
      const e=(this.state.scheduledEvents||[]).find(x=>x.id===eventId && x.visibility==='known'); if(!e) return false;
      const allowed=[null,0,15,60,1440]; const value=minutes==null?null:Number(minutes); if(!allowed.includes(value)) return false;
      e.reminderMinutes=value; e.reminderLastTriggeredFor=null;
      const label=value==null?'Off':value===0?'At event time':value===15?'15 minutes before':value===60?'1 hour before':'1 day before';
      this.feedback(`Calendar reminder ${label.toLowerCase()}`); this.addActivity('calendar',`Reminder for ${e.title}: ${label}.`); return true;
    }

    processCalendarReminders(from,to,visible) {

    applyNPCSocialResult(npcId, social, source='conversation') {

    validateAction(action) {

    perform(raw) {

    resolveAction(action) {

        case 'shower': s.player.condition.stress = Math.max(0, s.player.condition.stress - 4); return { ok: true, type: action.type, minutes: 15, narrative: 'You take a shower and get dressed again.' };
        case 'sleep': return this.resolveSleep(action);

        case 'purchase': return this.resolvePurchase(action);
        case 'cannabis_purchase': return this.resolveCannabisPurchase(action);
        case 'work_lunch': return this.resolveWorkLunch(action);
        case 'work_task': return this.resolveWorkTask(action);
        case 'eat': s.player.condition.hunger = Math.max(5, s.player.condition.hunger - 42); return { ok: true, type: action.type, minutes: 25, narrative: 'You make something simple to eat and finish the meal.' };

        case 'talk': return this.resolveTalk(action);

    resolveText(action) {
      const s = this.state; const npc = s.npcs[action.npcId]; const thread = npc.phone.threadId;
      s.messages[thread] = s.messages[thread] || [];
      const analysis = this.analyzePlayerMessage(npc, action.body, thread);
      const msg = {
        id: makeId('msg', s), at: s.world.now, senderId: 'jonathan', recipientId: npc.id,
        body: action.body, read: true, topic: analysis.topic, intent: analysis.intent,
      };
      s.messages[thread].push(msg);
      this.updateDialogueThread(thread, { topic: analysis.topic, lastPlayerIntent: analysis.intent, lastPlayerMessageId: msg.id });
      this.log('message', `Message sent to ${npc.name}. Topic=${analysis.topic}; intent=${analysis.intent}.`);

      const replyPlan = this.composeReply(npc, action.body, thread, msg.id, analysis);
      const delay = this.replyDelayMinutes(npc, analysis);
      const replyEventId = makeId('evt', s);

        id: replyEventId, type: 'message_response', title: `${npc.name} reply`,
        triggerAt: addMinutesISO(s.world.now, delay), deadlineAt: null, status: 'queued', visibility: 'hidden', npcId: npc.id,
        payload: {

        ok: true, type: action.type, minutes: 1, narrative: `You text ${npc.name}: “${action.body}”`,

    localTextSocialOutcome(npc, body) {

      const out={meaningful:false,intent:'neutral',perceived_as_flirting:false,flirt_reception:'none',relationship_effects:{trust:0,affection:0,respect:0,attraction:0,fear:0,resentment:0},visible_feedback:'',memory:{create:false,event:'',emotional_valence:0,emotional_strength:0,importance:0}};
      const flirt=/\b(date|cute|hot|handsome|beautiful|sexy|kiss|flirt|crush|miss you|want you)\b|[😉😘😍]/i.test(body) || /excuse to see you/i.test(lower);
      if(flirt){
        out.meaningful=true; out.intent='flirt'; out.perceived_as_flirting=true;
        const receptive=(npc.relationship.attraction||0)>=15 || (npc.relationship.affection||0)>=55;
        const negative=(npc.relationship.resentment||0)>=30 || (npc.relationship.fear||0)>=20;
        out.flirt_reception=negative?'negative':receptive?'positive':'neutral';
        if(negative){out.relationship_effects.attraction=-1;out.relationship_effects.respect=-1;out.relationship_effects.resentment=2;out.visible_feedback=`${npc.name} seemed uncomfortable with the tone.`;}
        else if(receptive){out.relationship_effects.attraction=2;out.relationship_effects.affection=1;out.visible_feedback=`${npc.name} seemed receptive to the flirting.`;}
        else {out.relationship_effects.attraction=1;out.visible_feedback=`${npc.name} seemed to notice the flirtatious tone.`;}
        out.memory={create:true,event:`Jonathan sent ${npc.name} a flirtatious message; ${npc.name} received it ${out.flirt_reception}ly.`,emotional_valence:negative?-0.3:receptive?0.3:0.05,emotional_strength:0.3,importance:0.4};
        return out;
      }
      if(/\b(sorry|apologize|apology)\b/i.test(body)){out.meaningful=true;out.intent='apology';out.relationship_effects.trust=1;out.relationship_effects.affection=1;out.visible_feedback=`${npc.name} seemed to appreciate the apology.`;out.memory={create:true,event:`Jonathan apologized to ${npc.name} over text.`,emotional_valence:0.2,emotional_strength:0.2,importance:0.3};return out;}
      if(/\b(thank you|thanks|appreciate you|i'm here for you|im here for you|you can talk to me)\b/i.test(body)){out.meaningful=true;out.intent='support';out.relationship_effects.trust=1;out.relationship_effects.affection=1;out.visible_feedback=`${npc.name} seemed a little warmer after that.`;return out;}
      if(/\b(idiot|stupid|shut up|hate you|fuck you)\b/i.test(body)){out.meaningful=true;out.intent='insult';out.relationship_effects.respect=-2;out.relationship_effects.resentment=2;out.visible_feedback=`${npc.name} seemed put off by that.`;out.memory={create:true,event:`Jonathan insulted ${npc.name} over text.`,emotional_valence:-0.4,emotional_strength:0.35,importance:0.4};return out;}

    normalizeDialogueText(text) {
      return String(text || '')
        .toLowerCase()
        .replace(/[’]/g, "'")
        .replace(/[^a-z0-9'?!$%\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    updateDialogueThread(threadId, patch) {
      const s = this.state;
      s.dialogue = s.dialogue || { version: 2, threads: {} };
      s.dialogue.threads = s.dialogue.threads || {};
      const current = s.dialogue.threads[threadId] || { topic: 'general', turns: 0 };
      s.dialogue.threads[threadId] = { ...current, ...patch, turns: (current.turns || 0) + 1, updatedAt: s.world.now };
      return s.dialogue.threads[threadId];
    }

    dialogueContext(npc, threadId, respondingToId = null) {
      const all = (this.state.messages[threadId] || []);
      let end = all.length;
      if (respondingToId) {
        const idx = all.findIndex(m => m.id === respondingToId);
        if (idx >= 0) end = idx + 1;
      }
      const messages = all.slice(Math.max(0, end - 10), end);
      const current = messages[messages.length - 1] || null;
      const beforeCurrent = messages.slice(0, -1);
      const lastNpc = [...beforeCurrent].reverse().find(m => m.senderId === npc.id) || null;
      const lastPlayer = [...beforeCurrent].reverse().find(m => m.senderId === 'jonathan') || null;
      const lastNpcBeforeLastPlayer = lastPlayer
        ? [...beforeCurrent.slice(0, beforeCurrent.lastIndexOf(lastPlayer))].reverse().find(m => m.senderId === npc.id) || null
        : null;
      const threadState = (this.state.dialogue && this.state.dialogue.threads && this.state.dialogue.threads[threadId]) || {};
      return { messages, current, lastNpc, lastPlayer, lastNpcBeforeLastPlayer, threadState };
    }

    inferDialogueTopic(text, npc, context = null) {
      const lower = this.normalizeDialogueText(text);
      if (/\b(work|job|boss|manager|office|shift|schedule|coworker|week was|this week)\b/.test(lower)) return 'work';
      if (/\b(money|bank|balance|rent|pay|paid|cost|cash|dollar|\$)\b/.test(lower)) return 'money';
      if (/\b(home|apartment|house|where are you|where you at|location)\b/.test(lower)) return 'location';
      if (/\b(gym|workout|exercise|basketball)\b/.test(lower)) return 'fitness';
      if (/\b(dinner|eat|food|coffee|breakfast|lunch)\b/.test(lower)) return 'food';
      if (/\b(saturday|sunday|monday|tuesday|wednesday|thursday|friday|tomorrow|tonight|later|when|time|plan|plans|free)\b/.test(lower)) return 'plans';
      if (/\b(tired|okay|good|bad|feel|feeling|night|day|doing|how are you|how r you)\b/.test(lower)) return 'wellbeing';
      if (/\b(car|squeak|mechanic|oil)\b/.test(lower)) return 'car';
      if (context && context.lastNpc) {
        const inherited = context.lastNpc.topic || this.inferDialogueTopic(context.lastNpc.body, npc, null);
        if (inherited && inherited !== 'general') return inherited;
      }
      if (context && context.threadState && context.threadState.topic) return context.threadState.topic;
      if (npc.id === 'maya' && npc.plans && (npc.plans.unresolvedProblems || []).some(x => /work|schedule|manager/i.test(x))) return 'work';
      return 'general';
    }

    inferDialogueIntent(text, context = null) {
      const lower = this.normalizeDialogueText(text);
      if (/\bwhat works\b|\bwhat do you mean\b|\bwhat did you mean\b|\bthat makes no sense\b|\bi'm confused\b|\bim confused\b|^huh\??$/.test(lower)) return 'repair';
      if (/\bwhat happened\b|\bwhat's happened\b|\bwhat was ridiculous\b|\bwhy\b|\bhow come\b|\btell me more\b|\bwhat went on\b/.test(lower)) return 'ask_explain';
      if (/\bhow are you\b|\bhow r you\b|\byou okay\b|\bare you okay\b|\bhow you doing\b|\bhow's your night\b|\bhow is your night\b/.test(lower)) return 'ask_wellbeing';
      if (/\bwhat are you doing\b|\bwhat're you doing\b|\bwhat you doing\b|\bwyd\b/.test(lower)) return 'ask_activity';
      if (/\bwhere are you\b|\bwhere you at\b/.test(lower)) return 'ask_location';
      if (/\bwhich shift\b|\bwhat shift\b|\bwhen is it\b|\bwhat day\b|\bwhat time\b/.test(lower)) return 'ask_schedule_detail';
      if (/\bcan you\b|\bcould you\b|\bwould you\b|\bdo you want\b|\bwanna\b|\bwant to\b/.test(lower) && /\?/.test(lower)) return 'request';
      if (/\bthank|thanks|appreciate\b/.test(lower)) return 'thanks';
      if (/\bsorry|my bad\b/.test(lower)) return 'apology';
      if (/^(hey|hi|hello|yo)\b/.test(lower)) return 'greeting';
      if (/\?$/.test(lower) || /^(what|why|how|when|where|who|is|are|do|did|can|could|would)\b/.test(lower)) return 'question';
      if (/\b(ok|okay|sure|sounds good|got it|alright|yeah|yep|yes)\b/.test(lower) && lower.length < 35) return 'acknowledge';
      if (/\b(no|nah|can't|cannot|wont|won't|don't want)\b/.test(lower) && lower.length < 50) return 'decline';
      if (context && context.lastNpc && /\?/.test(context.lastNpc.body || '')) return 'answer';
      return 'statement';
    }

    analyzePlayerMessage(npc, body, threadId) {
      const context = this.dialogueContext(npc, threadId);
      const intent = this.inferDialogueIntent(body, context);
      const topic = this.inferDialogueTopic(body, npc, context);
      return { intent, topic };
    }

    replyDelayMinutes(npc, analysis) {
      const s = this.state;
      let base = 2 + Math.floor(seededRandom(s) * 10);
      if (npc.current.activity === 'working') base += 8 + Math.floor(seededRandom(s) * 18);
      if (analysis.intent === 'repair' || analysis.intent === 'ask_explain') base = Math.max(2, base - 2);
      return base;
    }

    chooseReply(options) {
      if (!options || !options.length) return '';
      const i = Math.floor(seededRandom(this.state) * options.length);
      return options[Math.max(0, Math.min(options.length - 1, i))];
    }

    contextualFallback(npc, topic, intent, context) {
      const lastNpcText = context.lastNpc ? this.normalizeDialogueText(context.lastNpc.body) : '';
      if (intent === 'question') {
        if (topic === 'work') return npc.id === 'maya'
          ? 'Mostly work stuff. The schedule has been a mess lately. What part did you mean?'
          : npc.id === 'daniel' ? 'If you mean work, it’s been pretty routine. What were you asking about exactly?' : 'If you mean work, things are moving along. What part are you asking about?';
        if (topic === 'plans') return 'I’m not totally sure what you mean. Are you asking what I’m doing later or about a specific plan?';
        if (topic === 'wellbeing') return `I’m ${npc.current.mood || 'okay'} right now. What did you want to know?`;
        if (lastNpcText) return `I might be missing what you mean. Are you asking about what I just said?`;
        return 'I’m not totally sure what you mean. Can you say it another way?';
      }
      if (intent === 'statement') {
        if (topic === 'work') return npc.id === 'maya' ? 'Yeah. Work has been taking more out of me than usual lately.' : 'Yeah, I get you. Work has been pretty normal on my end.';
        if (topic === 'plans') return 'Got it. Keep me posted once you know what you want to do.';
        return npc.id === 'dad' ? 'Got it. Keep me posted.' : 'Yeah, I get what you mean.';
      }
      return 'I might be missing the context. Say that one more way?';
    }

    repairReply(npc, context) {
      const lastNpc = context.lastNpc;
      const priorPlayer = context.lastPlayer;
      const priorNpc = context.lastNpcBeforeLastPlayer;
      const genericAck = lastNpc && /^(yeah,? that works\.?|sounds good\.?|okay\.?|got it\.?)$/i.test((lastNpc.body || '').trim());
      if (genericAck && priorPlayer) {
        const priorIntent = this.inferDialogueIntent(priorPlayer.body, { lastNpc: priorNpc, threadState: context.threadState });
        const priorTopic = this.inferDialogueTopic(priorPlayer.body, npc, { lastNpc: priorNpc, threadState: context.threadState });
        if (priorIntent === 'ask_explain' && npc.id === 'maya' && priorTopic === 'work') {
          return 'Sorry, that reply made no sense. I meant work was ridiculous. My schedule kept getting moved around and we were short-staffed, so I got stuck staying late a couple times. Nothing dramatic, just exhausting.';
        }
        if (priorTopic === 'plans') return 'Sorry, I answered that badly. I meant the plan we were talking about. Tell me which part you were asking about.';
        return `Sorry, that reply didn't match what you asked. I was responding to your last message, not saying that something specific “works.”`;
      }
      return `Sorry, I wasn't clear. Tell me which part you want me to explain and I'll answer that directly.`;
    }

    composeReply(npc, body, threadId, respondingToId = null, analysis = null) {
      const context = this.dialogueContext(npc, threadId, respondingToId);
      const intent = analysis ? analysis.intent : this.inferDialogueIntent(body, context);
      const topic = analysis ? analysis.topic : this.inferDialogueTopic(body, npc, context);
      const lower = this.normalizeDialogueText(body);
      let reply = '';
      let memoryEvent = null;

      if (intent === 'repair') {
        reply = this.repairReply(npc, context);
      } else if (intent === 'ask_explain') {
        if (npc.id === 'maya' && topic === 'work') {
          reply = this.chooseReply([
            'Mostly work. My schedule kept getting changed around and we were short-staffed, so I ended up staying late a couple times. Nothing huge happened, it was just one annoying thing after another.',
            'Work, mainly. The schedule was all over the place and we were short a person more than once. I kept thinking I was done and then something else came up.',
            'Honestly, mostly work. Too many last-minute schedule changes, not enough people, and a couple late days. By the end of the week I was completely over it.'
          ]);
          memoryEvent = 'Maya told Jonathan that her rough week was mainly caused by schedule changes, short staffing, and staying late.';
        } else if (npc.id === 'daniel' && topic === 'work') {
          reply = 'Nothing dramatic. Work has just been busy and I’m trying to sort out one of my upcoming shifts.';
        } else if (topic === 'wellbeing') {
          reply = `Nothing major. I’m just ${npc.current.mood || 'a little worn out'} and trying to have a quiet night.`;
        } else {
          reply = this.contextualFallback(npc, topic, 'question', context);
        }
      } else if (intent === 'ask_wellbeing') {
        if (npc.id === 'maya') reply = 'I’m okay. Just tired and kind of done with work for the week. I’m home now, so I’m trying to shut my brain off.';
        else if (npc.id === 'daniel') reply = `I’m good. Pretty normal night. ${npc.current.activity === 'working out' ? 'I’m at the gym right now.' : 'Just figuring out what I want to do later.'}`;
        else reply = 'I’m good. Just taking care of a few things around the house.';
      } else if (intent === 'ask_activity') {
        const activity = npc.current.activity || 'taking it easy';
        if (npc.id === 'maya' && activity === 'at home') reply = 'I’m home. Mostly sitting around and trying to decompress.';
        else if (npc.id === 'daniel' && activity === 'at home') reply = 'At home right now. Debating whether I actually feel like going out again.';
        else if (npc.id === 'dad' && activity === 'at home') reply = 'At home. I’m finishing a couple things and then I’m done for the night.';
        else reply = `I’m ${activity} right now.`;
      } else if (intent === 'ask_location') {
        const loc = this.state.locations[npc.current.locationId];
        reply = loc ? `I’m at ${loc.name} right now.` : 'I’m out right now, but nothing unusual.';
      } else if (intent === 'ask_schedule_detail' || /\bshift\b/.test(lower)) {
        if (npc.id === 'daniel') reply = 'I meant the later upcoming shift. I’m still trying to pin down whether I actually need to swap it, so I don’t want to give you the wrong day yet.';
        else if (npc.id === 'maya') reply = 'My schedule has been changing enough that I’m not counting on anything until it’s actually posted.';
        else reply = 'I’ll check the exact time before I tell you so I don’t give you the wrong one.';
      } else if (/\blate\b/.test(lower)) {
