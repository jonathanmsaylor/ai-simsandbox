<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0c1016" />
<title>AI Sandbox — Realistic Life V1.4</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0c1016;
  --panel: #121925;
  --panel-2: #182131;
  --panel-3: #202c3e;
  --text: #eef3f8;
  --muted: #9aa8b8;
  --line: rgba(255,255,255,.10);
  --accent: #79a8ff;
  --accent-2: #9ec2ff;
  --good: #79d69f;
  --warn: #ffc66d;
  --bad: #ff8a8a;
  --shadow: 0 20px 60px rgba(0,0,0,.35);
  --radius: 18px;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
body { min-height: 100dvh; }
button, textarea, input { font: inherit; }
button { color: inherit; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.hidden { display: none !important; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

#app { min-height: 100dvh; }

.landing {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 24px;
  background: radial-gradient(circle at 50% 0%, rgba(121,168,255,.13), transparent 42%), var(--bg);
}
.landing-card {
  width: min(520px, 100%);
  border: 1px solid var(--line);
  background: rgba(18,25,37,.94);
  border-radius: 28px;
  padding: clamp(28px, 7vw, 48px);
  box-shadow: var(--shadow);
}
.eyebrow { color: var(--accent-2); text-transform: uppercase; letter-spacing: .14em; font-size: 12px; font-weight: 800; }
.landing h1 { margin: 10px 0 8px; font-size: clamp(36px, 11vw, 62px); line-height: .95; letter-spacing: -.04em; }
.landing p { color: var(--muted); line-height: 1.55; margin: 0 0 28px; }
.landing-actions { display: grid; gap: 12px; }
.primary, .secondary, .danger, .ghost {
  border: 1px solid transparent;
  border-radius: 14px;
  min-height: 48px;
  padding: 12px 16px;
  font-weight: 750;
  cursor: pointer;
}
.primary { background: var(--accent); color: #07101d; }
.secondary { background: var(--panel-3); border-color: var(--line); }
.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
.danger { background: rgba(255,138,138,.10); color: #ffb7b7; border-color: rgba(255,138,138,.3); }
button:disabled { opacity: .38; cursor: default; }

.game-shell {
  width: min(980px, 100%);
  margin: 0 auto;
  min-height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  background: var(--bg);
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  background: rgba(12,16,22,.92);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.time-block { min-width: 0; }
.game-time { font-weight: 850; letter-spacing: .035em; font-size: 13px; text-transform: uppercase; }
.game-location { color: var(--muted); margin-top: 4px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.save-indicator { font-size: 11px; color: var(--good); white-space: nowrap; }
.icon-btn { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }

.main-stage { padding: 18px 16px 130px; }
.scene-card {
  border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(24,33,49,.92), rgba(18,25,37,.92));
  border-radius: var(--radius);
  padding: clamp(20px, 5vw, 34px);
  min-height: 270px;
  box-shadow: 0 12px 40px rgba(0,0,0,.22);
}
.scene-label { color: var(--muted); text-transform: uppercase; letter-spacing: .14em; font-size: 11px; font-weight: 800; margin-bottom: 18px; }
.scene-text { font-size: clamp(18px, 3.4vw, 23px); line-height: 1.6; white-space: pre-line; letter-spacing: -.01em; }

.suggestions-section { margin-top: 18px; }
.section-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.section-heading h2 { margin: 0; font-size: 14px; }
.section-heading span { color: var(--muted); font-size: 12px; }
.suggestions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
.suggestion {
  text-align: left;
  min-height: 66px;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 14px;
  padding: 11px 12px;
  cursor: pointer;
}
.suggestion:hover { background: var(--panel-2); }
.suggestion .cat { display: block; color: var(--accent-2); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; font-weight: 850; margin-bottom: 5px; }
.suggestion .txt { display: block; line-height: 1.3; font-size: 14px; }

.composer-wrap {
  position: fixed;
  z-index: 25;
  left: 50%;
  bottom: 64px;
  transform: translateX(-50%);
  width: min(948px, calc(100% - 24px));
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: rgba(18,25,37,.96);
  box-shadow: 0 18px 50px rgba(0,0,0,.42);
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.composer {
  width: 100%;
  min-height: 46px;
  max-height: 140px;
  resize: vertical;
  border: 0;
  background: transparent;
  color: var(--text);
  padding: 12px;
  line-height: 1.35;
}
.composer::placeholder { color: #718094; }
.do-btn { min-width: 74px; min-height: 46px; padding: 10px 16px; border: 0; border-radius: 12px; background: var(--accent); color: #07101d; font-weight: 900; cursor: pointer; }

.bottom-nav {
  position: fixed;
  z-index: 24;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: min(980px, 100%);
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  background: rgba(12,16,22,.97);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(14px);
}
.nav-btn { min-height: 58px; border: 0; background: transparent; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .04em; cursor: pointer; }
.nav-btn.active { color: var(--text); background: rgba(121,168,255,.08); }

.drawer {
  position: fixed;
  z-index: 40;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: min(980px, 100%);
  max-height: min(78dvh, 760px);
  background: #101722;
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 24px 24px 0 0;
  box-shadow: 0 -18px 70px rgba(0,0,0,.55);
  overflow: hidden;
  display: grid;
  grid-template-rows: auto 1fr;
}
.drawer-head { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
.drawer-head h2 { margin: 0; font-size: 18px; }
.drawer-body { overflow-y: auto; padding: 16px; }
.close-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; width: 40px; height: 40px; cursor: pointer; }

.cards { display: grid; gap: 10px; }
.card { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 14px; }
.card h3 { margin: 0 0 5px; font-size: 16px; }
.card p { color: var(--muted); margin: 6px 0 0; line-height: 1.45; }
.meta { color: var(--muted); font-size: 12px; }
.row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.stack { display: grid; gap: 10px; }
.pill { display: inline-flex; align-items: center; min-height: 26px; padding: 4px 9px; border-radius: 999px; background: var(--panel-3); color: var(--muted); font-size: 11px; font-weight: 700; }
.money { font-variant-numeric: tabular-nums; font-weight: 850; }
.divider { height: 1px; background: var(--line); margin: 14px 0; }

.subtabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; }
.subtab { white-space: nowrap; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 999px; padding: 9px 12px; cursor: pointer; font-size: 12px; }
.subtab.active { color: var(--text); border-color: rgba(121,168,255,.45); background: rgba(121,168,255,.10); }

.thread-list { display: grid; gap: 8px; }
.thread { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 12px; cursor: pointer; }
.thread.unread { border-color: rgba(121,168,255,.52); }
.thread-preview { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; margin-top: 4px; }
.message-list { display: grid; gap: 8px; margin: 12px 0; }
.bubble { width: fit-content; max-width: 84%; padding: 10px 12px; border-radius: 14px; line-height: 1.4; font-size: 14px; }
.bubble.in { background: var(--panel-3); }
.bubble.out { background: rgba(121,168,255,.20); margin-left: auto; }
.bubble-time { display: block; color: var(--muted); font-size: 10px; margin-top: 5px; }
.inline-compose { display: flex; gap: 8px; position: sticky; bottom: 0; background: #101722; padding-top: 8px; }
.inline-compose input { flex: 1; min-width: 0; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 10px 12px; }
.inline-compose button { border: 0; border-radius: 12px; background: var(--accent); color: #07101d; font-weight: 800; padding: 0 14px; }

.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--panel); }
.stat strong { display: block; margin-top: 3px; }
.skill-groups { display: grid; gap: 14px; }
.skill-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.skill-row:last-child { border-bottom: 0; }

.event-status { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.event-status.missed { color: var(--bad); }
.event-status.attended, .event-status.completed { color: var(--good); }
.event-status.queued, .event-status.started { color: var(--warn); }

.debug-panel {
  position: fixed;
  z-index: 60;
  inset: 0;
  background: rgba(5,8,12,.98);
  display: grid;
  grid-template-rows: auto auto 1fr;
}
.debug-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.debug-head h2 { margin: 0; }
.debug-actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.debug-content { overflow: auto; padding: 16px; }
.debug-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin-bottom: 16px; }
.debug-pre { background: #070a0f; border: 1px solid var(--line); border-radius: 12px; padding: 12px; overflow: auto; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
.test-pass { color: var(--good); }
.test-fail { color: var(--bad); }
.feedback-strip { margin-top: 12px; display:flex; flex-wrap:wrap; gap:7px; min-height: 0; }
.feedback-chip { border:1px solid var(--line); background:rgba(121,168,255,.08); color:var(--text); border-radius:999px; padding:7px 10px; font-size:11px; line-height:1.2; }
.feedback-chip.warn { background:rgba(255,198,109,.08); }
.status-strip { display:flex; flex-wrap:wrap; gap:6px; margin: 0 0 12px; }
.status-chip { border:1px solid var(--line); background:var(--panel); color:var(--muted); border-radius:999px; padding:6px 9px; font-size:11px; }
.recent-entry { border-left:3px solid rgba(121,168,255,.35); }
.recent-entry .recent-kind { text-transform:uppercase; letter-spacing:.08em; font-size:10px; color:var(--accent-2); font-weight:800; }
.payroll-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:10px; }
.alert-banner { border:1px solid rgba(255,198,109,.35); background:rgba(255,198,109,.09); border-radius:14px; padding:12px 14px; margin-bottom:12px; display:flex; gap:10px; align-items:flex-start; justify-content:space-between; }
.alert-banner strong { display:block; margin-bottom:3px; }
.alert-banner button { border:1px solid var(--line); background:transparent; border-radius:9px; color:var(--muted); min-width:34px; height:34px; }

.urgent-stack { display:grid; gap:8px; margin-bottom:12px; }
.urgent-alert { border:1px solid rgba(255,138,138,.7); background:rgba(255,70,70,.14); border-radius:14px; padding:12px 14px; box-shadow:0 0 0 1px rgba(255,70,70,.06) inset; color:inherit; width:100%; text-align:left; font:inherit; cursor:pointer; }
.urgent-alert:active { transform: translateY(1px); }
.stat-button { width:100%; border:0; background:transparent; color:inherit; font:inherit; text-align:left; cursor:pointer; }
.stat-button:hover, .stat-button:focus-visible { background:rgba(120,160,255,.07); }
.explain-card { border:1px solid rgba(125,165,255,.38); background:rgba(86,125,210,.08); border-radius:14px; padding:12px 14px; margin-bottom:12px; }
.debug-details { border:1px solid var(--line); border-radius:12px; margin:8px 0; overflow:hidden; }
.debug-details > summary { cursor:pointer; padding:10px 12px; font-weight:700; background:rgba(255,255,255,.025); }
.debug-details > .debug-detail-body { padding:10px 12px; border-top:1px solid var(--line); }
.urgent-alert strong { color:#ffb2b2; display:block; margin-bottom:4px; letter-spacing:.02em; }
.incoming-call { border:1px solid rgba(121,168,255,.55); background:rgba(121,168,255,.12); border-radius:14px; padding:14px; margin-bottom:12px; }
.incoming-call-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.incoming-call-actions button { min-height:38px; border-radius:10px; padding:8px 12px; }
.typing-bubble { width:fit-content; max-width:84%; padding:10px 12px; border-radius:14px; background:var(--panel-3); color:var(--muted); font-size:13px; }
.typing-dots::after { content:'…'; display:inline-block; width:1.2em; overflow:hidden; vertical-align:bottom; animation:typingdots 1.15s steps(4,end) infinite; }
@keyframes typingdots { 0%{width:0} 100%{width:1.2em} }
.thread-sticky-head { position:sticky; top:-16px; z-index:4; margin:-16px -16px 8px; padding:10px 16px 8px; background:#101722; border-bottom:1px solid var(--line); }
.suggestion .duration { display:block; color:var(--muted); font-size:10px; margin-top:6px; line-height:1.25; }
.composer-main { min-width:0; flex:1; }
.composer-estimate { color:var(--muted); font-size:10px; min-height:14px; padding:0 12px 2px; }
.need-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
.need-meter { border:1px solid var(--line); border-radius:12px; padding:9px 10px; background:var(--panel); }
.need-meter .meta { display:flex; justify-content:space-between; gap:8px; }
.need-bar { height:5px; border-radius:99px; background:rgba(255,255,255,.08); margin-top:7px; overflow:hidden; }
.need-fill { height:100%; background:currentColor; opacity:.75; }
.contact-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }


.toast { position: fixed; z-index: 80; left: 50%; top: 18px; transform: translateX(-50%); background: #202c3e; border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 999px; padding: 10px 14px; font-size: 12px; }

@media (max-width: 620px) {
  .suggestions { grid-template-columns: 1fr; }
  .main-stage { padding-left: 12px; padding-right: 12px; padding-bottom: 132px; }
  .scene-card { min-height: 230px; }
  .scene-text { font-size: 18px; }
  .save-indicator { display: none; }
  .composer-wrap { width: calc(100% - 16px); bottom: 61px; }
  .do-btn { min-width: 62px; }
  .nav-btn { font-size: 9px; }
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .drawer { max-height: 82dvh; }
}

@media (min-width: 780px) {
  .main-stage { padding-top: 26px; }
  .suggestions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

</style>
</head>

<div id="app"></div>
<noscript>This game requires JavaScript.</noscript>
<script>
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  if (root) root.AISandboxEngine = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const SCHEMA_VERSION = 5;
  const DEFAULT_SAVE_KEY = 'ai-sandbox-v1-save';

  const clone = (value) => JSON.parse(JSON.stringify(value));
  const pad = (n) => String(n).padStart(2, '0');
  const nowISO = (d) => {
    const date = d instanceof Date ? d : new Date(d);
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}:00`;
  };
  const asDate = (iso) => new Date(iso);
  const addMinutesISO = (iso, minutes) => nowISO(new Date(asDate(iso).getTime() + minutes * 60000));
  const minutesBetween = (a, b) => Math.max(0, Math.round((asDate(b) - asDate(a)) / 60000));
  const dayStart = (iso) => {
    const d = asDate(iso);
    d.setHours(0, 0, 0, 0);
    return d;
  };
  const atTime = (iso, hour, minute = 0, dayOffset = 0) => {
    const d = dayStart(iso);
    d.setDate(d.getDate() + dayOffset);
    d.setHours(hour, minute, 0, 0);
    return nowISO(d);
  };
  const nextWeekday = (iso, weekday, hour, minute = 0, includeToday = false) => {
    const base = dayStart(iso);
    const current = base.getDay();
    let delta = (weekday - current + 7) % 7;
    if (delta === 0 && !includeToday) delta = 7;
    const candidate = new Date(base);
    candidate.setDate(base.getDate() + delta);
    candidate.setHours(hour, minute, 0, 0);
    if (includeToday && delta === 0 && candidate <= asDate(iso)) candidate.setDate(candidate.getDate() + 7);
    return nowISO(candidate);
  };
  const nextSaturday = (iso, hour = 10, minute = 0) => nextWeekday(iso, 6, hour, minute, true);
  const formatMoney = (n) => `$${Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

  function makeId(prefix, state) {
    state.meta.nextId = (state.meta.nextId || 1) + 1;
    return `${prefix}_${state.meta.nextId}`;
  }

  function seededRandom(state) {
    let x = Number(state.world.rngSeed || 246813579) >>> 0;
    x = (1664525 * x + 1013904223) >>> 0;
    state.world.rngSeed = x;
    return x / 4294967296;
  }

  function startingDate() {
    const d = new Date();
    d.setSeconds(0, 0);
    return nowISO(d);
  }


  function dateKey(iso) {
    const d = iso instanceof Date ? iso : asDate(iso);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  function localISOForDate(dateLike, hhmm) {
    const d = dateLike instanceof Date ? new Date(dateLike) : asDate(dateLike);
    const [h,m] = String(hhmm).split(':').map(Number);
    d.setHours(h, m, 0, 0);
    return nowISO(d);
  }

  function weekOfMonth(dateLike) {
    const d = dateLike instanceof Date ? dateLike : asDate(dateLike);
    return Math.floor((d.getDate() - 1) / 7) + 1;
  }

  function workRuleForDate(dateLike) {
    const d = dateLike instanceof Date ? dateLike : asDate(dateLike);
    const dow = d.getDay();
    // Jonathan's established schedule: Wed 2-6, 1st/3rd Thu 7:40-5, Fri 9:30-5.
    if (dow === 3) return { start: '14:00', end: '18:00', lunchStart: null, lunchEnd: null, label: 'Wednesday shift' };
    if (dow === 4 && [1,3].includes(weekOfMonth(d))) return { start: '07:40', end: '17:00', lunchStart: '12:00', lunchEnd: '13:00', label: 'Thursday shift' };
    if (dow === 5) return { start: '09:30', end: '17:00', lunchStart: '12:00', lunchEnd: '13:00', label: 'Friday shift' };
    return null;
  }

  function payDateForWorkDate(iso) {
    const d = asDate(iso);
    if (d.getDate() <= 15) { d.setDate(20); }
    else { d.setMonth(d.getMonth()+1); d.setDate(5); }
    d.setHours(6,0,0,0);
    return nowISO(d);
  }

  function federalAnnualTax2026(taxable) {
    const brackets = [[12400,.10],[50400,.12],[105700,.22],[201775,.24],[256225,.32],[640600,.35],[Infinity,.37]];
    let tax=0, prev=0, x=Math.max(0, taxable);
    for (const [cap, rate] of brackets) { const amt=Math.min(x,cap)-prev; if (amt>0) tax += amt*rate; if (x<=cap) break; prev=cap; }
    return Math.max(0,tax);
  }

  function caAnnualWithholding2026(annualGross) {
    if (annualGross <= 18896) return 0;
    const x=Math.max(0, annualGross - 5706); // 2026 CA single standard deduction for withholding.
    const rows=[
      [11079,.011,0,0],[26264,.022,11079,121.87],[41452,.044,26264,455.94],[57542,.066,41452,1124.21],
      [72724,.088,57542,2186.15],[371479,.1023,72724,3522.17],[445771,.1133,371479,34084.81],
      [742953,.1243,445771,42502.09],[1000000,.1353,742953,79441.81],[Infinity,.1463,1000000,114220.27]
    ];
    for (const [cap,rate,floor,base] of rows) if (x<=cap) return Math.max(0, base + rate*(x-floor));
    return 0;
  }

  function estimateSemimonthlyWithholding(gross) {

  class ActionInterpreter {
    interpret(raw, state) {
      const text = String(raw || '').trim();
      if (!text) return [];
      const normalized = text.replace(/[’]/g, "'");

      // A phone text is one action even when the message itself contains commas,
      // "then", or "and then". Splitting those phrases here used to truncate
      // messages entered through the Phone UI.
      if (/^(?:text|message)\b/i.test(normalized)) {
        return [this.classify(normalized, state)];
      }

      const clauses = normalized
        .split(/\s*,\s*|\s+and then\s+|\s+then\s+/i)
        .map(s => s.trim().replace(/^and\s+/i, ''))
        .filter(Boolean);
      return clauses.map(clause => this.classify(clause, state));
    }

    classify(clause, state) {
      const lower = clause.toLowerCase();
      if (/\bteleport\b|\bmateriali[sz]e\b|\bwarp\b/.test(lower)) return { type: 'impossible', raw: clause, reason: 'That action is not physically possible in this realistic world.' };
      const framedAsImagined=/\b(imagine|pretend|dream|daydream|draw|write|fantasi[sz]e)\b/.test(lower);
      if (!framedAsImagined && /(?:goldfish|fish|dog|cat|animal).{0,40}\bgrows? wings\b|\bgrows? wings\b.{0,40}\b(?:flies|fly)\b/.test(lower)) return { type:'impossible', raw:clause, reason:'That statement proposes an impossible biological change in this realistic world, so it does not become an objective fact.' };
      if (/\b(fly|levitate)\b/.test(lower) && !framedAsImagined && !/flight|plane|airport/.test(lower) && /^\s*(?:i|jonathan)\b/.test(lower)) return { type: 'impossible', raw: clause, reason: 'Jonathan cannot literally fly or levitate.' };
      if (/\b(?:schedule|book|reserve|make .*appointment|make .*reservation|reschedule|move .*appointment|cancel .*appointment|cancel .*reservation)\b/.test(lower) || (/\b(?:get me in|fit me in)\b/.test(lower) && /\b(?:mechanic|auto shop|service center|doctor|clinic|dentist|dental|salon|barber|restaurant)\b/.test(lower))) return this.parseBooking(clause,state);
      if (!/\b(?:ask|can i|could i|may i|want to ask)\b/.test(lower) && /\b(?:hug|kiss|make out|have sex|sleep with|sexual|touch|cuddle)\b/.test(lower)) return this.parsePhysicalSocial(clause,state);
      if (/\border\b/.test(lower) && /\b(pizza|takeout|delivery|food)\b/.test(lower)) return this.parseFoodOrder(clause, state);
      if (/\b(use|go to|use the)\b.*\b(restroom|bathroom|toilet)\b|\bpee\b|\burinate\b/.test(lower)) return {type:'restroom',raw:clause};
      if (/\badd\b.*\bcontacts?\b/.test(lower)) { const npc=this.findNPC(clause,state); return {type:'add_contact',raw:clause,npcId:npc?npc.id:null}; }
      if (/\btext\b|\bmessage\b|\bsend .* message\b/.test(lower)) return this.parseText(clause, state);
      if (/\bcall\b/.test(lower)) return this.parseCall(clause, state);
      if (/\bdrive\b|\bhead to\b|\bgo (?:back )?to\b|\bwalk to\b/.test(lower)) return this.parseTravel(clause, state);
      if (/\bgrab\b|\bpick up\b|\btake my\b/.test(lower)) return this.parseGrab(clause);
      if (/\b(shower)\b/.test(lower)) { if(/(?:turn|shut).*shower.*off/.test(lower)) return {type:'toggle_shower',raw:clause,state:false}; if(/turn .*shower.*on/.test(lower)) return {type:'toggle_shower',raw:clause,state:true}; return {type:'shower',raw:clause}; }
      if (/\bsleep\b|\bgo to bed\b|\bnap\b/.test(lower)) return this.parseSleep(clause, state);
      if (/\bwait\b|\bdo nothing\b|\bpass the time\b/.test(lower)) return this.parseWait(clause);
      if (/\bbuy\b|\bpay\b|\bspend\b/.test(lower)) return this.parsePurchase(clause);
      if (/\beat\b|\bcook\b|\bmake .* (food|dinner|lunch|breakfast|sandwich|meal)\b/.test(lower)) return { type: 'eat', raw: clause };
      if (/work through.*lunch|work.*until lunch|until lunch/.test(lower)) return { type:'work', raw:clause, mode:'until_lunch' };
      if (/finish (?:the )?shift|work.*until.*(?:5|five)/.test(lower)) return { type:'work', raw:clause, mode:'finish_shift' };
      if (/take (?:my )?lunch|lunch break|go to lunch/.test(lower)) return { type:'work_lunch', raw:clause };
      if (/appointment confirmation|confirm appointments?/.test(lower)) return { type:'work_task', raw:clause, taskId:'confirmations' };
      if (/insurance verification|verify insurance/.test(lower)) return { type:'work_task', raw:clause, taskId:'insurance' };
      if (/voicemail|return .*call/.test(lower)) return { type:'work_task', raw:clause, taskId:'voicemail' };
      if (/waiting room/.test(lower) && !/observe|look|check/.test(lower)) return { type:'work_task', raw:clause, taskId:'waiting' };
      if (/\bwork\b|\bstart working\b/.test(lower)) return { type: 'work', raw: clause, mode:'auto', minutes: this.parseDuration(clause) || null };
      if (/\bpromise\b/.test(lower)) return this.parsePromise(clause, state);
      if (/\blook\b|\bwatch\b|\bobserve\b|\binspect\b|\bcheck\b/.test(lower)) return { type: 'observe', raw: clause };
      if (/\b(tell|ask|say|talk|convince|persuade|lie)\b/.test(lower)) return this.parseTalk(clause, state);
      return { type: 'generic', raw: clause };
    }

    findNPC(text, state) {
      const lower = text.toLowerCase();
      return Object.values(state.npcs).find(n => lower.includes(n.name.toLowerCase())) || null;
    }

    parseText(clause, state) {
      const npc = this.findNPC(clause, state);
      let body = clause;
      if (npc) {
        const rx = new RegExp(`(?:text|message)\\s+${npc.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\s*(?:that|:|,)?\\s*`, 'i');
        body = clause.replace(rx, '').trim();
      }
      body = body.replace(/^i\s+/i, '').trim();
      return { type: 'text', raw: clause, npcId: npc ? npc.id : null, body: body || 'Hey.' };
    }

    parseCall(clause, state) {
      const npc = this.findNPC(clause, state);
      return { type: 'call', raw: clause, npcId: npc ? npc.id : null };

    parseTravel(clause, state) {

        ['home', ['home', 'apartment']], ['work', ['work', 'office', 'orthodontic']], ['maya_home', ["maya's", 'maya']],
        ['daniel_home', ["daniel's", 'daniel']], ['grocery', ['grocery', 'market']], ['coffee', ['coffee', 'juniper']],
        ['park', ['park', 'creekside']], ['auto_shop', ['auto shop', 'mechanic', 'valley auto']], ['dad_home', ["dad's", 'dad home']], ['lax', ['lax','los angeles international','airport']],

    parseBooking(clause,state){

    relationshipCue(npc, changes) {

      if ((changes.attraction||0)>0) return `${npc.name} seemed to notice the flirtatious tone.`;
      if ((changes.trust||0)>0 || (changes.affection||0)>0) return `${npc.name} seemed a little warmer toward you.`;

    }

    todaysWorkShift() {
      const key=dateKey(this.state.world.now);
      return (this.state.scheduledEvents||[]).find(e=>e.type==='work_shift' && dateKey(e.triggerAt)===key && !['cancelled'].includes(e.status)) || null;
    }

    ensureWorkplaceTasks() {

        {id:'confirmations',label:'Appointment confirmations',remaining:2+(seed%3),minutesEach:7},
        {id:'insurance',label:'Insurance verification',remaining:1+(seed%2),minutesEach:14},
        {id:'voicemail',label:'Patient voicemail',remaining:1+(seed%3===0?1:0),minutesEach:8},
        {id:'waiting',label:'Waiting-room follow-up',remaining:seed%2,minutesEach:5}

    }

    workTaskSummary() {
      const tasks=this.ensureWorkplaceTasks().filter(t=>t.remaining>0);
      if(!tasks.length) return 'The front desk is caught up for the moment.';
      return tasks.map(t=>`${t.remaining} ${t.label.toLowerCase()}${t.remaining===1?'':' items'}`).join(', ')+'.';
    }

    recordWorkMinutes(minutes, shift, description='Work shift') {
      const s=this.state, payroll=s.player.employment.payroll; const mins=Math.max(0,Math.round(minutes)); if(!mins) return {minutes:0,gross:0};
      const gross=Math.round((mins/60)*s.player.employment.hourlyRate*100)/100; const payDate=payDateForWorkDate(s.world.now);
      const entry={id:makeId('pay',s),workDate:dateKey(s.world.now),minutes:mins,gross,description,payDate,status:'pending'}; payroll.pendingEntries.push(entry);
      if(shift){ shift.workedMinutes=(shift.workedMinutes||0)+mins; shift.grossEarned=Math.round(((shift.grossEarned||0)+gross)*100)/100; }

      this.addActivity('work', `${mins} paid minutes worked · ${formatMoney(gross)} added to pending payroll.`);

    }

    processPayrollEvent(event) {
      const s=this.state, payroll=s.player.employment.payroll; const key=dateKey(event.triggerAt);
      const entries=payroll.pendingEntries.filter(x=>x.status==='pending' && dateKey(x.payDate)===key);
      if(!entries.length){ event.status='completed'; return null; }
      const minutes=entries.reduce((a,x)=>a+x.minutes,0), gross=Math.round(entries.reduce((a,x)=>a+x.gross,0)*100)/100;
      const tax=estimateSemimonthlyWithholding(gross); const net=Math.round(tax.net*100)/100;

    maybeScheduleDealerCheckIn() {

      const last=c.lastDealerCheckInAt?asDate(c.lastDealerCheckInAt):null; if(last && (asDate(s.world.now)-last)<72*3600000) return;

    }

    discoverSituation(id, source, knownInformation = []) {

      sit.knownInformation=Array.isArray(sit.knownInformation)?sit.knownInformation:[];

      if(!wasKnown){ this.feedback(`${sit.title} discovered`); this.addActivity('situation',`${sit.title} discovered.`,{importance:'high'}); }

    }

    setCalendarReminder(eventId, minutes) {
      const e=(this.state.scheduledEvents||[]).find(x=>x.id===eventId && x.visibility==='known'); if(!e) return false;
      const allowed=[null,0,15,60,1440]; const value=minutes==null?null:Number(minutes); if(!allowed.includes(value)) return false;
      e.reminderMinutes=value; e.reminderLastTriggeredFor=null; const ap=this.state.appointments&&this.state.appointments.find(a=>a.linkedEventId===e.id||a.id===e.appointmentId); if(ap)ap.reminderMinutes=value;
      const label=value==null?'Off':value===0?'At event time':value===15?'15 minutes before':value===60?'1 hour before':'1 day before';

    }

    processCalendarReminders(from,to,visible) {

    applyNPCSocialResult(npcId, social, source='conversation') {

      for(const key of ['trust','affection','respect','attraction','fear','resentment']){ const v=Math.max(-6,Math.min(6,Number(effects[key]||0))); if(v) deltas[key]=v; }

    validateAction(action) {

        if (action.mode === 'drive' && !s.player.possessions.some(p => p.id === 'car')) return { ok: false, reason: 'You do not have access to a car.' };

      }

        if (s.player.money.checking+s.player.money.cash<action.amount) return {ok:false,reason:`You do not have enough available money for ${formatMoney(action.amount)}.`};
      }
      if (action.type === 'order_food') { if (!action.amount || action.amount<=0) return {ok:false,reason:'The order needs a plausible price.'}; if (s.player.money.checking+s.player.money.cash<action.amount) return {ok:false,reason:`You do not have enough available money for ${formatMoney(action.amount)}.`}; }

        if (s.player.money.checking + s.player.money.cash < action.amount) return { ok: false, reason: `You do not have enough available money for ${formatMoney(action.amount)}.` };
      }

    perform(raw) {
      const state = this.state;

      state.meta.turn += 1;
      this.log('player', `Player input: ${raw}`);
      const actions = this.interpretAction(raw);

      if (!actions.length) {
        results.push({ ok: false, narrative: 'You hesitate without committing to an action.', minutes: 1 });
        visibleEvents.push(...this.advanceTime(1).visibleEvents);
      } else {
        for (const action of actions) {
          const validation = this.validateAction(action);
          if (!validation.ok) {
            this.log('validation', `Rejected ${action.type}: ${validation.reason}`);
            results.push({ ok: false, type: action.type, narrative: validation.reason, minutes: 1 }); this.addActivity('blocked', validation.reason);
            visibleEvents.push(...this.advanceTime(1).visibleEvents);
            continue;
          }
          const resolved = this.resolveAction(action);
          results.push(resolved);
          if (resolved && resolved.narrative) this.addActivity(resolved.ok===false?'blocked':'action', String(resolved.narrative).slice(0,260));
          state.world.currentActivity=action.type; state.world.lastActionStartedAt=state.world.now;
          const coPresent=Object.values(state.npcs).filter(n=>n.current.locationId===state.world.playerLocationId && n.current.scheduleOverride);
          if(resolved&&resolved.ok!==false && coPresent.length && /hang|game|overwatch|couch|talk|eat|watch|joke|hug/i.test(action.raw||'')) coPresent.forEach(n=>this.recordInteraction(n.id,'shared activity',.35,Math.max(5,resolved.minutes||5),action.raw));
          if (resolved.minutes > 0) visibleEvents.push(...this.advanceTime(resolved.minutes).visibleEvents);
          state.world.currentActivity=null;
        }
      }

      this.updateSituations();
      this.compressHistoryIfNeeded();
      state.meta.updatedAt = state.world.now;
      state.ui.lastActionResults = results;
      state.ui.lastNarrative = this.provider.generateScene(state, { results, visibleEvents });
      state.ui.suggestions = this.provider.generateSuggestions(state);
      this.log('scene', 'Scene and contextual suggestions generated.');
      return { state, results, visibleEvents, narrative: state.ui.lastNarrative, suggestions: state.ui.suggestions };
    }

    resolveAction(action) {
      const s = this.state;
      switch (action.type) {
        case 'text': return this.resolveText(action);
        case 'call': return this.resolveCall(action);
        case 'travel': return this.resolveTravel(action);
        case 'grab': return this.resolveGrab(action);
        case 'toggle_shower': { const on=action.state!==false; this.setEnvironment(s.world.playerLocationId,{waterFlow:on},'player action'); this.log('action', `Shower turned ${on?'on':'off'}.`); return { ok:true,type:action.type,minutes:1,narrative:on?'You turn the shower on. Water begins running behind the bathroom door.':'You turn the shower off. The water stops running.' }; }
        case 'shower': s.player.condition.stress = Math.max(0, s.player.condition.stress - 4); s.player.condition.hygiene=Math.min(100,Number(s.player.condition.hygiene||0)+35); return { ok: true, type: action.type, minutes: 15, narrative: 'You take a shower and get dressed again.' };
        case 'sleep': return this.resolveSleep(action);
        case 'wait': return this.resolveWait(action);
        case 'purchase': return this.resolvePurchase(action);
        case 'booking': return this.resolveBooking(action);
        case 'physical_social': return this.resolvePhysicalSocial(action);
        case 'order_food': return this.resolveFoodOrder(action);
        case 'restroom': return this.resolveRestroom(action);
        case 'add_contact': return this.resolveAddContact(action);
        case 'cannabis_purchase': return this.resolveCannabisPurchase(action);
        case 'work_lunch': return this.resolveWorkLunch(action);
        case 'work_task': return this.resolveWorkTask(action);
        case 'eat': s.player.condition.hunger = Math.max(5, s.player.condition.hunger - 42); s.player.condition.energy=Math.min(100,s.player.condition.energy+5); s.player.condition.lastAteAt=s.world.now; s.player.condition.recentIntake.push({at:s.world.now,type:'meal',size:'normal'}); return { ok: true, type: action.type, minutes: 25, narrative: 'You make something simple to eat and finish the meal.' };
        case 'work': return this.resolveWork(action);
        case 'promise': return this.resolvePromise(action);
        case 'observe': return this.resolveObserve(action);
        case 'talk': return this.resolveTalk(action);
        case 'generic': return this.resolveGeneric(action);
        default: return { ok: false, type: action.type, minutes: 1, narrative: 'That action could not be interpreted clearly enough to resolve.' };
      }
    }

    resolveText(action) {
      const s = this.state; const npc = s.npcs[action.npcId]; const thread = npc.phone.threadId;
      s.messages[thread] = s.messages[thread] || [];
      const analysis = this.analyzePlayerMessage(npc, action.body, thread);
      const msg = {
        id: makeId('msg', s), at: s.world.now, senderId: 'jonathan', recipientId: npc.id,
        body: action.body, read: true, topic: analysis.topic, intent: analysis.intent,
      };
      s.messages[thread].push(msg);
      npc.relationshipDynamics=npc.relationshipDynamics||{}; npc.relationshipDynamics.lastPlayerInitiatedAt=s.world.now;
      this.updateDialogueThread(thread, { topic: analysis.topic, lastPlayerIntent: analysis.intent, lastPlayerMessageId: msg.id });
      this.log('message', `Message sent to ${npc.name}. Topic=${analysis.topic}; intent=${analysis.intent}.`);

      const replyPlan = this.composeReply(npc, action.body, thread, msg.id, analysis);
      const delay = this.replyDelayMinutes(npc, analysis);
      const replyEventId = makeId('evt', s);
      s.scheduledEvents.push({
        id: replyEventId, type: 'message_response', title: `${npc.name} reply`,
        triggerAt: addMinutesISO(s.world.now, delay), deadlineAt: null, status: 'queued', visibility: 'hidden', npcId: npc.id,
        payload: {
          respondingTo: msg.id, incomingBody: replyPlan.body, topic: replyPlan.topic,
          intent: replyPlan.intent, memoryEvent: replyPlan.memoryEvent || null, engineVersion: 3,
          dialogueProvider: 'local-context-v3', social: this.localTextSocialOutcome(npc, action.body),
        },
      });
      return {
        ok: true, type: action.type, minutes: 1, narrative: `You text ${npc.name}: “${action.body}”`,
        npcId: npc.id, outgoingMessageId: msg.id, replyEventId,
      };
    }

    localTextSocialOutcome(npc, body) {
      const lower=String(body||'').toLowerCase();
      const out={meaningful:false,intent:'neutral',perceived_as_flirting:false,flirt_reception:'none',relationship_effects:{trust:0,affection:0,respect:0,attraction:0,fear:0,resentment:0},visible_feedback:'',memory:{create:false,event:'',emotional_valence:0,emotional_strength:0,importance:0}};
      const flirt=/\b(date|cute|hot|handsome|beautiful|sexy|kiss|flirt|crush|miss you|want you)\b|[😉😘😍]/i.test(body) || /excuse to see you/i.test(lower);
      if(flirt){
        out.meaningful=true; out.intent='flirt'; out.perceived_as_flirting=true;
        const receptive=(npc.relationship.attraction||0)>=15 || (npc.relationship.affection||0)>=55;
        const negative=(npc.relationship.resentment||0)>=30 || (npc.relationship.fear||0)>=20;
        out.flirt_reception=negative?'negative':receptive?'positive':'neutral';
        if(negative){out.relationship_effects.attraction=-1;out.relationship_effects.respect=-1;out.relationship_effects.resentment=2;out.visible_feedback=`${npc.name} seemed uncomfortable with the tone.`;}
        else if(receptive){out.relationship_effects.attraction=2;out.relationship_effects.affection=1;out.visible_feedback=`${npc.name} seemed receptive to the flirting.`;}
        else {out.relationship_effects.attraction=1;out.visible_feedback=`${npc.name} seemed to notice the flirtatious tone.`;}
        out.memory={create:true,event:`Jonathan sent ${npc.name} a flirtatious message; ${npc.name} received it ${out.flirt_reception}ly.`,emotional_valence:negative?-0.3:receptive?0.3:0.05,emotional_strength:0.3,importance:0.4};
        return out;
      }
      if(/\b(sorry|apologize|apology)\b/i.test(body)){out.meaningful=true;out.intent='apology';out.relationship_effects.trust=1;out.relationship_effects.affection=1;out.visible_feedback=`${npc.name} seemed to appreciate the apology.`;out.memory={create:true,event:`Jonathan apologized to ${npc.name} over text.`,emotional_valence:0.2,emotional_strength:0.2,importance:0.3};return out;}
      if(/\b(thank you|thanks|appreciate you|i'm here for you|im here for you|you can talk to me)\b/i.test(body)){out.meaningful=true;out.intent='support';out.relationship_effects.trust=1;out.relationship_effects.affection=1;out.visible_feedback=`${npc.name} seemed a little warmer after that.`;return out;}
      if(/\b(idiot|stupid|shut up|hate you|fuck you)\b/i.test(body)){out.meaningful=true;out.intent='insult';out.relationship_effects.respect=-2;out.relationship_effects.resentment=2;out.visible_feedback=`${npc.name} seemed put off by that.`;out.memory={create:true,event:`Jonathan insulted ${npc.name} over text.`,emotional_valence:-0.4,emotional_strength:0.35,importance:0.4};return out;}
      return out;
    }

    normalizeDialogueText(text) {
      return String(text || '')
        .toLowerCase()
        .replace(/[’]/g, "'")
        .replace(/[^a-z0-9'?!$%\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    updateDialogueThread(threadId, patch) {
      const s = this.state;
      s.dialogue = s.dialogue || { version: 2, threads: {} };
      s.dialogue.threads = s.dialogue.threads || {};
      const current = s.dialogue.threads[threadId] || { topic: 'general', turns: 0 };
      s.dialogue.threads[threadId] = { ...current, ...patch, turns: (current.turns || 0) + 1, updatedAt: s.world.now };
      return s.dialogue.threads[threadId];
    }

    dialogueContext(npc, threadId, respondingToId = null) {
      const all = (this.state.messages[threadId] || []);
      let end = all.length;
      if (respondingToId) {
        const idx = all.findIndex(m => m.id === respondingToId);
        if (idx >= 0) end = idx + 1;
      }
      const messages = all.slice(Math.max(0, end - 10), end);
      const current = messages[messages.length - 1] || null;
      const beforeCurrent = messages.slice(0, -1);
      const lastNpc = [...beforeCurrent].reverse().find(m => m.senderId === npc.id) || null;
      const lastPlayer = [...beforeCurrent].reverse().find(m => m.senderId === 'jonathan') || null;
      const lastNpcBeforeLastPlayer = lastPlayer
        ? [...beforeCurrent.slice(0, beforeCurrent.lastIndexOf(lastPlayer))].reverse().find(m => m.senderId === npc.id) || null
        : null;
      const threadState = (this.state.dialogue && this.state.dialogue.threads && this.state.dialogue.threads[threadId]) || {};
      return { messages, current, lastNpc, lastPlayer, lastNpcBeforeLastPlayer, threadState };
    }

    inferDialogueTopic(text, npc, context = null) {
      const lower = this.normalizeDialogueText(text);
      if (/\b(work|job|boss|manager|office|shift|schedule|coworker|week was|this week)\b/.test(lower)) return 'work';
      if (/\b(money|bank|balance|rent|pay|paid|cost|cash|dollar|\$)\b/.test(lower)) return 'money';
      if (/\b(home|apartment|house|where are you|where you at|location)\b/.test(lower)) return 'location';
      if (/\b(gym|workout|exercise|basketball)\b/.test(lower)) return 'fitness';
      if (/\b(dinner|eat|food|coffee|breakfast|lunch)\b/.test(lower)) return 'food';
      if (/\b(saturday|sunday|monday|tuesday|wednesday|thursday|friday|tomorrow|tonight|later|when|time|plan|plans|free)\b/.test(lower)) return 'plans';
      if (/\b(tired|okay|good|bad|feel|feeling|night|day|doing|how are you|how r you)\b/.test(lower)) return 'wellbeing';
      if (/\b(car|squeak|mechanic|oil)\b/.test(lower)) return 'car';
      if (context && context.lastNpc) {
        const inherited = context.lastNpc.topic || this.inferDialogueTopic(context.lastNpc.body, npc, null);
        if (inherited && inherited !== 'general') return inherited;
      }
      if (context && context.threadState && context.threadState.topic) return context.threadState.topic;
      if (npc.id === 'maya' && npc.plans && (npc.plans.unresolvedProblems || []).some(x => /work|schedule|manager/i.test(x))) return 'work';
      return 'general';
    }

    inferDialogueIntent(text, context = null) {
      const lower = this.normalizeDialogueText(text);
      if (/\bwhat works\b|\bwhat do you mean\b|\bwhat did you mean\b|\bthat makes no sense\b|\bi'm confused\b|\bim confused\b|^huh\??$/.test(lower)) return 'repair';
      if (/\bwhat happened\b|\bwhat's happened\b|\bwhat was ridiculous\b|\bwhy\b|\bhow come\b|\btell me more\b|\bwhat went on\b/.test(lower)) return 'ask_explain';
      if (/\bhow are you\b|\bhow r you\b|\byou okay\b|\bare you okay\b|\bhow you doing\b|\bhow's your night\b|\bhow is your night\b/.test(lower)) return 'ask_wellbeing';
      if (/\bwhat are you doing\b|\bwhat're you doing\b|\bwhat you doing\b|\bwyd\b/.test(lower)) return 'ask_activity';
      if (/\bwhere are you\b|\bwhere you at\b/.test(lower)) return 'ask_location';
      if (/\bwhich shift\b|\bwhat shift\b|\bwhen is it\b|\bwhat day\b|\bwhat time\b/.test(lower)) return 'ask_schedule_detail';
      if (/\bcan you\b|\bcould you\b|\bwould you\b|\bdo you want\b|\bwanna\b|\bwant to\b/.test(lower) && /\?/.test(lower)) return 'request';
      if (/\bthank|thanks|appreciate\b/.test(lower)) return 'thanks';
      if (/\bsorry|my bad\b/.test(lower)) return 'apology';
      if (/^(hey|hi|hello|yo)\b/.test(lower)) return 'greeting';
      if (/\?$/.test(lower) || /^(what|why|how|when|where|who|is|are|do|did|can|could|would)\b/.test(lower)) return 'question';
      if (/\b(ok|okay|sure|sounds good|got it|alright|yeah|yep|yes)\b/.test(lower) && lower.length < 35) return 'acknowledge';
      if (/\b(no|nah|can't|cannot|wont|won't|don't want)\b/.test(lower) && lower.length < 50) return 'decline';
      if (context && context.lastNpc && /\?/.test(context.lastNpc.body || '')) return 'answer';
      return 'statement';
    }

    analyzePlayerMessage(npc, body, threadId) {
      const context = this.dialogueContext(npc, threadId);
      const intent = this.inferDialogueIntent(body, context);
      const topic = this.inferDialogueTopic(body, npc, context);
      return { intent, topic };
    }

    replyDelayMinutes(npc, analysis) {
      const s = this.state;
      const activity=String(npc.current&&npc.current.activity||'').toLowerCase();
      let base = 2 + Math.floor(seededRandom(s) * 9);
      if (/sleep/.test(activity)) base += 240 + Math.floor(seededRandom(s) * 240);
      else if (/driv|commut/.test(activity)) base += 20 + Math.floor(seededRandom(s) * 35);
      else if (/work/.test(activity)) base += 10 + Math.floor(seededRandom(s) * 30);
      else if (/gym|work out|meeting|errand|shopping|friend|coffee/.test(activity)) base += 6 + Math.floor(seededRandom(s) * 18);
      const d=npc.relationshipDynamics||{};
      const warmth=(Number(npc.relationship&&npc.relationship.affection||0)+Number(npc.relationship&&npc.relationship.familiarity||0))/2;
      if(warmth>=65 && Number(d.momentum||0)>1) base=Math.max(1,base-3);
      if(Number(d.unansweredMeaningfulMessages||0)>=2 || Number(d.momentum||0)<-2) base+=8+Math.floor(seededRandom(s)*18);
      if (analysis.intent === 'repair' || analysis.intent === 'ask_explain') base = Math.max(2, base - 2);
      if (analysis.intent === 'request' || analysis.intent === 'ask_wellbeing') base = Math.max(1, base - 1);
      return Math.max(1,Math.min(720,base));
    }

    chooseReply(options) {
      if (!options || !options.length) return '';
      const i = Math.floor(seededRandom(this.state) * options.length);
      return options[Math.max(0, Math.min(options.length - 1, i))];
    }

    contextualFallback(npc, topic, intent, context) {
      const lastNpcText = context.lastNpc ? this.normalizeDialogueText(context.lastNpc.body) : '';
      if (intent === 'question') {
        if (topic === 'work') return npc.id === 'maya'
          ? 'Mostly work stuff. The schedule has been a mess lately. What part did you mean?'
          : npc.id === 'daniel' ? 'If you mean work, it’s been pretty routine. What were you asking about exactly?' : 'If you mean work, things are moving along. What part are you asking about?';
        if (topic === 'plans') return 'I’m not totally sure what you mean. Are you asking what I’m doing later or about a specific plan?';
        if (topic === 'wellbeing') return `I’m ${npc.current.mood || 'okay'} right now. What did you want to know?`;
        if (lastNpcText) return `I might be missing what you mean. Are you asking about what I just said?`;
        return 'I’m not totally sure what you mean. Can you say it another way?';
      }
      if (intent === 'statement') {
        if (topic === 'work') return npc.id === 'maya' ? 'Yeah. Work has been taking more out of me than usual lately.' : 'Yeah, I get you. Work has been pretty normal on my end.';
        if (topic === 'plans') return 'Got it. Keep me posted once you know what you want to do.';
        return npc.id === 'dad' ? 'Got it. Keep me posted.' : 'Yeah, I get what you mean.';
      }
      return 'I might be missing the context. Say that one more way?';
    }

    repairReply(npc, context) {
      const lastNpc = context.lastNpc;
      const priorPlayer = context.lastPlayer;
      const priorNpc = context.lastNpcBeforeLastPlayer;
      const genericAck = lastNpc && /^(yeah,? that works\.?|sounds good\.?|okay\.?|got it\.?)$/i.test((lastNpc.body || '').trim());
      if (genericAck && priorPlayer) {
        const priorIntent = this.inferDialogueIntent(priorPlayer.body, { lastNpc: priorNpc, threadState: context.threadState });
        const priorTopic = this.inferDialogueTopic(priorPlayer.body, npc, { lastNpc: priorNpc, threadState: context.threadState });
        if (priorIntent === 'ask_explain' && npc.id === 'maya' && priorTopic === 'work') {
          return 'Sorry, that reply made no sense. I meant work was ridiculous. My schedule kept getting moved around and we were short-staffed, so I got stuck staying late a couple times. Nothing dramatic, just exhausting.';
        }
        if (priorTopic === 'plans') return 'Sorry, I answered that badly. I meant the plan we were talking about. Tell me which part you were asking about.';
        return `Sorry, that reply didn't match what you asked. I was responding to your last message, not saying that something specific “works.”`;
      }
      return `Sorry, I wasn't clear. Tell me which part you want me to explain and I'll answer that directly.`;
    }

    composeReply(npc, body, threadId, respondingToId = null, analysis = null) {
      const context = this.dialogueContext(npc, threadId, respondingToId);
      const intent = analysis ? analysis.intent : this.inferDialogueIntent(body, context);
      const topic = analysis ? analysis.topic : this.inferDialogueTopic(body, npc, context);
      const lower = this.normalizeDialogueText(body);
      let reply = '';
      let memoryEvent = null;

      if (intent === 'repair') {
        reply = this.repairReply(npc, context);
      } else if (intent === 'ask_explain') {
        if (npc.id === 'maya' && topic === 'work') {
          reply = this.chooseReply([
            'Mostly work. My schedule kept getting changed around and we were short-staffed, so I ended up staying late a couple times. Nothing huge happened, it was just one annoying thing after another.',
            'Work, mainly. The schedule was all over the place and we were short a person more than once. I kept thinking I was done and then something else came up.',
            'Honestly, mostly work. Too many last-minute schedule changes, not enough people, and a couple late days. By the end of the week I was completely over it.'
          ]);
          memoryEvent = 'Maya told Jonathan that her rough week was mainly caused by schedule changes, short staffing, and staying late.';
        } else if (npc.id === 'daniel' && topic === 'work') {
          reply = 'Nothing dramatic. Work has just been busy and I’m trying to sort out one of my upcoming shifts.';
        } else if (topic === 'wellbeing') {
          reply = `Nothing major. I’m just ${npc.current.mood || 'a little worn out'} and trying to have a quiet night.`;
        } else {
          reply = this.contextualFallback(npc, topic, 'question', context);
        }
      } else if (intent === 'ask_wellbeing') {
        if (npc.id === 'maya') reply = 'I’m okay. Just tired and kind of done with work for the week. I’m home now, so I’m trying to shut my brain off.';
        else if (npc.id === 'daniel') reply = `I’m good. Pretty normal night. ${npc.current.activity === 'working out' ? 'I’m at the gym right now.' : 'Just figuring out what I want to do later.'}`;
        else reply = 'I’m good. Just taking care of a few things around the house.';
      } else if (intent === 'ask_activity') {
        const activity = npc.current.activity || 'taking it easy';
        if (npc.id === 'maya' && activity === 'at home') reply = 'I’m home. Mostly sitting around and trying to decompress.';
        else if (npc.id === 'daniel' && activity === 'at home') reply = 'At home right now. Debating whether I actually feel like going out again.';
        else if (npc.id === 'dad' && activity === 'at home') reply = 'At home. I’m finishing a couple things and then I’m done for the night.';
        else reply = `I’m ${activity} right now.`;
      } else if (intent === 'ask_location') {
        const loc = this.state.locations[npc.current.locationId];
        reply = loc ? `I’m at ${loc.name} right now.` : 'I’m out right now, but nothing unusual.';
      } else if (intent === 'ask_schedule_detail' || /\bshift\b/.test(lower)) {
        if (npc.id === 'daniel') reply = 'I meant the later upcoming shift. I’m still trying to pin down whether I actually need to swap it, so I don’t want to give you the wrong day yet.';
        else if (npc.id === 'maya') reply = 'My schedule has been changing enough that I’m not counting on anything until it’s actually posted.';
        else reply = 'I’ll check the exact time before I tell you so I don’t give you the wrong one.';
      } else if (/\blate\b/.test(lower)) {
        reply = npc.id === 'maya' ? 'No problem. Just let me know when you’re actually heading over.' : 'All good. Just text me when you’re on the way.';
      } else if (/\bhelp\b|\bsaturday\b/.test(lower) && intent !== 'question') {
        reply = 'That would help. I’ll confirm the time with you before then.';
      } else if (intent === 'thanks') {
        reply = npc.id === 'dad' ? 'Of course.' : this.chooseReply(['Of course.', 'Anytime.', 'Yeah, no problem.']);
      } else if (intent === 'apology') {
        reply = npc.relationship.resentment > 25 ? 'I hear you. I’m still a little annoyed, but I appreciate you saying that.' : 'You’re fine. I appreciate you saying it.';
      } else if (intent === 'greeting') {
        reply = npc.id === 'dad' ? 'Hey. Everything okay?' : this.chooseReply(['Hey, what’s up?', 'Hey. How’s your night going?', 'Hey lol, what’s going on?']);
      } else if (intent === 'acknowledge') {
        reply = topic === 'work' && npc.id === 'maya' ? 'Yeah. I’m just glad the week is over.' : this.chooseReply(['Yeah.', 'Gotcha.', 'Okay, good.']);
      } else if (intent === 'decline') {
        reply = npc.id === 'maya' ? 'That’s fine. No pressure.' : npc.id === 'dad' ? 'Okay. Just let me know what you decide.' : 'No worries.';
      } else if (intent === 'answer') {
        reply = this.contextualFallback(npc, topic, 'statement', context);
      } else if (intent === 'request') {
        if (/\bcall\b/.test(lower)) reply = npc.current.activity === 'working' ? 'I can call when I’m free.' : 'Yeah, give me a few minutes.';
        else if (/\bcome over|hang out|meet|coffee|dinner\b/.test(lower)) reply = npc.id === 'maya' ? 'Maybe. What time were you thinking?' : 'Possibly. What did you have in mind?';
        else reply = 'Maybe. Tell me exactly what you’re asking and I’ll let you know.';
      } else {
        reply = this.contextualFallback(npc, topic, intent, context);
      }

      if (!reply || /^(yeah,? that works\.?|sounds good\.?)$/i.test(reply.trim())) {
        reply = this.contextualFallback(npc, topic, intent === 'question' ? 'question' : 'statement', context);
      }

      this.updateDialogueThread(threadId, { topic, lastNpcIntent: 'reply', lastNpcPlannedReplyTo: respondingToId });
      return { body: reply, topic, intent: 'reply', memoryEvent };
    }

    resolveCall(action) {
      const npc = this.state.npcs[action.npcId];
      const reachable = npc.current.activity !== 'working' || seededRandom(this.state) > 0.45;
      if (!reachable) { this.addActivity('call',`${npc.name} did not answer.`); return { ok: true, type: action.type, minutes: 2, narrative: `${npc.name} does not answer. The call rolls to voicemail.` }; }
      this.markThreadRead(npc.phone.threadId);

    applyAIActionResolution(raw, resolution) {
      const s = this.state;
      const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, Number(n) || 0));
      const effects = resolution && resolution.effects && typeof resolution.effects === 'object' ? resolution.effects : {};
      const notes = [];
      let changes = 0;

      s.meta.turn += 1;
      this.log('player', `Player free action: ${raw}`);
      this.log('parse', 'Free action routed through Milestone 2 AI action interpreter.');

      const duration = clamp(resolution && resolution.duration_minutes != null ? resolution.duration_minutes : 4, 1, 1440);
      let narrative = String(resolution && resolution.narrative || '').trim() || `You attempt to ${String(raw).replace(/^i\s+/i, '')}.`;

      // Milestone 5: physical/romantic assertions never bypass current consent and co-location.
      const physicalAction=this.interpretAction(raw).find(a=>a.type==='physical_social');
      if(physicalAction){
        const resolved=this.resolvePhysicalSocial(physicalAction); const visibleEvents=resolved.minutes>0?this.advanceTime(resolved.minutes).visibleEvents:[];
        s.ui.lastActionResults=[resolved]; s.ui.lastSimulationNotice=resolved.ok?'':'The requested physical interaction was not mutually established.';
        s.ui.lastNarrative=this.provider.generateScene(s,{results:[resolved],visibleEvents}); s.ui.suggestions=this.provider.generateSuggestions(s); s.meta.updatedAt=s.world.now; this.refreshRelationshipLabels();
        return {state:s,results:[resolved],visibleEvents,narrative:s.ui.lastNarrative,suggestions:s.ui.suggestions,changes:resolved.ok?1:0};
      }

      if (resolution && resolution.possible === false) {
        const visibleEvents = this.advanceTime(Math.min(duration, 10)).visibleEvents;
        if (Array.isArray(resolution.unsupported) && resolution.unsupported.length) notes.push(...resolution.unsupported.map(String));
        if (resolution.no_state_change_reason) notes.push(String(resolution.no_state_change_reason));
        if (!notes.length) notes.push('The action could not be carried out as stated, so no tracked state was changed.');
        narrative += `\n\nSimulation note: ${notes.join(' ')}`;
        const result = { ok: false, type: 'ai_freeform', minutes: duration, narrative };
        s.ui.lastActionResults = [result];
        s.ui.lastSimulationNotice = notes.join(' ');
        s.ui.lastNarrative = this.provider.generateScene(s, { results: [result], visibleEvents });
        s.ui.suggestions = this.provider.generateSuggestions(s);
        s.meta.updatedAt = s.world.now;
        this.log('scene', 'AI free action rejected or only partially understood.');
        return { state: s, results: [result], visibleEvents, narrative: s.ui.lastNarrative, suggestions: s.ui.suggestions };
      }

      // Core condition deltas. Milestone 4 allows the AI to propose any tracked need, but the engine clamps every change.
      const condition = effects.condition || {};
      const conditionRules = {
        energy:[0,100,30], hunger:[0,100,30], stress:[0,100,30], hydration:[0,100,30], health:[0,100,20],
        pain:[0,100,25], hygiene:[0,100,35], bladder:[0,100,40], socialConnection:[0,100,25], mood:[0,100,25],
        focus:[0,100,25], fitness:[0,100,4], intimacyNeed:[0,100,30], security:[0,100,20], sleepDebtHours:[0,36,12]
      };
      for (const [key, rule] of Object.entries(conditionRules)) {
        if (condition[key] == null) continue;
        const delta = clamp(condition[key], -rule[2], rule[2]);
        if (!delta) continue;
        s.player.condition[key] = clamp(Number(s.player.condition[key] || 0) + delta, rule[0], rule[1]);
        changes += 1;
        this.log('condition', `${key} ${delta >= 0 ? '+' : ''}${delta} from free action.`, true);
        if (['energy','hunger','stress','hydration'].includes(key)) {
          const labels={energy:'Energy',hunger:'Hunger',stress:'Stress',hydration:'Hydration'}; this.feedback(`${labels[key]} ${delta>0?'increased':'decreased'}`);
        }
      }

      // Temporary effects such as high, caffeinated, sore, buzzed, focused, etc.
      const statuses = Array.isArray(effects.statuses) ? effects.statuses.slice(0, 6) : [];
      s.player.condition.statusEffects = Array.isArray(s.player.condition.statusEffects) ? s.player.condition.statusEffects : [];
      for (const st of statuses) {
        if (!st || !st.label) continue;
        const minutes = clamp(st.duration_minutes == null ? 60 : st.duration_minutes, 5, 1440);
        const id = String(st.id || st.label).toLowerCase().replace(/[^a-z0-9_-]+/g, '-').slice(0, 48) || `status-${Date.now()}`;
        const status = {
          id, label: String(st.label).slice(0, 80), intensity: String(st.intensity || 'mild').slice(0, 24),
          startedAt: s.world.now, expiresAt: addMinutesISO(s.world.now, minutes),
          impairsDriving: Boolean(st.impairs_driving ?? st.impairsDriving),
          modifiers: {
            coordination: clamp(st.modifiers && st.modifiers.coordination, -25, 25),
            composure: clamp(st.modifiers && st.modifiers.composure, -25, 25),
            driving: clamp(st.modifiers && st.modifiers.driving, -25, 25),
          },
        };
        s.player.condition.statusEffects = s.player.condition.statusEffects.filter(x => x.id !== id);
        s.player.condition.statusEffects.push(status);
        changes += 1;
        this.log('status', `Status applied: ${status.label} until ${status.expiresAt}.`, true); this.feedback(status.label); this.addActivity('status',`${status.label} status began (${status.intensity}).`);
      }

      // Relationship effects. Only NPCs actually present can be affected by a non-phone free action.
      const relEffects = Array.isArray(effects.relationships) ? effects.relationships.slice(0, 8) : [];
      const appliedRelationshipNpcIds = new Set();

    check('56 — Text reply world effects can create a future commitment', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:56})); const event={id:'msgfx',type:'message_response',title:'Daniel reply',triggerAt:addMinutesISO(fixed,1),status:'queued',visibility:'hidden',npcId:'daniel',payload:{respondingTo:null,incomingBody:'Yeah, I can come by in about an hour.',topic:'plans',engineVersion:4,worldEffects:[{op:'create_commitment',commitment:{npcId:'daniel',title:'Daniel visits',expectedAt:addMinutesISO(fixed,60),locationId:'home',activity:'hanging out',duration_minutes:90,status:'confirmed'}}]}}; e.state.scheduledEvents.push(event); e.advanceTime(2); assert(e.state.commitments.some(c=>c.title==='Daniel visits'&&c.status==='confirmed'),'Text world effect did not persist a commitment.'); });

    check('57 — Scheduled call commitment completes after the call is handled', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:57})); const c=e.createCommitment({npcId:'daniel',title:'Daniel calls',expectedAt:addMinutesISO(fixed,5),activity:'call Jonathan',kind:'call',durationMinutes:8,status:'confirmed'}); e.advanceTime(6); assert(c.status==='active','Call commitment did not activate.'); assert(e.state.ui.incomingCall&&e.state.ui.incomingCall.commitmentId===c.id,'Call commitment did not produce a linked incoming call.'); e.resolveIncomingCall('decline'); assert(c.status==='completed','Handled call commitment remained active.'); });

    check('58 — Deterministic shower controls persist water-flow state', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:58})); e.perform('turn the shower on'); assert(e.environment('home').waterFlow===true,'Shower-on action did not persist water flow.'); e.perform('turn the shower off'); assert(e.environment('home').waterFlow===false,'Shower-off action did not clear water flow.'); });

    // Milestone 5 — cross-system consistency and dynamic world expansion.
    check('59 / A — Dynamic Best Buy travel creates and persists a destination', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:59})); const r=e.perform('Drive to Best Buy'); assert(r.results[0].ok!==false,'Best Buy travel was rejected.'); const loc=e.state.locations[e.state.world.playerLocationId]; assert(loc&&/best buy/i.test(loc.name)&&loc.dynamic===true,'Dynamic Best Buy was not created.'); assert(e.state.player.knownLocationIds.includes(loc.id),'Dynamic location was not learned.'); });
    check('60 / B — Revisit reuses the same dynamic location', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:60})); e.perform('Drive to Best Buy'); const first=e.state.world.playerLocationId; e.perform('Drive home'); e.perform('Go back to Best Buy'); assert(e.state.world.playerLocationId===first,'Return trip did not reuse known Best Buy.'); });
    check('61 / C — Impossible destination does not become world truth', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:61})); const before=Object.keys(e.state.locations).length; const r=e.perform('Drive to the moon'); assert(r.results[0].ok===false,'Moon travel was accepted.'); assert(Object.keys(e.state.locations).length===before,'Impossible destination was added to world state.'); });
    check('62 / D — Online Switch 2 purchase creates an order, not carried inventory', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:62})); const before=e.state.player.money.checking; const r=e.perform('Buy a Nintendo Switch 2 on Amazon'); const o=e.state.orders.find(x=>/switch 2/i.test(x.productName)); assert(r.results[0].ok!==false&&o&&o.status==='ordered','Online order was not created.'); assert(e.state.player.money.checking<before,'Purchase did not deduct money.'); assert(!Object.values(e.state.entities).some(x=>/switch 2/i.test(x.name)),'Online item appeared before delivery.'); });
    check('63 / E — Delivery creates the ordered product', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:63})); e.perform('Buy a Nintendo Switch 2 on Amazon'); const o=e.state.orders.find(x=>/switch 2/i.test(x.productName)); e.advanceTime(minutesBetween(e.state.world.now,o.estimatedDeliveryAt)+1); assert(o.status==='delivered','Order did not become delivered.'); assert(Object.values(e.state.entities).some(x=>/switch 2/i.test(x.name)),'Delivered Switch 2 entity missing.'); });
    check('64 / F — Physical store purchase creates an unscripted product entity', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:64})); e.perform('Drive to Best Buy'); const r=e.perform('Buy a controller'); assert(r.results[0].ok!==false,'Controller purchase failed.'); assert(Object.values(e.state.entities).some(x=>/controller/i.test(x.name)&&x.owner==='jonathan'),'Controller entity was not created.'); });
    check('65 / G — Daniel communication style is casual and removes em dashes', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:65})); const out=e.applyCommunicationStyle(e.state.npcs.daniel,'Still at home, my bad—I lost track of time.'); assert(!out.includes('—'),'Daniel text retained an em dash.'); assert(out.length>5,'Styled message became unusable.'); });
    check('66 / H — Explicit text agreement creates a structured commitment', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:66})); const n=e.state.npcs.daniel,thread=n.phone.threadId; e.state.messages[thread].push({id:'m5_h',at:fixed,senderId:'jonathan',recipientId:'daniel',body:'Sure, how about 9 tonight?',read:true}); const c=e.inferCommitmentFromConversation(n,"9 works for me. i'll head over then",thread); assert(c&&c.status==='confirmed'&&c.locationId==='home','Text agreement did not create a visit commitment.'); });
    check('67 / I — Wait until Daniel shows up uses the confirmed commitment', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:67})); const n=e.state.npcs.daniel,thread=n.phone.threadId; e.state.messages[thread].push({id:'m5_i',at:fixed,senderId:'jonathan',recipientId:'daniel',body:'How about 9 tonight?',read:true}); e.inferCommitmentFromConversation(n,"9 works for me. i'll head over then",thread); const r=e.perform('Wait until Daniel shows up'); assert(r.results[0].ok!==false,'Wait request failed.'); assert(n.current.locationId==='home'&&n.current.scheduleOverride,'Daniel did not authoritatively arrive.'); });
    check('68 / J — Arrival keeps scene/world scheduling on one authoritative location', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:68})); const c=e.createCommitment({npcId:'daniel',title:'Daniel visit',expectedAt:addMinutesISO(fixed,10),locationId:'home',activity:'hanging out',status:'confirmed'}); e.advanceTime(11); const n=e.state.npcs.daniel; assert(n.current.locationId==='home','Authoritative location is wrong.'); assert(n.current.scheduleOverride&&n.current.scheduleOverride.commitmentId===c.id,'Schedule override is not linked to the visit.'); });
    check('69 / L — Sustained positive history can produce a stronger People label', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:69})); const n=e.state.npcs.daniel; Object.assign(n.relationship,{familiarity:92,trust:82,affection:84,resentment:0}); for(let i=0;i<6;i++)e.state.interactionHistory.push({npcId:'daniel',quality:.7,at:addMinutesISO(fixed,i)}); assert(e.deriveRelationshipLabel(n)==='Best friend','Sustained close friendship did not derive Best friend.'); });
    check('70 / M — One positive interaction cannot create Best friend', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:70})); const n=e.state.npcs.daniel; Object.assign(n.relationship,{familiarity:60,trust:60,affection:65}); e.state.interactionHistory.push({npcId:'daniel',quality:.8,at:fixed}); assert(e.deriveRelationshipLabel(n)!=='Best friend','Best friend label appeared prematurely.'); });
    check('71 / N — Stat explanation is grounded in the actual skill state', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:71})); const x=e.explainStat('creativity'); assert(x&&x.value===Number(e.state.player.skills.creativity)&&x.reasons.length,'Creativity explanation is not grounded in state.'); });
    check('72 / O — Sleep debt appears in relevant stat explanations', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:72})); e.state.player.condition.sleepDebtHours=6; const x=e.explainStat('focus'); assert(x.reasons.some(r=>/sleep debt/i.test(r)),'Poor sleep was not identified as a focus contributor.'); });
    check('73 / P — Player narration cannot force an unwanted kiss', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:73})); const n=e.state.npcs.daniel; n.current.locationId='home'; Object.assign(n.relationship,{familiarity:25,affection:30,trust:35,attraction:0}); const r=e.resolvePhysicalSocial({type:'physical_social',raw:'Daniel kisses Jonathan',npcId:'daniel',kind:'kiss',npcInitiated:true}); assert(r.ok===false,'Unwanted kiss was accepted as objective truth.'); });
    check('74 / Q — Consensual affection can succeed when relationship/context support it', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:74})); const n=e.state.npcs.daniel; n.current.locationId='home'; Object.assign(n.relationship,{familiarity:80,affection:80,trust:80,attraction:70,resentment:0,fear:0}); n.relationshipMilestones.mutualAttraction=true; const r=e.resolvePhysicalSocial({type:'physical_social',raw:'I kiss Daniel',npcId:'daniel',kind:'kiss',npcInitiated:false}); assert(r.ok===true,'Supported consensual kiss was rejected.'); });
    check('75 / R — Physical interaction requires co-location', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:75})); e.state.npcs.daniel.current.locationId='daniel_home'; const r=e.resolvePhysicalSocial({type:'physical_social',raw:'I hug Daniel',npcId:'daniel',kind:'hug'}); assert(r.ok===false&&/not physically here/i.test(r.narrative),'Remote physical interaction was allowed.'); });

    check('77 / T — Urgent condition exposes player-appropriate resolution details', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:77})); e.upsertUrgentCondition('head_test',{title:'Head injury needs attention',text:'Head injury concern remains unresolved.',reason:'Jonathan hit his head and has not been evaluated.',resolutionActions:['Go to urgent care'],resolutionPredicate:'Medical evaluation required.'}); const d=e.urgentDetails('head_test'); assert(d&&/head injury/i.test(d.title)&&d.resolutionActions.some(x=>/urgent care/i.test(x)),'Urgent detail did not expose resolution path.'); });
