<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0c1016" />
<title>AI Sandbox — Realistic Life V1.2</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0c1016;
  --panel: #121925;
  --panel-2: #182131;
  --panel-3: #202c3e;
  --text: #eef3f8;
  --muted: #9aa8b8;
  --line: rgba(255,255,255,.10);
  --accent: #79a8ff;
  --accent-2: #9ec2ff;
  --good: #79d69f;
  --warn: #ffc66d;
  --bad: #ff8a8a;
  --shadow: 0 20px 60px rgba(0,0,0,.35);
  --radius: 18px;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
body { min-height: 100dvh; }
button, textarea, input { font: inherit; }
button { color: inherit; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.hidden { display: none !important; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

#app { min-height: 100dvh; }

.landing {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 24px;
  background: radial-gradient(circle at 50% 0%, rgba(121,168,255,.13), transparent 42%), var(--bg);
}
.landing-card {
  width: min(520px, 100%);
  border: 1px solid var(--line);
  background: rgba(18,25,37,.94);
  border-radius: 28px;
  padding: clamp(28px, 7vw, 48px);
  box-shadow: var(--shadow);
}
.eyebrow { color: var(--accent-2); text-transform: uppercase; letter-spacing: .14em; font-size: 12px; font-weight: 800; }
.landing h1 { margin: 10px 0 8px; font-size: clamp(36px, 11vw, 62px); line-height: .95; letter-spacing: -.04em; }
.landing p { color: var(--muted); line-height: 1.55; margin: 0 0 28px; }
.landing-actions { display: grid; gap: 12px; }
.primary, .secondary, .danger, .ghost {
  border: 1px solid transparent;
  border-radius: 14px;
  min-height: 48px;
  padding: 12px 16px;
  font-weight: 750;
  cursor: pointer;
}
.primary { background: var(--accent); color: #07101d; }
.secondary { background: var(--panel-3); border-color: var(--line); }
.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
.danger { background: rgba(255,138,138,.10); color: #ffb7b7; border-color: rgba(255,138,138,.3); }
button:disabled { opacity: .38; cursor: default; }

.game-shell {
  width: min(980px, 100%);
  margin: 0 auto;
  min-height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  background: var(--bg);
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  background: rgba(12,16,22,.92);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.time-block { min-width: 0; }
.game-time { font-weight: 850; letter-spacing: .035em; font-size: 13px; text-transform: uppercase; }
.game-location { color: var(--muted); margin-top: 4px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.save-indicator { font-size: 11px; color: var(--good); white-space: nowrap; }
.icon-btn { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }

.main-stage { padding: 18px 16px 130px; }
.scene-card {
  border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(24,33,49,.92), rgba(18,25,37,.92));
  border-radius: var(--radius);
  padding: clamp(20px, 5vw, 34px);
  min-height: 270px;
  box-shadow: 0 12px 40px rgba(0,0,0,.22);
}
.scene-label { color: var(--muted); text-transform: uppercase; letter-spacing: .14em; font-size: 11px; font-weight: 800; margin-bottom: 18px; }
.scene-text { font-size: clamp(18px, 3.4vw, 23px); line-height: 1.6; white-space: pre-line; letter-spacing: -.01em; }

.suggestions-section { margin-top: 18px; }
.section-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.section-heading h2 { margin: 0; font-size: 14px; }
.section-heading span { color: var(--muted); font-size: 12px; }
.suggestions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
.suggestion {
  text-align: left;
  min-height: 66px;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 14px;
  padding: 11px 12px;
  cursor: pointer;
}
.suggestion:hover { background: var(--panel-2); }
.suggestion .cat { display: block; color: var(--accent-2); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; font-weight: 850; margin-bottom: 5px; }
.suggestion .txt { display: block; line-height: 1.3; font-size: 14px; }

.composer-wrap {
  position: fixed;
  z-index: 25;
  left: 50%;
  bottom: 64px;
  transform: translateX(-50%);
  width: min(948px, calc(100% - 24px));
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: rgba(18,25,37,.96);
  box-shadow: 0 18px 50px rgba(0,0,0,.42);
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.composer {
  width: 100%;
  min-height: 46px;
  max-height: 140px;
  resize: vertical;
  border: 0;
  background: transparent;
  color: var(--text);
  padding: 12px;
  line-height: 1.35;
}
.composer::placeholder { color: #718094; }
.do-btn { min-width: 74px; min-height: 46px; padding: 10px 16px; border: 0; border-radius: 12px; background: var(--accent); color: #07101d; font-weight: 900; cursor: pointer; }

.bottom-nav {
  position: fixed;
  z-index: 24;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: min(980px, 100%);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: rgba(12,16,22,.97);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(14px);
}
.nav-btn { min-height: 58px; border: 0; background: transparent; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .04em; cursor: pointer; }
.nav-btn.active { color: var(--text); background: rgba(121,168,255,.08); }

.drawer {
  position: fixed;
  z-index: 40;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: min(980px, 100%);
  max-height: min(78dvh, 760px);
  background: #101722;
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 24px 24px 0 0;
  box-shadow: 0 -18px 70px rgba(0,0,0,.55);
  overflow: hidden;
  display: grid;
  grid-template-rows: auto 1fr;
}
.drawer-head { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
.drawer-head h2 { margin: 0; font-size: 18px; }
.drawer-body { overflow-y: auto; padding: 16px; }
.close-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; width: 40px; height: 40px; cursor: pointer; }

.cards { display: grid; gap: 10px; }
.card { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 14px; }
.card h3 { margin: 0 0 5px; font-size: 16px; }
.card p { color: var(--muted); margin: 6px 0 0; line-height: 1.45; }
.meta { color: var(--muted); font-size: 12px; }
.row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.stack { display: grid; gap: 10px; }
.pill { display: inline-flex; align-items: center; min-height: 26px; padding: 4px 9px; border-radius: 999px; background: var(--panel-3); color: var(--muted); font-size: 11px; font-weight: 700; }
.money { font-variant-numeric: tabular-nums; font-weight: 850; }
.divider { height: 1px; background: var(--line); margin: 14px 0; }

.subtabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; }
.subtab { white-space: nowrap; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 999px; padding: 9px 12px; cursor: pointer; font-size: 12px; }
.subtab.active { color: var(--text); border-color: rgba(121,168,255,.45); background: rgba(121,168,255,.10); }

.thread-list { display: grid; gap: 8px; }
.thread { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 12px; cursor: pointer; }
.thread.unread { border-color: rgba(121,168,255,.52); }
.thread-preview { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; margin-top: 4px; }
.message-list { display: grid; gap: 8px; margin: 12px 0; }
.bubble { width: fit-content; max-width: 84%; padding: 10px 12px; border-radius: 14px; line-height: 1.4; font-size: 14px; }
.bubble.in { background: var(--panel-3); }
.bubble.out { background: rgba(121,168,255,.20); margin-left: auto; }
.bubble-time { display: block; color: var(--muted); font-size: 10px; margin-top: 5px; }
.inline-compose { display: flex; gap: 8px; position: sticky; bottom: 0; background: #101722; padding-top: 8px; }
.inline-compose input { flex: 1; min-width: 0; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 10px 12px; }
.inline-compose button { border: 0; border-radius: 12px; background: var(--accent); color: #07101d; font-weight: 800; padding: 0 14px; }

.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--panel); }
.stat strong { display: block; margin-top: 3px; }
.skill-groups { display: grid; gap: 14px; }
.skill-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.skill-row:last-child { border-bottom: 0; }

.event-status { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.event-status.missed { color: var(--bad); }
.event-status.attended, .event-status.completed { color: var(--good); }
.event-status.queued, .event-status.started { color: var(--warn); }

.debug-panel {
  position: fixed;
  z-index: 60;
  inset: 0;
  background: rgba(5,8,12,.98);
  display: grid;
  grid-template-rows: auto auto 1fr;
}
.debug-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.debug-head h2 { margin: 0; }
.debug-actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.debug-content { overflow: auto; padding: 16px; }
.debug-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin-bottom: 16px; }
.debug-pre { background: #070a0f; border: 1px solid var(--line); border-radius: 12px; padding: 12px; overflow: auto; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
.test-pass { color: var(--good); }
.test-fail { color: var(--bad); }

.toast { position: fixed; z-index: 80; left: 50%; top: 18px; transform: translateX(-50%); background: #202c3e; border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 999px; padding: 10px 14px; font-size: 12px; }

@media (max-width: 620px) {
  .suggestions { grid-template-columns: 1fr; }
  .main-stage { padding-left: 12px; padding-right: 12px; padding-bottom: 132px; }
  .scene-card { min-height: 230px; }
  .scene-text { font-size: 18px; }
  .save-indicator { display: none; }
  .composer-wrap { width: calc(100% - 16px); bottom: 61px; }
  .do-btn { min-width: 62px; }
  .nav-btn { font-size: 9px; }
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .drawer { max-height: 82dvh; }
}

@media (min-width: 780px) {
  .main-stage { padding-top: 26px; }
  .suggestions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

</style>
</head>
