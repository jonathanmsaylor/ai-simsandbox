    check('79 / V — Player cannot self-declare a medical diagnosis', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:79})); e.state.player.condition.injured=true;e.upsertUrgentCondition('head_test','Head injury concern needs evaluation.','high'); e.perform("A doctor said I'm fine"); assert(e.state.player.condition.injured===true&&e.state.urgentConditions.some(x=>x.id==='head_test'&&x.active!==false),'Bare diagnosis assertion changed objective medical state.'); });
    check('80 / W — A valid completed simulated medical encounter can resolve the concern', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:80})); e.state.player.condition.injured=true;e.upsertUrgentCondition('head_test','Head injury concern needs evaluation.','high'); const loc=e.resolveOrCreateLocation('Nearby Urgent Care',{services:['medical','urgent_care']}).location; e.state.world.playerLocationId=loc.id; e.completeMedicalEncounter(loc.id); assert(!e.state.player.condition.injured&&!e.state.urgentConditions.some(x=>x.id==='head_test'&&x.active!==false),'Completed encounter did not resolve a mild concern.'); });
    check('81 / X — Rejected proposals remain detailed in DEV state without mutating world', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:81})); const r=e.applyMilestone4Resolution('test',{world_effects:[{op:'move_entity',entity_id:'missing_one',location_id:'home'},{op:'move_entity',entity_id:'missing_two',location_id:'home'}]}); assert(r.rejected===2&&e.state.ui.lastWorldEffects.rejected.length===2,'Rejected proposal details were not retained for DEV.'); });
    check('82 / AA — Milestone 4 save-shaped state migrates to Milestone 5 without loss', () => { const old=createInitialState({startTime:fixed,seed:82}); old.schemaVersion=4; delete old.orders;delete old.serviceEncounters; const e=new SimulationEngine(JSON.parse(JSON.stringify(old))); assert(e.state.schemaVersion===5&&Array.isArray(e.state.orders)&&Array.isArray(e.state.appointments),'M4 save migration failed.'); assert(e.state.messages.thread_daniel,'Existing messages were lost during migration.'); });

    // Appointment / booking regression suite AB–AJ.
    check('83 / AB — Oil-change booking creates a confirmed persistent appointment', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:83})); const r=e.perform('Schedule an oil change for tomorrow at 10 AM'); const ap=e.state.appointments.find(a=>/oil/i.test(a.title)&&/10:00/.test(a.startAt)); assert(r.results[0].ok!==false&&ap&&['confirmed','rescheduled'].includes(ap.status),'Oil-change booking was not created.'); });
    check('84 / AC — Confirmed booking is linked into Calendar events', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:84})); e.perform('Schedule an oil change for tomorrow at 10 AM'); const ap=e.state.appointments.find(a=>/oil/i.test(a.title)); assert(ap&&e.state.scheduledEvents.some(ev=>ev.appointmentId===ap.id&&ev.visibility==='known'),'Appointment was not linked to Calendar.'); });
    check('85 / AD — Wait until appointment advances to the real booking', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:85})); e.perform('Schedule an oil change for tomorrow at 10 AM'); const ap=e.state.appointments.find(a=>/oil/i.test(a.title)&&a.source==='free-form booking'); const r=e.perform('Wait until my oil-change appointment'); assert(r.results[0].ok!==false&&asDate(e.state.world.now)>=asDate(ap.startAt),'Wait did not advance to appointment.'); assert(e.state.world.playerLocationId===ap.locationId,'Wait-to-appointment did not enter appointment context.'); });
    check('86 / AE — Reschedule updates the same booking and removes the old trigger', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:86})); e.perform('Schedule an oil change for tomorrow at 10 AM'); const ap=e.state.appointments.find(a=>/oil/i.test(a.title)&&a.source==='free-form booking'),id=ap.id,old=ap.startAt; const r=e.perform('Reschedule my oil change to Wednesday at 11 AM'); assert(r.results[0].ok!==false&&ap.id===id&&ap.startAt!==old,'Reschedule did not update same booking.'); const ev=e.state.scheduledEvents.find(x=>x.id===ap.linkedEventId);assert(ev.triggerAt===ap.startAt,'Calendar trigger did not move with appointment.'); });
    check('87 / AF — Cancellation updates appointment and linked event', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:87})); e.perform('Schedule an oil change for tomorrow at 10 AM'); const ap=e.state.appointments.find(a=>/oil/i.test(a.title)&&a.source==='free-form booking'); e.perform('Cancel my oil change appointment'); assert(ap.status==='cancelled','Appointment was not cancelled.'); assert(e.state.scheduledEvents.find(x=>x.id===ap.linkedEventId).status==='cancelled','Linked calendar event was not cancelled.'); });
    check('88 / AG — Service completion updates car maintenance and appointment status', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:88})); e.perform('Schedule an oil change for tomorrow at 10 AM'); const ap=e.state.appointments.find(a=>/oil/i.test(a.title)); e.state.world.playerLocationId=ap.locationId;ap.status='attended'; const r=e.completeAppointment(ap); const car=e.state.player.possessions.find(x=>x.id==='car'); assert(r.ok&&ap.status==='completed'&&car.properties&&car.properties.lastOilChangeAt,'Oil-change completion did not update car/service state.'); });
    check('89 / AH — Communication/AI-confirmed booking can create world appointment state', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:89})); const r=e.applyMilestone4Resolution('',{world_effects:[{op:'create_appointment',appointment:{title:'Dental appointment',serviceType:'dentist appointment',startAt:addMinutesISO(fixed,1440),provider:'Nearby Dental Office',source:'provider text confirmation'}}]}); assert(r.accepted===1&&e.state.appointments.some(a=>/dental/i.test(a.title)&&a.source==='provider text confirmation'),'Communication-established booking did not persist.'); });
    check('90 / AI — Bare appointment assertion does not create a booking', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:90})); const before=e.state.appointments.length; e.perform('I have a haircut appointment tomorrow'); assert(e.state.appointments.length===before,'Bare assertion created an appointment.'); });
    check('91 / AJ — Appointment survives JSON save/reload with linkage and reminder', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:91})); e.perform('Schedule a dentist appointment for tomorrow at 10 AM'); const before=e.state.appointments.find(a=>/dentist/i.test(a.serviceType)); assert(before,'Appointment missing before save.'); const restored=new SimulationEngine(JSON.parse(JSON.stringify(e.state))); const after=restored.state.appointments.find(a=>a.id===before.id); assert(after&&after.startAt===before.startAt&&after.linkedEventId===before.linkedEventId&&after.reminderMinutes===before.reminderMinutes,'Appointment did not survive save/reload.'); });
    check('92 — Unknown-price purchase fails clearly instead of charging $0', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:92})); const r=e.perform('Buy a toaster'); assert(r.results[0].ok===false,'Unknown-price local purchase unexpectedly succeeded.'); assert(/(?:price.*not established|needs a price)/i.test(r.results[0].narrative),'Unknown-price purchase did not request price resolution cleanly.'); });
    check('93 — Natural mechanic get-me-in phrasing creates a booking', () => { const e=new SimulationEngine(createInitialState({startTime:fixed,seed:93})); const r=e.perform('Call the mechanic and get me in tomorrow morning'); assert(r.results[0].ok!==false,'Natural mechanic booking phrase was not resolved.'); const ap=e.state.appointments.find(a=>/automotive|service/i.test(a.serviceType||a.title)); assert(ap&&['confirmed','rescheduled'].includes(ap.status),'Mechanic booking was not persisted.'); assert(/Auto Service|mechanic|service/i.test(e.state.locations[ap.locationId]?.name||''),'Mechanic/service location was not established.'); });

    return report;
  }

  return {
    SCHEMA_VERSION,
    DEFAULT_SAVE_KEY,
    createInitialState,
    SimulationEngine,
    LocalNarrativeProvider,
    ActionInterpreter,
    runAcceptanceTests,
    helpers: { nowISO, addMinutesISO, minutesBetween, formatMoney, relationDescriptor, skillDescriptor, publicNPCView, clone, cannabisPriceForGrams, estimateSemimonthlyWithholding },
  };
});

</script>
<script>
(function () {
  'use strict';

  const Core = window.AISandboxEngine;
  const { createInitialState, SimulationEngine, LocalNarrativeProvider, runAcceptanceTests, helpers } = Core;
  const { formatMoney, relationDescriptor, skillDescriptor, publicNPCView } = helpers;

  class StateStore {
    constructor(key = Core.DEFAULT_SAVE_KEY) { this.key = key; }
    exists() { try { return Boolean(localStorage.getItem(this.key)); } catch (_) { return false; } }
    save(state) {
      try {
        localStorage.setItem(this.key, JSON.stringify(state));
        return { ok: true };
      } catch (err) { return { ok: false, error: err.message }; }
    }
    load() {
      try {
        const raw = localStorage.getItem(this.key);
        if (!raw) return null;
        const state = JSON.parse(raw);
        if (!state || !Number.isFinite(Number(state.schemaVersion)) || Number(state.schemaVersion) > Core.SCHEMA_VERSION) throw new Error('Save schema is newer than this build.');
        return state;
      } catch (err) { return { __loadError: err.message }; }
    }
    delete() { try { localStorage.removeItem(this.key); return true; } catch (_) { return false; } }
  }

  class SandboxApp {
    constructor(root) {
      this.root = root;
      this.store = new StateStore();
      this.engine = null;
      this.drawer = null;
      this.phoneTab = 'messages';
      this.phoneThread = null;
      this.calendarEventId = null;
      this.debugTests = null;
      this.toastTimer = null;
      this.typingNpcId = null;
      this.urgentConditionId = null;
      this.lastRenderedThread = null;
      this.threadStickToBottom = true;
      this.renderLanding();
    }

    esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    formatGameDate(iso) {
      const d = new Date(iso);
      const weekday = d.toLocaleDateString(undefined, { weekday: 'long' }).toUpperCase();
      const date = d.toLocaleDateString(undefined, { month: 'long', day: 'numeric' }).toUpperCase();
      const time = d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }).toUpperCase();
      return `${weekday} • ${date} • ${time}`;
    }

    shortDate(iso) {
      const d = new Date(iso);
      return d.toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    }

    toast(text) {
      clearTimeout(this.toastTimer);
      let el = document.querySelector('.toast');
      if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
      el.textContent = text; el.classList.remove('hidden');
      this.toastTimer = setTimeout(() => el.classList.add('hidden'), 1800);
    }

    renderLanding() {
      const hasSave = this.store.exists();
      this.root.innerHTML = `
        <main class="landing">
          <section class="landing-card">
            <div class="eyebrow">Persistent simulation</div>
            <h1>AI SANDBOX</h1>
            <p>Realistic Life V1.5. Cross-system world truth, dynamic places, purchases, appointments, contextual AI dialogue, evolving relationships, and local saves.</p>
            <div class="landing-actions">
              <button class="primary" id="newGameBtn">NEW GAME</button>
              <button class="secondary" id="continueBtn" ${hasSave ? '' : 'disabled'}>CONTINUE</button>
            </div>
            <div class="meta" style="margin-top:18px">Core simulation and saves run locally in this browser. Optional Luna dialogue/free-form interpretation uses your private owner-configured backend and API billing.</div>
          </section>
        </main>`;
      document.getElementById('newGameBtn').addEventListener('click', () => this.newGame());
      document.getElementById('continueBtn').addEventListener('click', () => this.continueGame());
    }

    newGame() {
      this.engine = new SimulationEngine(createInitialState(), new LocalNarrativeProvider());
      this.persist('New game saved');
      this.renderGame();
    }

    continueGame() {
      const loaded = this.store.load();
      if (!loaded || loaded.__loadError) {
        this.toast(loaded && loaded.__loadError ? loaded.__loadError : 'No save found');
        return;
      }
      this.engine = new SimulationEngine(loaded, new LocalNarrativeProvider());
      this.renderGame();
    }

    persist(message) {
      if (!this.engine) return;
      const res = this.store.save(this.engine.state);
      if (message) this.toast(res.ok ? message : `Save failed: ${res.error}`);
      this.updateHeader();
    }

    renderGame() {
      this.root.innerHTML = `
        <div class="game-shell">
          <header class="topbar">
            <div class="time-block">
              <div class="game-time" id="gameTime"></div>
              <div class="game-location" id="gameLocation"></div>
            </div>
            <div class="top-actions">
              <span class="save-indicator" id="saveIndicator">Autosaved</span>
              <button class="icon-btn" id="debugBtn" aria-label="Developer debug panel" title="Debug">DEV</button>
            </div>
          </header>
          <main class="main-stage">
            <div id="alertArea"></div>
            <section class="scene-card" aria-live="polite">
              <div class="scene-label">Scene</div>
              <div class="scene-text" id="sceneText"></div>
              <div class="feedback-strip" id="feedbackStrip"></div>
            </section>

              <div class="section-heading"><h2>Possible actions</h2><span>Suggestions, not limits</span></div>
              <div class="suggestions" id="suggestions"></div>
            </section>
          </main>
          <div class="composer-wrap">
            <div class="composer-main">
              <textarea class="composer" id="composer" rows="1" placeholder="Do or say anything…" aria-label="Do or say anything"></textarea>

            <button class="nav-btn" data-tab="phone">PHONE</button>
            <button class="nav-btn" data-tab="map">MAP</button>
            <button class="nav-btn" data-tab="people">PEOPLE</button>
            <button class="nav-btn" data-tab="journal">JOURNAL</button>
            <button class="nav-btn" data-tab="recent">RECENT</button>

          <div class="drawer-body" id="drawerBody"></div>
        </section>
        <section class="debug-panel hidden" id="debugPanel">
          <div class="debug-head"><h2>Developer / Debug</h2><button class="close-btn" id="debugClose">✕</button></div>
          <div class="debug-actions">
            <button class="secondary" id="debugSave">Save now</button>
            <button class="secondary" id="debugTests">Run acceptance tests</button>
            <button class="secondary" id="debugExport">Export save</button>
            <button class="secondary" id="debugImport">Import save</button>
            <button class="danger" id="debugReset">Delete save</button>
            <input class="hidden" type="file" accept="application/json" id="importFile" />
          </div>
          <div class="debug-content" id="debugContent"></div>
        </section>`;

      document.getElementById('doBtn').addEventListener('click', () => this.submitComposer());
      document.getElementById('composer').addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.submitComposer(); }
      });
      document.getElementById('composer').addEventListener('input', e => this.updateComposerEstimate(e.target.value));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.addEventListener('click', () => this.openDrawer(btn.dataset.tab)));
      document.getElementById('drawerClose').addEventListener('click', () => this.closeDrawer());
      document.getElementById('debugBtn').addEventListener('click', () => this.openDebug());
      document.getElementById('debugClose').addEventListener('click', () => this.closeDebug());
      document.getElementById('debugSave').addEventListener('click', () => this.persist('Saved'));
      document.getElementById('debugTests').addEventListener('click', () => { this.debugTests = runAcceptanceTests(); this.renderDebug(); });
      document.getElementById('debugExport').addEventListener('click', () => this.exportSave());
      document.getElementById('debugImport').addEventListener('click', () => document.getElementById('importFile').click());
      document.getElementById('importFile').addEventListener('change', e => this.importSave(e.target.files && e.target.files[0]));
      document.getElementById('debugReset').addEventListener('click', () => this.resetSave());
      this.renderWorld();
    }

    updateHeader() {
      if (!this.engine || !document.getElementById('gameTime')) return;
      const s = this.engine.state;
      document.getElementById('gameTime').textContent = this.formatGameDate(s.world.now);
      document.getElementById('gameLocation').textContent = s.locations[s.world.playerLocationId].name;
      document.getElementById('saveIndicator').textContent = 'Autosaved';
    }

    renderWorld() {
      const s = this.engine.state;
      this.updateHeader();
      document.getElementById('sceneText').textContent = s.ui.lastNarrative;
      const alertArea=document.getElementById('alertArea');
      if(alertArea){
        const urgent=(s.urgentConditions||[]).filter(u=>u.active!==false);
        const incoming=s.ui.incomingCall;
        const normal=(s.ui.pendingAlerts||[]).find(a=>!a.read);
        const urgentHtml=urgent.length?`<div class="urgent-stack">${urgent.map(u=>`<button class="urgent-alert" data-urgent-id="${this.esc(u.id)}"><strong>URGENT</strong><div>${this.esc(u.text)}</div><div class="meta" style="margin-top:5px">Tap for details</div></button>`).join('')}</div>`:'';
        const callNpc=incoming&&s.npcs[incoming.npcId];
        const callHtml=callNpc?`<div class="incoming-call"><strong>Incoming call — ${this.esc(callNpc.name)}</strong><div class="meta" style="margin-top:4px">The call occurred as game time crossed ${this.esc(this.shortDate(incoming.startedAt))}.</div><div class="incoming-call-actions"><button class="primary" data-call-choice="answer">Answer</button><button class="secondary" data-call-choice="decline">Decline</button><button class="ghost" data-call-choice="ignore">Ignore</button></div></div>`:'';
        const normalHtml=normal?`<div class="alert-banner"><div><strong>${this.esc(normal.title||'Alert')}</strong><div>${this.esc(normal.text||'')}</div></div><button data-dismiss-alert="${this.esc(normal.id)}" aria-label="Dismiss alert">✕</button></div>`:'';
        alertArea.innerHTML=urgentHtml+callHtml+normalHtml;
        const dismiss=alertArea.querySelector('[data-dismiss-alert]'); if(dismiss) dismiss.addEventListener('click',()=>{const a=(s.ui.pendingAlerts||[]).find(x=>x.id===dismiss.dataset.dismissAlert);if(a)a.read=true;this.persist();this.renderWorld();});
        alertArea.querySelectorAll('[data-call-choice]').forEach(b=>b.addEventListener('click',()=>{ const r=this.engine.resolveIncomingCall(b.dataset.callChoice); if(r&&r.narrative){this.engine.state.ui.lastNarrative=r.narrative;} this.persist(); this.renderWorld(); }));
        alertArea.querySelectorAll('[data-urgent-id]').forEach(b=>b.addEventListener('click',()=>{this.urgentConditionId=b.dataset.urgentId;this.drawer='urgent';document.getElementById('drawer').classList.remove('hidden');this.renderDrawer();}));
      }
      const fb=document.getElementById('feedbackStrip'); if(fb){ const items=Array.isArray(s.ui.lastFeedback)?s.ui.lastFeedback:[]; fb.innerHTML=items.map(x=>`<span class="feedback-chip ${(x.tone||'')==='warn'?'warn':''}">${this.esc(typeof x==='string'?x:x.text)}</span>`).join(''); }
      const sug = document.getElementById('suggestions');
      sug.innerHTML = s.ui.suggestions.map((x, i) => { const mins=x.uiAction?null:this.engine.estimateActionDuration(x.text); const timing=mins?this.durationLabel(mins):''; return `<button class="suggestion" data-suggestion="${i}"><span class="cat">${this.esc(x.category)}</span><span class="txt">${this.esc(x.text)}</span>${timing?`<span class="duration">${this.esc(timing)}</span>`:''}</button>`; }).join('');
      sug.querySelectorAll('[data-suggestion]').forEach(btn => btn.addEventListener('click', () => {
        const item = s.ui.suggestions[Number(btn.dataset.suggestion)];
        if (!item) return;
        const uiAction=this.inferUIAction(item);
        if (uiAction) this.executeUIAction(uiAction);
        else this.runAction(item.text);
      }));
      if (this.drawer) this.renderDrawer();
    }

    durationLabel(minutes) {
      const m=Math.max(1,Math.round(Number(minutes)||1)); const end=new Date(new Date(this.engine.state.world.now).getTime()+m*60000);
      const amount=m>=60?`~${Math.floor(m/60)}h${m%60?` ${m%60}m`:''}`:`~${m} min`;
      return `${amount} · ends around ${end.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}`;
    }

    updateComposerEstimate(text) {
      const el=document.getElementById('composerEstimate'); if(!el||!this.engine)return; const raw=String(text||'').trim(); if(!raw){el.textContent='';return;} const mins=this.engine.estimateActionDuration(raw); el.textContent=mins?this.durationLabel(mins):'';
    }

    inferUIAction(item) {
      if(item && item.uiAction) return item.uiAction;
      const t=String(item&&item.text||'').toLowerCase();
      if(/unread message|check.*messages/.test(t)) return {type:'open_unread_messages'};
      if(/check.*calendar|open.*calendar/.test(t)) return {type:'open_phone_tab',tab:'calendar'};
      if(/bank balance|check.*bank/.test(t)) return {type:'open_phone_tab',tab:'bank'};
      if(/look.*contacts|check.*contacts/.test(t)) return {type:'open_phone_tab',tab:'contacts'};
      if(/check.*map|open.*map/.test(t)) return {type:'open_drawer',tab:'map'};
      if(/recent events|recent actions/.test(t)) return {type:'open_drawer',tab:'recent'};
      if(/active situations|check.*journal/.test(t)) return {type:'open_drawer',tab:'journal'};
      const m=t.match(/(?:message|reply to|text)\s+(maya|daniel|dad|eli)/); if(m) return {type:'open_message_thread',npcId:m[1]};
      return null;
    }

    executeUIAction(action) {
      const s=this.engine.state; if(!action) return false;
      if(action.type==='open_unread_messages'){
        this.drawer='phone'; this.phoneTab='messages';
        const unread=Object.values(s.npcs).filter(n=>n.phone && (s.messages[n.phone.threadId]||[]).some(m=>m.recipientId==='jonathan'&&!m.read));
        this.phoneThread=unread.length===1?unread[0].id:null; if(this.phoneThread) this.engine.markThreadRead(s.npcs[this.phoneThread].phone.threadId); document.getElementById('drawer').classList.remove('hidden'); this.persist(); this.renderDrawer(); return true;
      }
      if(action.type==='open_phone_tab'){
        this.drawer='phone'; this.phoneTab=action.tab||'messages'; this.phoneThread=null; this.calendarEventId=null; document.getElementById('drawer').classList.remove('hidden'); this.renderDrawer(); return true;
      }
      if(action.type==='open_message_thread'){
        this.drawer='phone'; this.phoneTab='messages'; this.phoneThread=action.npcId||null; if(this.phoneThread&&s.npcs[this.phoneThread]) this.engine.markThreadRead(s.npcs[this.phoneThread].phone.threadId); document.getElementById('drawer').classList.remove('hidden'); this.persist(); this.renderDrawer(); return true;
      }
      if(action.type==='open_drawer'){
        this.openDrawer(action.tab); return true;
      }
      return false;
    }

    submitComposer() {
      const input = document.getElementById('composer');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      this.updateComposerEstimate('');
      this.runAction(text);
    }

    async runAction(text) {
      const btn = document.getElementById('doBtn');
      if (btn) btn.disabled = true;
      try {
        // Milestone 2: ambiguous/free-form actions are interpreted by Luna first,
        // but the local simulation remains authoritative over what state changes
        // are actually allowed. Deterministic actions stay local and cheap.
        if (this.shouldUseAIActionResolution(text)) {
          const handled = await this.tryRemoteActionResolution(text);
          if (handled) {
            this.persist();
            this.renderWorld();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }
        }

        const outcome = this.engine.perform(text);
        this.persist();
        this.renderWorld();
        window.scrollTo({ top: 0, behavior: 'smooth' });

        // Text-message dialogue uses Luna to replace the queued local fallback.
        const textResults = (outcome && outcome.results || []).filter(r => r && r.type === 'text' && r.outgoingMessageId);
        for (const result of textResults) await this.tryRemoteDialogue(result);
      } catch (err) {
        console.error(err);
        this.toast(`Action error: ${err.message}`);
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    shouldUseAIActionResolution(text) {
      if (!this.getAIEndpoint() || !this.getAIAccessToken()) return false;
      const raw = String(text || '').trim();
      if (!raw) return false;
      // Phone messages have their own contextual dialogue path.
      if (/^(?:text|message)\b/i.test(raw)) return false;
      const actions = this.engine.interpretAction(raw);
      if (!actions.length) return true;
      if (actions.some(a => a.type === 'generic' || a.type === 'talk' || a.type === 'eat')) return true;
      // Milestone 5 handles clear named travel, bookings, purchases, waits, and physical attempts locally so the validator remains authoritative and AI spend stays low.
      if (actions.length===1 && actions[0].type==='travel' && actions[0].destinationText) return false;
      if (actions.length===1 && ['booking','wait','physical'].includes(actions[0].type)) return false;
      if (actions.length===1 && actions[0].type==='purchase' && actions[0].itemName && Number(actions[0].amount)>0) return false;
      if (actions.some(a => a.type === 'travel' && !a.destinationId && !a.destinationText)) return true;
      if (/\b(flirt|kiss|hug|compliment|argue|insult|apologize|smoke|weed|cannabis|drink|beer|wine|cocktail|work\s*out|workout|exercise|meditate|study|read|clean|game|gaming|relax|dance|sing|practice|stretch|run|jog)\b/i.test(raw)) return true;
      if (actions.length > 1 && actions.some(a => !['travel','grab','wait','sleep','purchase'].includes(a.type))) return true;
      return false;
    }

    buildAIActionContext(text) {
      const s = this.engine.state;
      const loc = s.locations[s.world.playerLocationId];
      const presentNpcs = Object.values(s.npcs).filter(n => n.current.locationId === s.world.playerLocationId).map(n => ({
        id: n.id, name: n.name, occupation: n.occupation, personality: n.personality, current: n.current, relationship: n.relationship,
        knowledge: n.knowledge, beliefs: n.beliefs, recentMemories: (n.memories || []).slice(-6), unresolvedProblems: n.plans && n.plans.unresolvedProblems || [],
      }));
      return {
        type: 'action_resolution',
        playerAction: String(text),
        worldTime: s.world.now,
        worldMode: s.world.mode,
        location: { id: loc.id, name: loc.name, type: loc.type, description: loc.description, objects: loc.objects || [] },
        player: {
          name: s.player.name, condition: s.player.condition, money: s.player.money, inventory: s.player.inventory,
          possessions: s.player.possessions.map(p => ({ id: p.id, name: p.name, locationId: p.locationId, portable: p.portable })),
          skills: s.player.skills, employment: s.player.employment, consumables: s.player.consumables,
        },
        presentNpcs,
        knownLocations: s.player.knownLocationIds.map(id => { const l=s.locations[id]; return l&&({ id, name:l.name, type:l.type, category:l.category, services:l.services||[], coords:l.coords||null, dynamic:Boolean(l.dynamic) }); }).filter(Boolean),
        appointments: (s.appointments||[]).filter(a=>['tentative','confirmed','attended'].includes(a.status)).slice(0,30),
        orders: (s.orders||[]).filter(o=>!['cancelled','delivered'].includes(o.status)).slice(0,20),
        activeSituations: s.activeSituations.filter(x => x.status === 'active' && x.playerKnows !== false).map(x => ({ id: x.id, title: x.title, involvedPeople: x.involvedPeople, knownInformation: x.knownInformation || [], deadlineAt: x.deadlineAt, urgency: x.urgency })),
        entities: Object.values(s.entities||{}).filter(e=>e.locationId===s.world.playerLocationId||e.owner==='jonathan').slice(0,80).map(e=>({id:e.id,name:e.name,category:e.category,subtype:e.subtype,owner:e.owner,locationId:e.locationId,containerId:e.containerId,quantity:e.quantity,unit:e.unit,condition:e.condition,state:e.state,properties:e.properties})),
        environment: s.environments&&s.environments[s.world.playerLocationId]||null,
        activeCommitments: (s.commitments||[]).filter(c=>['confirmed','active'].includes(c.status)).slice(0,30),
        urgentConditions: (s.urgentConditions||[]).filter(u=>u.active!==false).map(u=>({id:u.id,text:u.text,severity:u.severity})),
        implementationCapabilities: {
          conditionDeltas: ['energy','hunger','stress','hydration','health','pain','hygiene','bladder','socialConnection','mood','focus','fitness','intimacyNeed','security','sleepDebtHours'],
          temporaryStatuses: true,
          statusModifiers: ['coordination','composure','driving'],
          relationships: ['trust','affection','respect','attraction','fear','resentment'],
          skillPractice: Object.keys(s.player.skills),
          moneyTransactions: true,
          generalInjuryFlagOnly: true,
          existingSituationUpdates: true,
          consumables: { cannabis_flower: { unit:'g', quantity:s.player.consumables.cannabisFlower.quantity, lowThreshold:s.player.consumables.cannabisFlower.lowThreshold } },
          visibleFeedback: true,
          npcMemories: true,
          genericWorldEffects: ['create_entity','update_entity','move_entity','consume_entity','remove_entity','transfer_entity','set_environment','create_npc','learn_phone_number','set_npc_presence','create_commitment','record_interaction','urgent_condition','clear_urgent_condition','schedule_event','create_location','discover_location','move_player','create_order','purchase_item','create_appointment','reschedule_appointment','cancel_appointment','physical_interaction'],
          arbitraryNewInventoryObjects: 'allowed only with plausible acquisition/source and deterministic validation',
          detailedMedicalSimulation: false,
          employmentPayrollIsDeterministicLocal: true,
        },
      };
    }

    async tryRemoteActionResolution(text) {
      const endpoint = this.getAIEndpoint();
      const accessToken = this.getAIAccessToken();
      if (!endpoint || !accessToken) return false;
      try {
        this.setAIStatus('resolving-action', endpoint);
        const response = await fetch(endpoint, { method: 'POST', headers: this.aiRequestHeaders(), body: JSON.stringify(this.buildAIActionContext(text)) });
        let data = null; try { data = await response.json(); } catch (_) {}
        if (!response.ok) {
          const serverMessage = data && (data.error || data.message);
          throw new Error(`AI action endpoint ${response.status}${serverMessage ? `: ${serverMessage}` : ''}`);
        }
        if (!data || (data.type !== 'action_resolution' && data.kind !== 'action_resolution')) throw new Error('Backend does not yet support Milestone 2 action_resolution');
        if (typeof data.narrative !== 'string') throw new Error('AI action response is missing narrative');
        this.recordAIUsage(data);
        this.engine.applyAIActionResolution(text, data);
        this.setAIStatus('connected', `Milestone 2 action resolved: ${data.narrative.slice(0, 140)}`);
        return true;
      } catch (err) {
        console.warn('Remote action interpretation unavailable; local fallback used.', err);
        this.setAIStatus('error', err.message);
        this.engine.log('ai', `Remote free-action interpretation unavailable (${err.message}).`);
        return false;
      }
    }

    getAIEndpoint() {
      try { return (localStorage.getItem('aiSandboxAiEndpoint') || '').trim(); }
      catch (_) { return ''; }
    }

    normalizeAIEndpoint(value) {
      let clean = String(value || '').trim();
      if (!clean) return '';
      try {
        const u = new URL(clean);
        if (/\.vercel\.app$/i.test(u.hostname) && (!u.pathname || u.pathname === '/')) {
          u.pathname = '/api/dialogue';
        }
        clean = u.toString().replace(/\/$/, '');
      } catch (_) {
        clean = clean.replace(/\/$/, '');
      }
      return clean;
    }

    setAIEndpoint(value) {
      const clean = this.normalizeAIEndpoint(value);
      try {
        if (clean) localStorage.setItem('aiSandboxAiEndpoint', clean);
        else localStorage.removeItem('aiSandboxAiEndpoint');
      } catch (_) {}
      return clean;
    }


    getAIAccessToken() {
      try { return (localStorage.getItem('aiSandboxAiAccessToken') || '').trim(); }
      catch (_) { return ''; }
    }

    setAIAccessToken(value) {
      const clean = String(value || '').trim();
      try {
        if (clean) localStorage.setItem('aiSandboxAiAccessToken', clean);
        else localStorage.removeItem('aiSandboxAiAccessToken');
      } catch (_) {}
      return clean;
    }

    aiRequestHeaders() {
      const token = this.getAIAccessToken();
      return {
        'Content-Type': 'application/json',
        ...(token ? { 'X-AI-Sandbox-Token': token } : {}),
      };
    }

    setAIStatus(status, detail = '') {
      const payload = { status, detail: String(detail || ''), at: new Date().toISOString() };
      try { localStorage.setItem('aiSandboxAiStatus', JSON.stringify(payload)); } catch (_) {}
      return payload;
    }

    getAIStatus() {
      try {
        const raw = localStorage.getItem('aiSandboxAiStatus');
        return raw ? JSON.parse(raw) : null;
      } catch (_) { return null; }
    }


    getAIUsageStats() {
      try {
        const raw = localStorage.getItem('aiSandboxAiUsage');
        return raw ? JSON.parse(raw) : { requests: 0, inputTokens: 0, cachedInputTokens: 0, outputTokens: 0, estimatedCost: 0, last: null };
      } catch (_) { return { requests: 0, inputTokens: 0, cachedInputTokens: 0, outputTokens: 0, estimatedCost: 0, last: null }; }
    }

    recordAIUsage(data) {
      const u = data && data.usage ? data.usage : null;
      if (!u) return null;
      const input = Number(u.input_tokens ?? u.inputTokens ?? 0) || 0;
      const output = Number(u.output_tokens ?? u.outputTokens ?? 0) || 0;
      const cached = Number(u.cached_input_tokens ?? u.cachedInputTokens ?? (u.input_tokens_details && u.input_tokens_details.cached_tokens) ?? 0) || 0;
      const uncached = Math.max(0, input - cached);
      // GPT-5.6 Luna standard text rates as of Sep 2026:
      // $0.20 / 1M uncached input, $0.02 / 1M cached input, $1.20 / 1M output.
      const cost = (uncached * 0.20 + cached * 0.02 + output * 1.20) / 1000000;
      const stats = this.getAIUsageStats();
      stats.requests = (stats.requests || 0) + 1;
      stats.inputTokens = (stats.inputTokens || 0) + input;
      stats.cachedInputTokens = (stats.cachedInputTokens || 0) + cached;
      stats.outputTokens = (stats.outputTokens || 0) + output;
      stats.estimatedCost = (stats.estimatedCost || 0) + cost;
      stats.last = { inputTokens: input, cachedInputTokens: cached, outputTokens: output, totalTokens: Number(u.total_tokens ?? u.totalTokens ?? (input + output)) || (input + output), estimatedCost: cost, at: new Date().toISOString(), model: data.model || 'gpt-5.6-luna' };
      try { localStorage.setItem('aiSandboxAiUsage', JSON.stringify(stats)); } catch (_) {}
      return stats.last;
    }

    clearAIUsageStats() {
      try { localStorage.removeItem('aiSandboxAiUsage'); } catch (_) {}
    }

    formatAICost(value) {
      const n = Number(value || 0);
      if (n < 0.0001) return `$${n.toFixed(6)}`;
      if (n < 0.01) return `$${n.toFixed(5)}`;
      return `$${n.toFixed(4)}`;
    }

    buildNPCDialogueContext(npcId, outgoingMessageId) {
      const s = this.engine.state;
      const npc = s.npcs[npcId];
      if (!npc || !npc.phone) return null;
      const thread = (s.messages[npc.phone.threadId] || []).slice(-14).map(m => ({
        sender: m.senderId === 'jonathan' ? 'Jonathan' : npc.name,
        text: m.body,
        at: m.at,
      }));
      const message = (s.messages[npc.phone.threadId] || []).find(m => m.id === outgoingMessageId);
      const situations = s.activeSituations
        .filter(x => x.status === 'active' && x.playerKnows !== false && Array.isArray(x.involvedPeople) && x.involvedPeople.includes(npc.id))
        .map(x => ({ title: x.title, knownInformation: x.knownInformation || [], urgency: x.urgency || 'normal' }));
      const memories = (npc.memories || []).slice(-8).map(m => ({
        event: m.event, timestamp: m.timestamp, importance: m.importance, consequences: m.consequences || []
      }));
      // Keep this payload aligned with the Vercel /api/dialogue contract.
      // The backend expects recentMessages, playerMessage, and knownSituations.
      // We also retain the older aliases for backwards compatibility with any
      // previously deployed worker/backend version.
      return {
        type: 'npc_reply',
        worldTime: s.world.now,
        playerName: s.player.name,
        playerCurrentLocation: { id:s.world.playerLocationId, name:s.locations[s.world.playerLocationId]&&s.locations[s.world.playerLocationId].name },
        knownLocations: s.player.knownLocationIds.map(id=>({id,name:s.locations[id]&&s.locations[id].name})).filter(x=>x.name),
        activeCommitments: (s.commitments||[]).filter(c=>c.involvedNpcIds&&c.involvedNpcIds.includes(npc.id)&&['confirmed','active'].includes(c.status)).slice(0,12),
        npc: {
          id: npc.id,
          name: npc.name,
          occupation: npc.occupation,
          personality: npc.personality,
          communicationStyle: npc.communicationStyle || {},
          boundaries: npc.boundaries || {},
          relationshipMilestones: npc.relationshipMilestones || {},
          publicRelationshipLabel: npc.publicRelationshipLabel || null,
          current: {
            locationId: npc.current && npc.current.locationId,

    async tryRemoteDialogue(result) {
      const endpoint = this.getAIEndpoint();
      const accessToken = this.getAIAccessToken();
      if (!endpoint || !accessToken || !result || !result.replyEventId) return false;
      const event = this.engine.state.scheduledEvents.find(e => e.id === result.replyEventId && e.status === 'queued');
      if (!event) return false;
      const context = this.buildNPCDialogueContext(result.npcId, result.outgoingMessageId);
      if (!context) return false;
      try {
        const pendingDelay=Math.max(0,minutesBetween(this.engine.state.world.now,event.triggerAt));
        this.typingNpcId=pendingDelay<=10?result.npcId:null; if(this.drawer==='phone'&&this.phoneTab==='messages')this.renderDrawer();
        this.setAIStatus('requesting', endpoint);
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: this.aiRequestHeaders(),
          body: JSON.stringify(context),
        });
        let data = null;
        try { data = await response.json(); } catch (_) {}
        if (!response.ok) {
          const serverMessage = data && (data.error || data.message || data.details);
          throw new Error(`AI endpoint ${response.status}${serverMessage ? `: ${typeof serverMessage === 'string' ? serverMessage : JSON.stringify(serverMessage).slice(0, 240)}` : ''}`);
        }
        const reply = String(data && data.reply || '').trim();
        if (!reply || reply.length > 1200) throw new Error('AI returned an invalid reply');
        this.recordAIUsage(data);

        // Re-check because game state may have advanced while the network request was pending.
        const pending = this.engine.state.scheduledEvents.find(e => e.id === result.replyEventId && e.status === 'queued');
        if (!pending) return false;
        pending.payload.incomingBody = reply;
        pending.payload.dialogueProvider = data.model || 'gpt-5.6-luna';
        pending.payload.aiGenerated = true;
        if (data && data.social) pending.payload.social = data.social;
        if (data && Array.isArray(data.world_effects)) pending.payload.worldEffects = data.world_effects.slice(0,12);
        this.setAIStatus('connected', `${pending.payload.dialogueProvider}: ${reply.slice(0, 140)}`);
        this.engine.log('ai', `Remote dialogue prepared for ${this.engine.state.npcs[result.npcId].name} using ${pending.payload.dialogueProvider}.`);
        this.typingNpcId=null; if(this.drawer==='phone'&&this.phoneTab==='messages')this.renderDrawer();
        this.persist();
        return true;
      } catch (err) {
        this.typingNpcId=null; if(this.drawer==='phone'&&this.phoneTab==='messages')this.renderDrawer();
        console.warn('Remote dialogue unavailable; local fallback retained.', err);
        this.setAIStatus('error', err.message);
        this.engine.log('ai', `Remote dialogue unavailable; local fallback retained (${err.message}).`);
        this.persist();
        return false;
      }
    }

    openDrawer(tab) {
      this.drawer = tab;

      document.getElementById('drawer').classList.remove('hidden');

      this.drawer = null;

    renderDrawer() {
      if (!this.drawer) return;
      const oldList=document.getElementById('messageList');
      if(oldList && this.lastRenderedThread===this.phoneThread) this.threadStickToBottom=(oldList.scrollHeight-oldList.scrollTop-oldList.clientHeight)<110;
      const title = this.drawer==='urgent' ? 'URGENT CONDITION' : this.drawer.toUpperCase();
      document.getElementById('drawerTitle').textContent = title;
      const body = document.getElementById('drawerBody');
      if (this.drawer === 'character') body.innerHTML = this.characterHTML();
      if (this.drawer === 'phone') body.innerHTML = this.phoneHTML();
      if (this.drawer === 'map') body.innerHTML = this.mapHTML();
      if (this.drawer === 'people') body.innerHTML = this.peopleHTML();
      if (this.drawer === 'journal') body.innerHTML = this.journalHTML();
      if (this.drawer === 'recent') body.innerHTML = this.recentHTML();
      if (this.drawer === 'urgent') body.innerHTML = this.urgentHTML();
      this.bindDrawerActions();
      if(this.drawer==='phone'&&this.phoneTab==='messages'&&this.phoneThread){
        const isNew=this.lastRenderedThread!==this.phoneThread; const should=isNew||this.threadStickToBottom;
        this.lastRenderedThread=this.phoneThread;
        if(should) requestAnimationFrame(()=>{const list=document.getElementById('messageList');if(list)list.scrollTop=list.scrollHeight;});
      }
    }

      const active = s.activeSituations.filter(x => x.status === 'active' && x.playerKnows !== false);
      const done = s.activeSituations.filter(x => x.status !== 'active' && x.playerKnows !== false);
      return `<h3>Active situations</h3><div class="cards">${active.map(x => `<div class="card"><div class="row"><strong>${this.esc(x.title)}</strong><span class="pill">${this.esc(x.urgency)}</span></div>${x.knownInformation.map(k => `<p>${this.esc(k)}</p>`).join('')}</div>`).join('') || '<p class="meta">Nothing active.</p>'}</div><div class="divider"></div><h3>Recent events</h3><div class="cards">${s.journal.recentMajorEvents.map(x => `<div class="card"><strong>${this.esc(x.text)}</strong><div class="meta">${this.shortDate(x.at)}</div></div>`).join('') || '<p class="meta">No major recent events.</p>'}</div>${done.length ? `<div class="divider"></div><h3>Resolved / expired</h3><div class="cards">${done.map(x => `<div class="card"><strong>${this.esc(x.title)}</strong><div class="meta">${this.esc(x.status)}</div></div>`).join('')}</div>`:''}`;
    }

    recentHTML() {
      const s=this.engine.state, feed=Array.isArray(s.activityFeed)?s.activityFeed:[];
      return `<div class="cards">${feed.length?feed.slice(0,120).map(e=>`<div class="card recent-entry"><div class="recent-kind">${this.esc(e.kind)}</div><div style="margin-top:5px">${this.esc(e.text)}</div><div class="meta" style="margin-top:6px">${this.shortDate(e.at)}</div></div>`).join(''):'<p class="meta">No recent logged actions yet.</p>'}</div><p class="meta" style="margin-top:12px">This feed shows only changes Jonathan could reasonably notice. Hidden beliefs, exact relationship scores, private NPC activity, and secret simulation state remain in DEV only.</p>`;
    }

    bindDrawerActions() {
      document.querySelectorAll('[data-phone-tab]').forEach(b => b.addEventListener('click', () => { this.phoneTab = b.dataset.phoneTab; this.phoneThread = null; this.calendarEventId=null; this.renderDrawer(); }));
      document.querySelectorAll('[data-open-thread]').forEach(b => b.addEventListener('click', () => {
        this.drawer = 'phone'; this.phoneTab = 'messages'; this.phoneThread = b.dataset.openThread;
        const npc = this.engine.state.npcs[this.phoneThread];
        this.engine.markThreadRead(npc.phone.threadId); this.persist(); this.renderDrawer();
      }));
      const back = document.querySelector('[data-thread-back]'); if (back) back.addEventListener('click', () => { this.phoneThread = null; this.renderDrawer(); });
      document.querySelectorAll('[data-calendar-event]').forEach(b=>b.addEventListener('click',()=>{this.calendarEventId=b.dataset.calendarEvent;this.renderDrawer();}));
      const calBack=document.querySelector('[data-calendar-back]'); if(calBack) calBack.addEventListener('click',()=>{this.calendarEventId=null;this.renderDrawer();});
      document.querySelectorAll('[data-reminder]').forEach(b=>b.addEventListener('click',()=>{ const v=b.dataset.reminder==='off'?null:Number(b.dataset.reminder); if(this.engine.setCalendarReminder(this.calendarEventId,v)){this.persist('Reminder updated');this.renderDrawer();} }));
      document.querySelectorAll('[data-send-thread]').forEach(b => b.addEventListener('click', () => {
        const input = document.getElementById('threadInput'); const body = input.value.trim(); if (!body) return;
        const npc = this.engine.state.npcs[b.dataset.sendThread]; this.runAction(`Text ${npc.name}: ${body}`); this.phoneThread = npc.id; this.renderDrawer();
      }));
      const threadInput = document.getElementById('threadInput'); if (threadInput) threadInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); document.querySelector('[data-send-thread]').click(); } });
      const messageList=document.getElementById('messageList'); if(messageList) messageList.addEventListener('scroll',()=>{this.threadStickToBottom=(messageList.scrollHeight-messageList.scrollTop-messageList.clientHeight)<110;},{passive:true});
      document.querySelectorAll('[data-stat-key]').forEach(b=>b.addEventListener('click',()=>{this.engine.state.ui.selectedStatKey=b.dataset.statKey;this.renderDrawer();}));
      const statClose=document.querySelector('[data-stat-close]'); if(statClose)statClose.addEventListener('click',()=>{this.engine.state.ui.selectedStatKey=null;this.renderDrawer();});
      document.querySelectorAll('[data-urgent-action]').forEach(b=>b.addEventListener('click',()=>{const action=b.dataset.urgentAction;if(!action)return;this.closeDrawer();this.runAction(action);}));
      document.querySelectorAll('[data-add-contact]').forEach(b=>b.addEventListener('click',()=>{const n=this.engine.state.npcs[b.dataset.addContact];if(n){n.phone.contactSaved=true;if(!this.engine.state.contacts.some(c=>c.npcId===n.id))this.engine.state.contacts.push({npcId:n.id,name:n.name,phone:'saved'});this.persist('Contact added');this.renderDrawer();}}));
      document.querySelectorAll('[data-remove-contact]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.removeContact,n=this.engine.state.npcs[id];this.engine.state.contacts=this.engine.state.contacts.filter(c=>c.npcId!==id);if(n)n.phone.contactSaved=false;this.persist('Contact removed');this.renderDrawer();}));
      document.querySelectorAll('[data-block-contact]').forEach(b=>b.addEventListener('click',()=>{const n=this.engine.state.npcs[b.dataset.blockContact];if(n){n.phone.blocked=!n.phone.blocked;this.persist(n.phone.blocked?'Contact blocked':'Contact unblocked');this.renderDrawer();}}));
      document.querySelectorAll('[data-rename-contact]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.renameContact,c=this.engine.state.contacts.find(x=>x.npcId===id);if(!c)return;const name=prompt('Contact name',c.name);if(name&&name.trim()){c.name=name.trim().slice(0,60);this.persist('Contact renamed');this.renderDrawer();}}));
      document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
        const loc = this.engine.state.locations[b.dataset.go]; this.closeDrawer(); this.runAction(`Drive to ${loc.name}`);
      }));
      const addNote = document.querySelector('[data-add-note]'); if (addNote) addNote.addEventListener('click', () => {
        const input = document.getElementById('noteInput'); const text = input.value.trim(); if (!text) return;
        this.engine.state.journal.playerNotes.push({ at: this.engine.state.world.now, text }); this.persist(); this.renderDrawer();
      });
    }

    pretty(key) { return key.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase()); }

    openDebug() { document.getElementById('debugPanel').classList.remove('hidden'); this.renderDebug(); }
    closeDebug() { document.getElementById('debugPanel').classList.add('hidden'); }

    renderDebug() {
      const s = this.engine.state; const el = document.getElementById('debugContent'); if (!el) return;
      const tests = this.debugTests ? `<div class="card"><h3>Acceptance tests</h3>${this.debugTests.map(t => `<div class="skill-row"><span>${this.esc(t.name)}</span><strong class="${t.pass ? 'test-pass':'test-fail'}">${t.pass ? 'PASS':'FAIL'}</strong></div><div class="meta" style="margin-bottom:8px">${this.esc(t.detail)}</div>`).join('')}</div><div class="divider"></div>` : '';
      const queued = s.scheduledEvents.filter(e => e.status === 'queued' || e.status === 'started').length;
      const aiEndpoint = this.getAIEndpoint();
      const aiAccessToken = this.getAIAccessToken();
      const aiStatus = this.getAIStatus();
      const statusText = aiStatus ? `${aiStatus.status}${aiStatus.detail ? ` — ${aiStatus.detail}` : ''}` : (aiEndpoint ? 'Configured; not tested yet.' : 'Local dialogue only.');
      const usage = this.getAIUsageStats();
      const lastUsage = usage.last;
      const usageHtml = lastUsage
        ? `<div class="divider"></div><h3 style="margin-bottom:8px">Luna usage</h3><div class="debug-summary"><div class="stat"><span class="meta">Last input</span><strong>${lastUsage.inputTokens.toLocaleString()} tokens</strong></div><div class="stat"><span class="meta">Last output</span><strong>${lastUsage.outputTokens.toLocaleString()} tokens</strong></div><div class="stat"><span class="meta">Last estimated cost</span><strong>${this.formatAICost(lastUsage.estimatedCost)}</strong></div><div class="stat"><span class="meta">Browser total</span><strong>${this.formatAICost(usage.estimatedCost)}</strong></div></div><div class="meta">${usage.requests} API request${usage.requests === 1 ? '' : 's'} tracked · ${usage.inputTokens.toLocaleString()} input · ${usage.outputTokens.toLocaleString()} output${usage.cachedInputTokens ? ` · ${usage.cachedInputTokens.toLocaleString()} cached input` : ''}. Cost is an estimate using current GPT-5.6 Luna standard token rates.</div>`
        : `<div class="divider"></div><div class="meta">Luna usage: waiting for the backend to return token usage.</div>`;
      const aiCard = `<div class="card"><h3>AI — Milestone 5 owner access</h3><p class="meta">Public players use local fallbacks by default. GPT-5.6 Luna handles owner NPC dialogue and ambiguous free-form actions; requests require your private owner token. The token is stored only in this browser and is never committed to GitHub.</p><div class="inline-compose"><input id="aiEndpointInput" placeholder="https://vercel-dialogue-api-project.vercel.app/api/dialogue" value="${this.esc(aiEndpoint)}" /><button id="aiEndpointSave">Save</button></div><div class="inline-compose" style="margin-top:8px"><input id="aiAccessTokenInput" type="password" autocomplete="off" placeholder="Owner access token" value="${this.esc(aiAccessToken)}" /><button id="aiAccessTokenSave">Save token</button></div><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="secondary" id="aiEndpointTest">Test connection</button><button class="ghost" id="aiUsageReset">Reset usage counter</button></div><div class="meta" style="margin-top:8px">Endpoint: ${this.esc(aiEndpoint || 'none')}</div><div class="meta" style="margin-top:4px">Owner token: ${aiAccessToken ? 'configured on this device' : 'not configured — Luna disabled'}</div><div class="meta" style="margin-top:4px">Last AI status: ${this.esc(statusText)}</div>${usageHtml}</div><div class="divider"></div>`;
      const npcDebug=Object.values(s.npcs).map(n=>({id:n.id,locationId:n.current.locationId,activity:n.current.activity,scheduleOverride:n.current.scheduleOverride,nextCommitment:(s.commitments||[]).filter(c=>c.involvedNpcIds&&c.involvedNpcIds.includes(n.id)&&['confirmed','active'].includes(c.status)).sort((a,b)=>new Date(a.expectedAt)-new Date(b.expectedAt))[0]||null,relationship:n.relationship,publicRelationshipLabel:n.publicRelationshipLabel,communicationStyle:n.communicationStyle,boundaries:n.boundaries,dynamics:n.relationshipDynamics}));
      const queuedEvents=(s.scheduledEvents||[]).filter(e=>['queued','started'].includes(e.status)).sort((a,b)=>new Date(a.triggerAt)-new Date(b.triggerAt));
      const commitments=(s.commitments||[]).filter(c=>['confirmed','active','tentative'].includes(c.status)).sort((a,b)=>new Date(a.expectedAt)-new Date(b.expectedAt));
      const appointments=(s.appointments||[]).slice().sort((a,b)=>new Date(a.startAt||0)-new Date(b.startAt||0));
      const details=(title,items)=>`<details class="debug-details"><summary>${this.esc(title)} (${items.length})</summary><div class="debug-detail-body">${items.length?items.map(x=>`<details class="debug-details"><summary>${this.esc(x.title||x.name||x.id||x.type||'item')}</summary><pre class="debug-pre">${this.esc(JSON.stringify(x,null,2))}</pre></details>`).join(''):'<div class="meta">None</div>'}</div></details>`;
      const m5Debug={dynamicLocations:Object.values(s.locations||{}).filter(l=>l.dynamic),orders:s.orders||[],serviceEncounters:s.serviceEncounters||[],activeHazards:(s.urgentConditions||[]).filter(x=>x.active!==false).map(u=>({...u,resolutionPredicate:this.engine.urgentPredicateDescription(u)})),npcs:npcDebug,needs:s.player.condition,consentHistory:(s.consentHistory||[]).slice(-30),causalHistory:(s.causalHistory||[]).slice(-40),lastWorldEffects:s.ui.lastWorldEffects};
      el.innerHTML = `${tests}${aiCard}<div class="debug-summary"><div class="stat"><span class="meta">World time</span><strong>${this.esc(s.world.now)}</strong></div><div class="stat"><span class="meta">Turn</span><strong>${s.meta.turn}</strong></div><div class="stat"><span class="meta">Queued events</span><strong>${queued}</strong></div><div class="stat"><span class="meta">Log entries</span><strong>${s.simulationLog.length}</strong></div></div>${details('Queued events',queuedEvents)}${details('Commitments',commitments)}${details('Appointments / bookings',appointments)}<h3>Milestone 5 cross-system state</h3><pre class="debug-pre">${this.esc(JSON.stringify(m5Debug,null,2))}</pre><div class="divider"></div><h3>Complete internal state</h3><pre class="debug-pre">${this.esc(JSON.stringify(s, null, 2))}</pre>`;
      const aiSave = document.getElementById('aiEndpointSave');
      if (aiSave) aiSave.addEventListener('click', () => {
        const input = document.getElementById('aiEndpointInput');
        const value = this.setAIEndpoint(input && input.value);
        this.setAIStatus(value ? 'configured' : 'disabled', value || '');
        this.toast(value ? 'AI endpoint saved' : 'AI endpoint cleared');
        this.renderDebug();
      });
      const tokenSave = document.getElementById('aiAccessTokenSave');
      if (tokenSave) tokenSave.addEventListener('click', () => {
        const input = document.getElementById('aiAccessTokenInput');
        const value = this.setAIAccessToken(input && input.value);
        this.setAIStatus(value ? 'owner-token-configured' : 'owner-token-cleared', '');
        this.toast(value ? 'Owner token saved on this device' : 'Owner token cleared');
        this.renderDebug();
      });
      const aiTest = document.getElementById('aiEndpointTest');
      if (aiTest) aiTest.addEventListener('click', async () => {
        const input = document.getElementById('aiEndpointInput');
        const endpoint = this.setAIEndpoint(input && input.value);
        const tokenInput = document.getElementById('aiAccessTokenInput');
        if (tokenInput) this.setAIAccessToken(tokenInput.value);
        if (!endpoint) { this.setAIStatus('error', 'No endpoint configured'); this.renderDebug(); return; }
        if (!this.getAIAccessToken()) { this.setAIStatus('error', 'Owner access token is not configured'); this.renderDebug(); return; }
        aiTest.disabled = true;
        this.setAIStatus('testing', endpoint);
        try {
          const testPayload = {
            type: 'npc_reply',
            npc: { name: 'Maya', personality: { conversationalStyle: 'direct' }, current: { mood: 'neutral' }, relationship: { label: 'Close Friend' }, knowledge: { factsKnown: [] }, beliefs: {}, memories: [], plans: {} },
            recentMessages: [{ sender: 'Maya', text: 'This week was ridiculous.' }, { sender: 'Jonathan', text: 'What happened?' }],
            playerMessage: 'What happened?',
            knownSituations: [],
            worldTime: this.engine.state.world.now,
          };
          const response = await fetch(endpoint, { method: 'POST', headers: this.aiRequestHeaders(), body: JSON.stringify(testPayload) });
          let data = null; try { data = await response.json(); } catch (_) {}
          if (!response.ok) throw new Error(`HTTP ${response.status}${data && data.error ? `: ${data.error}` : ''}`);
          const reply = String(data && data.reply || '').trim();
          if (!reply) throw new Error('No reply returned');
          this.recordAIUsage(data);
          this.setAIStatus('connected', reply.slice(0, 180));
        } catch (err) {
          this.setAIStatus('error', err.message);
        }
        this.renderDebug();
      });
      const aiUsageReset = document.getElementById('aiUsageReset');
      if (aiUsageReset) aiUsageReset.addEventListener('click', () => {
        this.clearAIUsageStats();
        this.toast('AI usage counter reset');
        this.renderDebug();
      });
    }

    exportSave() {
      const blob = new Blob([JSON.stringify(this.engine.state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob); const a = document.createElement('a');
      a.href = url; a.download = `ai-sandbox-save-${Date.now()}.json`; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000); this.toast('Save exported');
    }

    importSave(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!data || !Number.isFinite(Number(data.schemaVersion)) || Number(data.schemaVersion) > Core.SCHEMA_VERSION) throw new Error('Incompatible save version');
          this.engine = new SimulationEngine(data, new LocalNarrativeProvider()); this.persist('Save imported'); this.closeDebug(); this.renderGame();
        } catch (err) { this.toast(`Import failed: ${err.message}`); }
      };
      reader.readAsText(file);
    }

    resetSave() {
      if (!confirm('Delete the local AI Sandbox save? This cannot be undone unless you exported it.')) return;
      this.store.delete(); this.engine = null; this.renderLanding();
    }
  }

  window.addEventListener('DOMContentLoaded', () => new SandboxApp(document.getElementById('app')));
})();

</script>
</body>
</html>
